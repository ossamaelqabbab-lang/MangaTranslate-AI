<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MangaTranslate AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0e1117;
    color: white;
    font-family: Arial, Tahoma, sans-serif;
}

.app {
    max-width: 850px;
    margin: auto;
    padding: 18px;
}

header {
    text-align: center;
    padding: 15px 0;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    color: #9ca3af;
    margin-top: 8px;
}

.card {
    background: #171c26;
    border: 1px solid #293041;
    padding: 16px;
    border-radius: 15px;
    margin-bottom: 16px;
}

label {
    display: block;
    margin: 10px 0 7px;
    font-weight: bold;
}

input,
select,
button {
    width: 100%;
    border-radius: 10px;
    min-height: 48px;
    font-size: 16px;
}

input,
select {
    background: #222938;
    color: white;
    border: 1px solid #394258;
    padding: 10px;
}

#apiKey {
    direction: ltr;
}

.languages {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.upload {
    border: 2px dashed #4b5874;
    text-align: center;
    padding: 25px 10px;
    border-radius: 13px;
    cursor: pointer;
    background: #202634;
}

#imageInput {
    display: none;
}

button {
    border: 0;
    padding: 12px;
    margin-top: 12px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#translateButton {
    background: #6757e8;
}

#downloadButton {
    background: #099268;
    display: none;
}

#newButton {
    background: #30384b;
}

button:disabled {
    opacity: .5;
}

#status {
    padding-top: 14px;
    text-align: center;
    line-height: 1.6;
    white-space: pre-line;
}

.success {
    color: #4ade80;
}

.error {
    color: #ff6b6b;
}

.loading {
    color: #ffd166;
}

#canvasCard {
    display: none;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    background: white;
    border-radius: 10px;
}

#results {
    display: none;
}

.result {
    background: #232a38;
    border-radius: 10px;
    margin-bottom: 10px;
    padding: 11px;
}

.original {
    color: #9ca3af;
    margin-bottom: 6px;
    direction: auto;
}

.translation {
    font-weight: bold;
    font-size: 17px;
    direction: auto;
}

.note {
    font-size: 13px;
    color: #9ca3af;
    line-height: 1.6;
}

@media (max-width: 600px) {

    .languages {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>

<div class="app">

<header>

<h1>📖 MangaTranslate AI</h1>

<p>
ترجمة المانغا والقصص المصورة داخل الصورة
</p>

</header>


<div class="card">

<label>
🔑 Gemini API Key
</label>

<input
    id="apiKey"
    type="password"
    autocomplete="off"
    placeholder="ألصق مفتاح Gemini هنا"
/>

<p class="note">
المفتاح لا يتم حفظه داخل GitHub ولا داخل هذا الملف.
تضعه فقط عند تشغيل الموقع.
</p>


<label
    class="upload"
    for="imageInput"
>

📷 اضغط هنا واختر صورة المانغا

<br>

<small>
JPG / PNG / WEBP
</small>

</label>

<input
    id="imageInput"
    type="file"
    accept="image/*"
/>


<div class="languages">

<div>

<label>
لغة النص الأصلية
</label>

<select id="sourceLanguage">

<option value="Automatic">
اكتشاف تلقائي
</option>

<option value="Japanese">
اليابانية
</option>

<option value="English">
الإنجليزية
</option>

<option value="Korean">
الكورية
</option>

<option value="Chinese">
الصينية
</option>

<option value="French">
الفرنسية
</option>

<option value="Spanish">
الإسبانية
</option>

<option value="Indonesian">
الإندونيسية
</option>

</select>

</div>


<div>

<label>
الترجمة إلى
</label>

<select id="targetLanguage">

<option value="Arabic">
العربية
</option>

<option value="English">
الإنجليزية
</option>

<option value="French">
الفرنسية
</option>

<option value="Spanish">
الإسبانية
</option>

<option value="Japanese">
اليابانية
</option>

</select>

</div>

</div>


<button
    id="translateButton"
    disabled
>

✨ ترجمة الصورة

</button>


<button id="downloadButton">

⬇ حفظ الصورة المترجمة

</button>


<button id="newButton">

🗑 صورة جديدة

</button>


<div id="status">

اختر صورة للبدء

</div>

</div>


<div
    id="canvasCard"
    class="card"
>

<canvas id="canvas"></canvas>

</div>


<div
    id="results"
    class="card"
>

<h3>
📝 النصوص المكتشفة
</h3>

<div id="textResults"></div>

</div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const apiKeyInput =
    document.getElementById("apiKey");

const imageInput =
    document.getElementById("imageInput");

const sourceLanguage =
    document.getElementById("sourceLanguage");

const targetLanguage =
    document.getElementById("targetLanguage");

const translateButton =
    document.getElementById("translateButton");

const downloadButton =
    document.getElementById("downloadButton");

const newButton =
    document.getElementById("newButton");

const statusBox =
    document.getElementById("status");

const canvasCard =
    document.getElementById("canvasCard");

const results =
    document.getElementById("results");

const textResults =
    document.getElementById("textResults");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let preparedImage = null;
let preparedBase64 = null;


/* =========================
   STATUS
========================= */

function setStatus(text, type = "") {

    statusBox.textContent = text;

    statusBox.className = type;

}


/* =========================
   SELECT IMAGE
========================= */

imageInput.addEventListener(
    "change",
    async () => {

        const file =
            imageInput.files[0];

        if (!file) return;


        if (
            !file.type.startsWith("image/")
        ) {

            setStatus(
                "❌ الملف المختار ليس صورة.",
                "error"
            );

            return;
        }


        try {

            setStatus(
                "جاري تجهيز الصورة...",
                "loading"
            );


            const prepared =
                await prepareImage(file);


            preparedImage =
                prepared.image;

            preparedBase64 =
                prepared.base64;


            canvas.width =
                preparedImage.width;

            canvas.height =
                preparedImage.height;


            ctx.drawImage(
                preparedImage,
                0,
                0
            );


            canvasCard.style.display =
                "block";

            translateButton.disabled =
                false;

            downloadButton.style.display =
                "none";

            results.style.display =
                "none";


            setStatus(
                "✅ الصورة جاهزة.\nاضغط ترجمة الصورة.",
                "success"
            );

        }

        catch (error) {

            console.error(error);

            setStatus(
                "❌ تعذر تجهيز الصورة.",
                "error"
            );

        }

    }
);


/* =========================
   PREPARE IMAGE
========================= */

async function prepareImage(file) {

    const image =
        await fileToImage(file);


    let width =
        image.naturalWidth;

    let height =
        image.naturalHeight;


    const maxSize = 1800;


    if (
        width > maxSize ||
        height > maxSize
    ) {

        const ratio =
            Math.min(
                maxSize / width,
                maxSize / height
            );

        width =
            Math.round(
                width * ratio
            );

        height =
            Math.round(
                height * ratio
            );

    }


    const temp =
        document.createElement(
            "canvas"
        );


    temp.width =
        width;

    temp.height =
        height;


    const tempCtx =
        temp.getContext("2d");


    tempCtx.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    const dataURL =
        temp.toDataURL(
            "image/jpeg",
            0.90
        );


    const resized =
        new Image();


    await new Promise(
        (resolve, reject) => {

            resized.onload =
                resolve;

            resized.onerror =
                reject;

            resized.src =
                dataURL;

        }
    );


    return {

        image: resized,

        base64:
            dataURL.split(",")[1]

    };

}


/* =========================
   FILE -> IMAGE
========================= */

function fileToImage(file) {

    return new Promise(
        (resolve, reject) => {

            const url =
                URL.createObjectURL(
                    file
                );


            const img =
                new Image();


            img.onload =
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                    resolve(img);

                };


            img.onerror =
                reject;


            img.src =
                url;

        }
    );

}


/* =========================
   TRANSLATE
========================= */

translateButton.addEventListener(
    "click",
    async () => {

        const apiKey =
            apiKeyInput.value.trim();


        if (!apiKey) {

            setStatus(
                "❌ ألصق Gemini API Key أولاً.",
                "error"
            );

            return;
        }


        if (!preparedBase64) {

            setStatus(
                "❌ اختر صورة أولاً.",
                "error"
            );

            return;
        }


        translateButton.disabled =
            true;

        downloadButton.style.display =
            "none";

        results.style.display =
            "none";


        try {

            setStatus(
                "🔍 Gemini يقرأ الصفحة ويبحث عن النصوص...\nقد يستغرق ذلك عدة ثوانٍ.",
                "loading"
            );


            const prompt =
                createPrompt();


            const responseText =
                await callGemini(
                    apiKey,
                    prompt,
                    preparedBase64
                );


            console.log(
                "Gemini:",
                responseText
            );


            const blocks =
                parseResponse(
                    responseText
                );


            if (!blocks.length) {

                throw new Error(
                    "لم يتم العثور على نص قابل للترجمة."
                );

            }


            drawTranslation(
                blocks
            );


            showResults(
                blocks
            );


            downloadButton.style.display =
                "block";


            setStatus(
                "✅ تمت الترجمة بنجاح.\nعدد مناطق النص: " +
                blocks.length,
                "success"
            );

        }

        catch (error) {

            console.error(error);


            setStatus(
                "❌ حدث خطأ:\n" +
                (
                    error.message ||
                    String(error)
                ),
                "error"
            );

        }

        finally {

            translateButton.disabled =
                false;

        }

    }
);


/* =========================
   GEMINI
========================= */

async function callGemini(
    apiKey,
    prompt,
    base64
) {

    /*
       نحاول أحدث نموذج أولاً
       ثم ننتقل تلقائياً لبديل.
    */

    const models = [

        "gemini-3.8-flash",

        "gemini-3.6-flash",

        "gemini-3.5-flash"

    ];


    let lastError =
        "فشل الاتصال بـ Gemini";


    for (
        const model of models
    ) {

        try {

            setStatus(
                "🤖 جاري استخدام " +
                model +
                "...",
                "loading"
            );


            const url =
                "https://generativelanguage.googleapis.com/v1beta/models/" +
                model +
                ":generateContent";


            const response =
                await fetch(
                    url,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "x-goog-api-key":
                                apiKey

                        },

                        body:
                            JSON.stringify({

                                contents: [

                                    {

                                        role:
                                            "user",

                                        parts: [

                                            {

                                                text:
                                                    prompt

                                            },

                                            {

                                                inline_data: {

                                                    mime_type:
                                                        "image/jpeg",

                                                    data:
                                                        base64

                                                }

                                            }

                                        ]

                                    }

                                ],

                                generationConfig: {

                                    responseMimeType:
                                        "application/json"

                                }

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                const message =
                    data?.error?.message ||
                    "HTTP " +
                    response.status;


                /*
                 Key/auth problems:
                 no reason to try another model.
                */

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    throw new Error(
                        "مشكلة في مفتاح Gemini: " +
                        message
                    );

                }


                lastError =
                    message;

                continue;

            }


            const text =
                data
                    ?.candidates
                    ?.[0]
                    ?.content
                    ?.parts
                    ?.map(
                        p =>
                            p.text || ""
                    )
                    .join("");


            if (!text) {

                lastError =
                    "Gemini أعاد استجابة فارغة.";

                continue;

            }


            return text;

        }

        catch (error) {

            if (
                error.message
                    ?.includes(
                        "مشكلة في مفتاح Gemini"
                    )
            ) {

                throw error;

            }


            lastError =
                error.message ||
                String(error);

        }

    }


    throw new Error(
        lastError
    );

}


/* =========================
   PROMPT
========================= */

function createPrompt() {

    const source =
        sourceLanguage.value;

    const target =
        targetLanguage.value;


    return `

You are a professional manga/comic OCR and translation system.

Analyze the entire manga/comic image.

SOURCE LANGUAGE:
${source}

TARGET LANGUAGE:
${target}

Your job:

1. Detect every meaningful text region:
   - speech bubbles
   - narration boxes
   - captions
   - dialogue
   - important sound effects

2. Read the original text accurately.

3. Translate each region naturally into ${target}.

4. Detect the bounding box of the COMPLETE text region.

VERY IMPORTANT:

- Keep a complete speech bubble as one block.
- Do NOT split Japanese characters into separate blocks.
- Do NOT return one box per letter.
- Keep vertical Japanese text together when it belongs to the same region.
- Do not invent unreadable text.
- Ignore page numbers and meaningless marks.

Use bounding boxes normalized from 0 to 1000.

box_2d format MUST be:

[ymin, xmin, ymax, xmax]

Return ONLY a JSON array.

Example:

[
  {
    "box_2d": [100, 600, 300, 900],
    "original": "ありがとう",
    "translation": "شكراً",
    "type": "dialogue"
  }
]

Allowed types:

dialogue
narration
caption
sfx

No markdown.
No explanation.
Only JSON.

`;

}


/* =========================
   PARSE RESPONSE
========================= */

function parseResponse(text) {

    let cleaned =
        String(text)
        .trim()
        .replace(
            /```json/gi,
            ""
        )
        .replace(
            /```/g,
            ""
        )
        .trim();


    let parsed;


    try {

        parsed =
            JSON.parse(cleaned);

    }

    catch {

        const start =
            cleaned.indexOf("[");

        const end =
            cleaned.lastIndexOf("]");


        if (
            start === -1 ||
            end === -1
        ) {

            throw new Error(
                "Gemini لم يُرجع JSON صالحاً."
            );

        }


        parsed =
            JSON.parse(
                cleaned.slice(
                    start,
                    end + 1
                )
            );

    }


    if (
        !Array.isArray(parsed)
    ) {

        if (
            Array.isArray(
                parsed.blocks
            )
        ) {

            parsed =
                parsed.blocks;

        }

        else {

            throw new Error(
                "صيغة النتيجة غير صحيحة."
            );

        }

    }


    return parsed
        .map(normalizeBlock)
        .filter(Boolean);

}


/* =========================
   NORMALIZE
========================= */

function normalizeBlock(block) {

    if (
        !Array.isArray(
            block.box_2d
        ) ||
        block.box_2d.length < 4
    ) {

        return null;

    }


    let [
        ymin,
        xmin,
        ymax,
        xmax
    ] =
        block.box_2d.map(Number);


    ymin =
        clamp(ymin);

    xmin =
        clamp(xmin);

    ymax =
        clamp(ymax);

    xmax =
        clamp(xmax);


    if (
        ymax <= ymin ||
        xmax <= xmin
    ) {

        return null;

    }


    const original =
        String(
            block.original || ""
        ).trim();


    const translation =
        String(
            block.translation || ""
        ).trim();


    if (
        !original &&
        !translation
    ) {

        return null;

    }


    return {

        box_2d: [
            ymin,
            xmin,
            ymax,
            xmax
        ],

        original,

        translation:
            translation ||
            original,

        type:
            block.type ||
            "dialogue"

    };

}


function clamp(n) {

    return Math.max(
        0,
        Math.min(
            1000,
            Number(n)
        )
    );

}


/* =========================
   DRAW
========================= */

function drawTranslation(blocks) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.drawImage(
        preparedImage,
        0,
        0
    );


    blocks.forEach(
        block => {

            const [
                ymin,
                xmin,
                ymax,
                xmax
            ] =
                block.box_2d;


            const x =
                xmin / 1000 *
                canvas.width;

            const y =
                ymin / 1000 *
                canvas.height;

            const width =
                (
                    xmax -
                    xmin
                ) /
                1000 *
                canvas.width;

            const height =
                (
                    ymax -
                    ymin
                ) /
                1000 *
                canvas.height;


            drawTextBox(
                block.translation,
                x,
                y,
                width,
                height
            );

        }
    );

}


/* =========================
   DRAW TEXT BOX
========================= */

function drawTextBox(
    text,
    x,
    y,
    width,
    height
) {

    const padding =
        Math.max(
            5,
            Math.min(
                width,
                height
            ) * .07
        );


    ctx.save();


    /*
       تغطية النص الأصلي
    */

    ctx.fillStyle =
        "rgba(255,255,255,0.95)";


    roundRect(
        x,
        y,
        width,
        height,
        Math.min(
            15,
            width * .1,
            height * .1
        )
    );


    ctx.fill();


    let fontSize =
        Math.min(
            48,
            height * .30,
            width * .14
        );


    fontSize =
        Math.max(
            10,
            fontSize
        );


    const maxWidth =
        Math.max(
            10,
            width -
            padding * 2
        );


    const maxHeight =
        Math.max(
            10,
            height -
            padding * 2
        );


    let lines = [];


    while (
        fontSize >= 9
    ) {

        ctx.font =
            `bold ${fontSize}px Arial, Tahoma, sans-serif`;


        lines =
            wrapText(
                text,
                maxWidth
            );


        const lineHeight =
            fontSize * 1.22;


        if (
            lines.length *
            lineHeight <=
            maxHeight
        ) {

            break;

        }


        fontSize--;

    }


    const lineHeight =
        fontSize * 1.22;


    ctx.font =
        `bold ${fontSize}px Arial, Tahoma, sans-serif`;


    ctx.fillStyle =
        "#111";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.direction =
        targetLanguage.value ===
        "Arabic"
            ? "rtl"
            : "ltr";


    const totalHeight =
        lines.length *
        lineHeight;


    let lineY =
        y +
        height / 2 -
        totalHeight / 2 +
        lineHeight / 2;


    for (
        const line of lines
    ) {

        ctx.fillText(
            line,
            x + width / 2,
            lineY,
            maxWidth
        );


        lineY +=
            lineHeight;

    }


    ctx.restore();

}


/* =========================
   WRAP TEXT
========================= */

function wrapText(
    text,
    maxWidth
) {

    text =
        String(text)
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    if (!text) {

        return [];

    }


    const words =
        text.split(" ");


    const lines = [];

    let line =
        "";


    for (
        const word of words
    ) {

        const test =
            line
                ? line +
                  " " +
                  word
                : word;


        if (
            ctx.measureText(
                test
            ).width <=
            maxWidth
        ) {

            line =
                test;

        }

        else {

            if (line) {

                lines.push(
                    line
                );

            }


            /*
             Word too long:
             divide by characters.
            */

            if (
                ctx.measureText(
                    word
                ).width >
                maxWidth
            ) {

                let chars =
                    "";


                for (
                    const char of word
                ) {

                    const testChars =
                        chars +
                        char;


                    if (
                        ctx.measureText(
                            testChars
                        ).width >
                        maxWidth
                    ) {

                        if (chars) {

                            lines.push(
                                chars
                            );

                        }


                        chars =
                            char;

                    }

                    else {

                        chars =
                            testChars;

                    }

                }


                line =
                    chars;

            }

            else {

                line =
                    word;

            }

        }

    }


    if (line) {

        lines.push(
            line
        );

    }


    return lines;

}


/* =========================
   ROUND RECT
========================= */

function roundRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();


    ctx.roundRect(
        x,
        y,
        width,
        height,
        radius
    );

}


/* =========================
   RESULTS
========================= */

function showResults(blocks) {

    textResults.innerHTML =
        "";


    blocks.forEach(
        (block, index) => {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "result";


            const original =
                document.createElement(
                    "div"
                );


            original.className =
                "original";


            original.textContent =
                (index + 1) +
                ". الأصل: " +
                block.original;


            const translation =
                document.createElement(
                    "div"
                );


            translation.className =
                "translation";


            translation.textContent =
                block.translation;


            wrapper.appendChild(
                original
            );


            wrapper.appendChild(
                translation
            );


            textResults.appendChild(
                wrapper
            );

        }
    );


    results.style.display =
        "block";

}


/* =========================
   DOWNLOAD
========================= */

downloadButton.addEventListener(
    "click",
    () => {

        canvas.toBlob(
            blob => {

                if (!blob) return;


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );


                a.href =
                    url;


                a.download =
                    "manga-translated.png";


                document.body.appendChild(
                    a
                );


                a.click();


                a.remove();


                setTimeout(
                    () =>
                        URL.revokeObjectURL(
                            url
                        ),
                    1000
                );

            },

            "image/png"

        );

    }
);


/* =========================
   NEW IMAGE
========================= */

newButton.addEventListener(
    "click",
    () => {

        imageInput.value =
            "";


        preparedImage =
            null;


        preparedBase64 =
            null;


        canvas.width =
            1;


        canvas.height =
            1;


        canvasCard.style.display =
            "none";


        results.style.display =
            "none";


        downloadButton.style.display =
            "none";


        translateButton.disabled =
            true;


        textResults.innerHTML =
            "";


        setStatus(
            "اختر صورة للبدء"
        );

    }
);

</script>
