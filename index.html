<style>

* {

}

body {

    background: #0d1017;

header {

header h1 {

header p {

}

.version {

    padding: 6px 11px;
    border-radius: 20px;
    background: #252c3c;
    color: #b9c1d0;
    font-size: 12px;
}

.card {
    background: #171c27;
    border: 1px solid #2b3345;

    padding: 16px;

}

label {

}

input,
select,
button {

}

input,

    padding: 10px;

}

#apiKey {

}

.upload {

}

#imageInput {

}

.languages {

}

button {
    border: none;
    padding: 12px;
    margin-top: 12px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {

}

#translateButton {

}

#downloadButton {
    display: none;
    background: #07885f;
}

#strongCleanButton {
    display: none;
    background: #b06b16;
}

#compareButton {
    display: none;
    background: #3b465e;
}

#newButton {
    background: #30394e;
}

#status {
    padding: 16px 5px 5px;
    text-align: center;
    line-height: 1.7;
    white-space: pre-line;
    word-break: break-word;
}

.success {
    color: #4ade80;
}

.error {
    color: #ff6b6b;
}

.loading {
    color: #ffd166;
}

#canvasCard {
    display: none;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: white;
    border-radius: 10px;
}

#results {
    display: none;
}

.result {
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    background: #232a39;
}

.original {
    margin-bottom: 7px;
    color: #a7adbb;
    font-size: 14px;
    direction: auto;
}

.translation {
    font-size: 17px;
    font-weight: bold;
    direction: auto;
}

.displayTranslation {
    margin-top: 6px;
    color: #b8c1d5;
    font-size: 13px;
}

.note {
    color: #9ca3af;
    font-size: 13px;
    line-height: 1.65;
}

.model-info {
    margin-top: 8px;
    color: #9ca3af;
    text-align: center;
    font-size: 13px;
}

@media (max-width: 600px) {

    .languages {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 24px;
    }

}

</style>

</head>


<body>

<div class="app">

</header>


<div class="card">

</label>

<input

/>

<label

>

<small>
JPG / PNG / WEBP
</small>

</label>

/>


<div class="languages">

<div>

</label>

<select id="sourceLanguage">

</option>

اليابانية

</option>

</option>

<option value="French">

</option>

الإسبانية
</option>

<option value="Indonesian">

</option>

</select>

</div>


<div>

<label>
الترجمة إلى
</label>

<select id="targetLanguage">

<option value="Arabic">
العربية
</option>

<option value="English">
الإنجليزية
</option>

<option value="French">
الفرنسية
</option>

</option>

</div>

📝 النصوص المكتشفة
</h3>

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const apiKeyInput =
    document.getElementById("apiKey");

const imageInput =
    document.getElementById("imageInput");

const sourceLanguage =
    document.getElementById("sourceLanguage");

const targetLanguage =
    document.getElementById("targetLanguage");

const translateButton =
    document.getElementById("translateButton");

const downloadButton =
    document.getElementById("downloadButton");

const strongCleanButton =
    document.getElementById("strongCleanButton");

const compareButton =
    document.getElementById("compareButton");

const newButton =
    document.getElementById("newButton");

const statusBox =
    document.getElementById("status");

const modelInfo =
    document.getElementById("modelInfo");

const canvasCard =
    document.getElementById("canvasCard");

const results =
    document.getElementById("results");

const textResults =
    document.getElementById("textResults");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


const sourceCanvas =
    document.createElement(
        "canvas"
    );

const sourceCtx =
    sourceCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


let preparedImage = null;

let preparedBase64 = null;

let lastBlocks = [];

let translatedVisible = false;

let currentCleanStrength = 1;


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text,
    type = ""
) {

    statusBox.textContent =
        text;

    statusBox.className =
        type;

}


/* =====================================================
   IMAGE SELECT
===================================================== */

imageInput.addEventListener(
    "change",
    async () => {

        const file =
            imageInput.files[0];


        if (!file) {

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            setStatus(
                "❌ الملف المختار ليس صورة.",
                "error"
            );

            return;

        }


        try {

            setStatus(
                "⏳ جاري تجهيز الصورة...",
                "loading"
            );


            const prepared =
                await prepareImage(
                    file
                );


            preparedImage =
                prepared.image;


            preparedBase64 =
                prepared.base64;


            canvas.width =
                preparedImage.width;


            canvas.height =
                preparedImage.height;


            sourceCanvas.width =
                preparedImage.width;


            sourceCanvas.height =
                preparedImage.height;


            sourceCtx.clearRect(
                0,
                0,
                sourceCanvas.width,
                sourceCanvas.height
            );


            sourceCtx.drawImage(
                preparedImage,
                0,
                0
            );


            drawOriginal();


            canvasCard.style.display =
                "block";


            results.style.display =
                "none";


            downloadButton.style.display =
                "none";


            strongCleanButton.style.display =
                "none";


            compareButton.style.display =
                "none";


            translateButton.disabled =
                false;


            lastBlocks =
                [];


            translatedVisible =
                false;


            currentCleanStrength =
                1;


            modelInfo.textContent =
                "";


            setStatus(
                "✅ الصورة جاهزة.\nاضغط ترجمة الصورة.",
                "success"
            );

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "❌ تعذر تجهيز الصورة.",
                "error"
            );

        }

    }
);


/* =====================================================
   PREPARE IMAGE
===================================================== */

async function prepareImage(
    file
) {

    const original =
        await fileToImage(
            file
        );


    let width =
        original.naturalWidth;


    let height =
        original.naturalHeight;


    const maxDimension =
        2200;


    if (
        width > maxDimension ||
        height > maxDimension
    ) {

        const ratio =
            Math.min(

                maxDimension /
                width,

                maxDimension /
                height

            );


        width =
            Math.round(
                width *
                ratio
            );


        height =
            Math.round(
                height *
                ratio
            );

    }


    const temp =
        document.createElement(
            "canvas"
        );


    temp.width =
        width;


    temp.height =
        height;


    const tempCtx =
        temp.getContext(
            "2d"
        );


    tempCtx.fillStyle =
        "#ffffff";


    tempCtx.fillRect(
        0,
        0,
        width,
        height
    );


    tempCtx.drawImage(
        original,
        0,
        0,
        width,
        height
    );


    const dataURL =
        temp.toDataURL(
            "image/jpeg",
            0.96
        );


    const image =
        new Image();


    await new Promise(
        (
            resolve,
            reject
        ) => {

            image.onload =
                resolve;


            image.onerror =
                reject;


            image.src =
                dataURL;

        }
    );


    return {

        image,

        base64:
            dataURL.split(
                ","
            )[1]

    };

}


/* =====================================================
   FILE -> IMAGE
===================================================== */

function fileToImage(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const url =
                URL.createObjectURL(
                    file
                );


            const image =
                new Image();


            image.onload =
                () => {

                    URL.revokeObjectURL(
                        url
                    );


                    resolve(
                        image
                    );

                };


            image.onerror =
                () => {

                    URL.revokeObjectURL(
                        url
                    );


                    reject(
                        new Error(
                            "فشل تحميل الصورة."
                        )
                    );

                };


            image.src =
                url;

        }
    );

}


/* =====================================================
   ORIGINAL IMAGE
===================================================== */

function drawOriginal() {

    if (!preparedImage) {

        return;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.drawImage(
        preparedImage,
        0,
        0
    );

}


/* =====================================================
   TRANSLATE BUTTON
===================================================== */

translateButton.addEventListener(
    "click",
    async () => {

        const apiKey =
            apiKeyInput
                .value
                .trim();


        if (!apiKey) {

            setStatus(
                "❌ ضع Gemini API Key أولاً.",
                "error"
            );

            return;

        }


        if (!preparedBase64) {

            setStatus(
                "❌ اختر صورة أولاً.",
                "error"
            );

            return;

        }


        translateButton.disabled =
            true;


        downloadButton.style.display =
            "none";


        strongCleanButton.style.display =
            "none";


        compareButton.style.display =
            "none";


        results.style.display =
            "none";


        modelInfo.textContent =
            "";


        try {

            setStatus(
                "🔎 جاري البحث عن أفضل نموذج Gemini متاح...",
                "loading"
            );


            const models =
                await getAvailableModels(
                    apiKey
                );


            if (!models.length) {

                throw new Error(
                    "لم يتم العثور على نموذج Gemini مناسب."
                );

            }


            const result =
                await callGemini(

                    apiKey,

                    models,

                    createPrompt(),

                    preparedBase64

                );


            modelInfo.textContent =
                "النموذج المستخدم: " +
                result.model;


            const blocks =
                parseResponse(
                    result.text
                );


            if (!blocks.length) {

                throw new Error(
                    "لم يتم العثور على نص قابل للترجمة."
                );

            }


            lastBlocks =
                blocks;


            currentCleanStrength =
                1;


            drawTranslation(
                blocks,
                currentCleanStrength
            );


            showResults(
                blocks
            );


            translatedVisible =
                true;


            downloadButton.style.display =
                "block";


            strongCleanButton.style.display =
                "block";


            compareButton.style.display =
                "block";


            compareButton.textContent =
                "↩ عرض الصورة الأصلية";


            setStatus(
                "✅ تمت الترجمة بنجاح.\nتم اكتشاف " +
                blocks.length +
                " منطقة نصية.",
                "success"
            );

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "❌ حدث خطأ:\n" +
                (
                    error?.message ||
                    String(error)
                ),
                "error"
            );

        }

        finally {

            translateButton.disabled =
                false;

        }

    }
);


/* =====================================================
   AVAILABLE MODELS
===================================================== */

async function getAvailableModels(
    apiKey
) {

    try {

        const response =
            await fetch(

                "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100",

                {

                    headers: {

                        "x-goog-api-key":
                            apiKey

                    }

                }

            );


        const data =
            await response.json();


        if (
            response.status === 401 ||
            response.status === 403
        ) {

            throw new Error(
                "مفتاح Gemini غير صالح أو لا يملك صلاحية استخدام Gemini."
            );

        }


        if (!response.ok) {

            return fallbackModels();

        }


        const models =
            Array.isArray(
                data.models
            )
                ? data.models
                : [];


        const usable =
            models
                .filter(
                    model => {

                        const name =
                            String(
                                model.name ||
                                ""
                            ).toLowerCase();


                        const methods =
                            model.supportedGenerationMethods ||
                            [];


                        if (
                            !name.includes(
                                "gemini"
                            )
                        ) {

                            return false;

                        }


                        if (
                            !methods.includes(
                                "generateContent"
                            )
                        ) {

                            return false;

                        }


                        const excluded = [

                            "embedding",
                            "imagen",
                            "tts",
                            "audio",
                            "live",
                            "aqa",
                            "image-generation"

                        ];


                        return !excluded.some(
                            item =>
                                name.includes(
                                    item
                                )
                        );

                    }
                )
                .map(
                    model =>

                        String(
                            model.name
                        ).replace(
                            /^models\//,
                            ""
                        )

                );


        usable.sort(
            (
                a,
                b
            ) =>

                modelScore(b) -
                modelScore(a)

        );


        return [
            ...new Set(
                usable
            )
        ].slice(
            0,
            8
        );

    }

    catch (error) {

        if (
            String(
                error?.message ||
                ""
            ).includes(
                "مفتاح Gemini"
            )
        ) {

            throw error;

        }


        return fallbackModels();

    }

}


/* =====================================================
   MODEL QUALITY SCORE

   V5 يعطي Flash الكامل أولوية
   على Flash-Lite لأننا نحتاج
   دقة أفضل في تحديد النص.
===================================================== */

function modelScore(
    name
) {

    const model =
        String(
            name
        ).toLowerCase();


    let score =
        0;


    if (
        model.includes(
            "flash"
        ) &&
        !model.includes(
            "flash-lite"
        )
    ) {

        score +=
            160;

    }


    if (
        model.includes(
            "pro"
        )
    ) {

        score +=
            145;

    }


    if (
        model.includes(
            "flash-lite"
        )
    ) {

        score +=
            110;

    }


    if (
        model.includes(
            "latest"
        )
    ) {

        score +=
            18;

    }


    if (
        model.includes(
            "preview"
        )
    ) {

        score -=
            10;

    }


    if (
        model.includes(
            "exp"
        )
    ) {

        score -=
            20;

    }


    return score;

}


/* =====================================================
   FALLBACK MODELS
===================================================== */

function fallbackModels() {

    return [

        "gemini-flash-latest",

        "gemini-2.5-flash",

        "gemini-flash-lite-latest",

        "gemini-2.5-flash-lite"

    ];

}


/* =====================================================
   CALL GEMINI
===================================================== */

async function callGemini(
    apiKey,
    models,
    prompt,
    base64
) {

    const sleep =
        ms =>
            new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        ms
                    )
            );


    let lastError =
        "فشل الاتصال بـ Gemini.";


    for (
        let modelIndex = 0;
        modelIndex < models.length;
        modelIndex++
    ) {

        const model =
            models[
                modelIndex
            ];


        for (
            let attempt = 1;
            attempt <= 3;
            attempt++
        ) {

            setStatus(
                "🤖 النموذج: " +
                model +
                "\nالمحاولة " +
                attempt +
                " من 3",
                "loading"
            );


            try {

                const url =
                    "https://generativelanguage.googleapis.com/v1beta/models/" +
                    encodeURIComponent(
                        model
                    ) +
                    ":generateContent";


                const response =
                    await fetch(
                        url,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "x-goog-api-key":
                                    apiKey

                            },

                            body:
                                JSON.stringify({

                                    contents: [

                                        {

                                            role:
                                                "user",

                                            parts: [

                                                {

                                                    text:
                                                        prompt

                                                },

                                                {

                                                    inline_data: {

                                                        mime_type:
                                                            "image/jpeg",

                                                        data:
                                                            base64

                                                    }

                                                }

                                            ]

                                        }

                                    ]

                                })

                        }
                    );


                let data =
                    {};


                try {

                    data =
                        await response.json();

                }

                catch {}


                if (
                    response.ok
                ) {

                    const text =
                        extractGeminiText(
                            data
                        );


                    if (text) {

                        return {

                            model,
                            text

                        };

                    }


                    lastError =
                        "Gemini أعاد استجابة فارغة.";


                    break;

                }


                const message =
                    data?.error?.message ||
                    (
                        "HTTP " +
                        response.status
                    );


                lastError =
                    message;


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    throw new Error(
                        "مشكلة في Gemini API Key:\n" +
                        message
                    );

                }


                if (
                    response.status === 400 ||
                    response.status === 404
                ) {

                    break;

                }


                if (
                    [
                        429,
                        500,
                        502,
                        503,
                        504
                    ].includes(
                        response.status
                    )
                ) {

                    if (
                        attempt < 3
                    ) {

                        const delay =
                            attempt === 1
                                ? 2500
                                : 6000;


                        setStatus(
                            "⏳ النموذج مشغول.\nسيتم إعادة المحاولة...",
                            "loading"
                        );


                        await sleep(
                            delay
                        );


                        continue;

                    }


                    break;

                }


                break;

            }

            catch (error) {

                if (
                    String(
                        error?.message ||
                        ""
                    ).includes(
                        "Gemini API Key"
                    )
                ) {

                    throw error;

                }


                lastError =
                    error?.message ||
                    String(error);


                if (
                    attempt < 3
                ) {

                    await sleep(
                        2000 *
                        attempt
                    );


                    continue;

                }

            }

        }

    }


    throw new Error(
        "تعذر استخدام Gemini حالياً.\n\nآخر رسالة:\n" +
        lastError
    );

}


/* =====================================================
   EXTRACT GEMINI RESPONSE
===================================================== */

function extractGeminiText(
    data
) {

    const parts =
        data
            ?.candidates
            ?.[0]
            ?.content
            ?.parts;


    if (
        !Array.isArray(
            parts
        )
    ) {

        return "";

    }


    return parts
        .map(
            part =>
                part?.text ||
                ""
        )
        .join("")
        .trim();

}


/* =====================================================
   V5 PROMPT
===================================================== */

function createPrompt() {

    const source =
        sourceLanguage.value;


    const target =
        targetLanguage.value;


    return `

You are a professional manga localization,
OCR and layout-analysis engine.

Analyze the ENTIRE image carefully.

SOURCE LANGUAGE:
${source}

TARGET LANGUAGE:
${target}


For EACH meaningful speech bubble,
narration box or caption return:

1. original

Read ALL original text belonging to the region.

Include:
- all Japanese characters
- punctuation
- vertical text
- small furigana if visible


2. translation

Provide an accurate natural translation into ${target}.


3. display_translation

Provide a concise natural version of the same translation
optimized to fit inside the original speech bubble.

Do NOT change the meaning.

For Arabic:
use natural fluent Arabic and avoid unnecessary words.


4. text_box_2d

Bounding box containing ALL source-language printed text
belonging to this bubble.


5. erase_boxes_2d

THIS IS EXTREMELY IMPORTANT.

Return MULTIPLE boxes when necessary.

erase_boxes_2d must contain EVERY visible group of
source-language characters that must be removed before
placing the translation.

For vertical Japanese:
return a box for every vertical text column if needed.

Include:
- main characters
- small furigana
- punctuation
- exclamation marks
- any separated Japanese letters belonging to the same bubble

Boxes should include a small margin around the printed ink.

DO NOT include:
- bubble black border
- character artwork
- faces
- clothing
- speed lines outside the bubble

If all source text fits safely inside one box,
one erase box is acceptable.

But if characters are separated,
USE MULTIPLE ERASE BOXES.


6. bubble_box_2d

Return the LARGE SAFE INNER RECTANGULAR AREA
inside the speech bubble where translated text can be drawn.

bubble_box_2d must:

- stay inside the black bubble outline
- cover most of the usable white interior
- avoid the speech-bubble border
- avoid artwork
- avoid faces
- preferably exclude the bubble tail
- be much larger than text_box_2d when the bubble has room


TEXT GROUPING:

One speech bubble normally equals ONE JSON object.

Do NOT create one result per Japanese character.

Do NOT split one speech bubble into many translation objects.

erase_boxes_2d may contain many boxes,
but the translation object should still represent the whole bubble.


COORDINATES:

All coordinates are normalized from 0 to 1000.

Box format:

[ymin, xmin, ymax, xmax]


EXAMPLE:

[
  {
    "text_box_2d": [
      160,
      690,
      335,
      835
    ],

    "erase_boxes_2d": [
      [
        160,
        700,
        315,
        755
      ],
      [
        165,
        765,
        330,
        830
      ]
    ],

    "bubble_box_2d": [
      105,
      620,
      370,
      890
    ],

    "original":
      "てめーの仕事だ！",

    "translation":
      "إنها مهمتك!",

    "display_translation":
      "إنها مهمتك!",

    "type":
      "dialogue"
  }
]


Allowed types:

dialogue
narration
caption
sfx


If an SFX is directly on artwork and not inside
a clean speech bubble:

bubble_box_2d may be null.

Do not invent unreadable text.

Ignore page numbers.

Return ONLY VALID JSON.

No Markdown.
No explanation.
No code fences.

If no readable text exists return:

[]

`;

}


/* =====================================================
   PARSE RESPONSE
===================================================== */

function parseResponse(
    text
) {

    let cleaned =
        String(
            text ||
            ""
        )
            .trim()
            .replace(
                /```json/gi,
                ""
            )
            .replace(
                /```/g,
                ""
            )
            .trim();


    let parsed;


    try {

        parsed =
            JSON.parse(
                cleaned
            );

    }

    catch {

        const start =
            cleaned.indexOf(
                "["
            );


        const end =
            cleaned.lastIndexOf(
                "]"
            );


        if (
            start === -1 ||
            end === -1 ||
            end <= start
        ) {

            throw new Error(
                "Gemini لم يرجع JSON صالحاً."
            );

        }


        try {

            parsed =
                JSON.parse(
                    cleaned.slice(
                        start,
                        end + 1
                    )
                );

        }

        catch {

            throw new Error(
                "تعذر قراءة JSON الذي أعاده Gemini."
            );

        }

    }


    if (
        !Array.isArray(
            parsed
        )
    ) {

        if (
            Array.isArray(
                parsed?.blocks
            )
        ) {

            parsed =
                parsed.blocks;

        }

        else {

            throw new Error(
                "صيغة نتيجة Gemini غير صحيحة."
            );

        }

    }


    return parsed
        .map(
            normalizeBlock
        )
        .filter(
            Boolean
        );

}


/* =====================================================
   NORMALIZE BLOCK
===================================================== */

function normalizeBlock(
    block
) {

    if (!block) {

        return null;

    }


    const textBox =
        normalizeBox(

            block.text_box_2d ||
            block.box_2d ||
            block.bbox ||
            block.box

        );


    if (!textBox) {

        return null;

    }


    let bubbleBox =
        normalizeBox(
            block.bubble_box_2d ||
            block.safe_box_2d
        );


    if (!bubbleBox) {

        bubbleBox =
            expandBox(
                textBox,
                90,
                110
            );

    }


    let eraseBoxes =
        [];


    if (
        Array.isArray(
            block.erase_boxes_2d
        )
    ) {

        eraseBoxes =
            block.erase_boxes_2d
                .map(
                    normalizeBox
                )
                .filter(
                    Boolean
                );

    }


    if (!eraseBoxes.length) {

        eraseBoxes =
            [
                textBox
            ];

    }


    /*
       تأكد أن Bubble Box يحتوي
       منطقة النص.
    */

    bubbleBox = [

        Math.min(
            bubbleBox[0],
            textBox[0]
        ),

        Math.min(
            bubbleBox[1],
            textBox[1]
        ),

        Math.max(
            bubbleBox[2],
            textBox[2]
        ),

        Math.max(
            bubbleBox[3],
            textBox[3]
        )

    ].map(
        clamp1000
    );


    /*
       ندمج صناديق المسح
       القريبة والمتداخلة.
    */

    eraseBoxes =
        mergeNearbyBoxes(
            eraseBoxes
        );


    const original =
        String(
            block.original ||
            block.text ||
            ""
        ).trim();


    const translation =
        String(
            block.translation ||
            block.translated ||
            ""
        ).trim();


    const displayTranslation =
        String(
            block.display_translation ||
            block.short_translation ||
            translation ||
            ""
        ).trim();


    if (
        !original &&
        !translation
    ) {

        return null;

    }


    return {

        textBox,

        eraseBoxes,

        bubbleBox,

        original,

        translation:
            translation ||
            original,

        displayTranslation:
            displayTranslation ||
            translation ||
            original,

        type:
            block.type ||
            "dialogue"

    };

}


/* =====================================================
   NORMALIZE BOX
===================================================== */

function normalizeBox(
    box
) {

    if (
        !Array.isArray(
            box
        ) ||
        box.length < 4
    ) {

        return null;

    }


    let values =
        box
            .slice(
                0,
                4
            )
            .map(
                Number
            );


    if (
        values.some(
            value =>
                !Number.isFinite(
                    value
                )
        )
    ) {

        return null;

    }


    let [
        ymin,
        xmin,
        ymax,
        xmax
    ] =
        values;


    const largest =
        Math.max(
            Math.abs(
                ymin
            ),
            Math.abs(
                xmin
            ),
            Math.abs(
                ymax
            ),
            Math.abs(
                xmax
            )
        );


    if (
        largest <= 1.5
    ) {

        ymin *= 1000;

        xmin *= 1000;

        ymax *= 1000;

        xmax *= 1000;

    }


    ymin =
        clamp1000(
            ymin
        );


    xmin =
        clamp1000(
            xmin
        );


    ymax =
        clamp1000(
            ymax
        );


    xmax =
        clamp1000(
            xmax
        );


    if (
        ymax <= ymin ||
        xmax <= xmin
    ) {

        return null;

    }


    return [

        ymin,
        xmin,
        ymax,
        xmax

    ];

}


/* =====================================================
   CLAMP
===================================================== */

function clamp1000(
    value
) {

    return Math.max(
        0,
        Math.min(
            1000,
            Number(value)
        )
    );

}


/* =====================================================
   EXPAND
===================================================== */

function expandBox(
    box,
    vertical,
    horizontal
) {

    return [

        clamp1000(
            box[0] -
            vertical
        ),

        clamp1000(
            box[1] -
            horizontal
        ),

        clamp1000(
            box[2] +
            vertical
        ),

        clamp1000(
            box[3] +
            horizontal
        )

    ];

}


/* =====================================================
   MERGE NEARBY ERASE BOXES
===================================================== */

function mergeNearbyBoxes(
    boxes
) {

    let result =
        boxes.map(
            box => [
                ...box
            ]
        );


    let changed =
        true;


    while (changed) {

        changed =
            false;


        outer:

        for (
            let i = 0;
            i < result.length;
            i++
        ) {

            for (
                let j = i + 1;
                j < result.length;
                j++
            ) {

                if (
                    boxesAreNear(
                        result[i],
                        result[j]
                    )
                ) {

                    const merged = [

                        Math.min(
                            result[i][0],
                            result[j][0]
                        ),

                        Math.min(
                            result[i][1],
                            result[j][1]
                        ),

                        Math.max(
                            result[i][2],
                            result[j][2]
                        ),

                        Math.max(
                            result[i][3],
                            result[j][3]
                        )

                    ];


                    result.splice(
                        j,
                        1
                    );


                    result[i] =
                        merged;


                    changed =
                        true;


                    break outer;

                }

            }

        }

    }


    return result;

}


/* =====================================================
   BOXES NEAR?
===================================================== */

function boxesAreNear(
    a,
    b
) {

    const margin =
        12;


    return !(
        a[2] + margin < b[0] ||
        b[2] + margin < a[0] ||
        a[3] + margin < b[1] ||
        b[3] + margin < a[1]
    );

}


/* =====================================================
   DRAW TRANSLATION
===================================================== */

function drawTranslation(
    blocks,
    strength = 1
) {

    drawOriginal();


    /*
       المرحلة الأولى:
       تنظيف النصوص الأصلية.
    */

    for (
        const block of blocks
    ) {

        cleanBlock(
            block,
            strength
        );

    }


    /*
       المرحلة الثانية:
       كتابة الترجمة.
    */

    for (
        const block of blocks
    ) {

        drawTranslatedText(
            block
        );

    }

}


/* =====================================================
   CLEAN BLOCK
===================================================== */

function cleanBlock(
    block,
    strength
) {

    if (
        !block.bubbleBox
    ) {

        return;

    }


    const bubblePixelBox =
        normalizedBoxToPixels(
            block.bubbleBox
        );


    const background =
        detectBubbleBackground(
            bubblePixelBox
        );


    for (
        const eraseBox of block.eraseBoxes
    ) {

        cleanEraseBox(

            eraseBox,

            block.bubbleBox,

            background,

            strength

        );

    }

}


/* =====================================================
   CLEAN ONE ERASE BOX
===================================================== */

function cleanEraseBox(
    eraseBox,
    bubbleBox,
    background,
    strength
) {

    const height =
        eraseBox[2] -
        eraseBox[0];


    const width =
        eraseBox[3] -
        eraseBox[1];


    /*
       توسعة محسوبة حول النص.
    */

    const extraY =
        Math.max(
            10,
            height *
            0.17 *
            strength
        );


    const extraX =
        Math.max(
            10,
            width *
            0.17 *
            strength
        );


    let cleaning = [

        eraseBox[0] -
        extraY,

        eraseBox[1] -
        extraX,

        eraseBox[2] +
        extraY,

        eraseBox[3] +
        extraX

    ];


    /*
       لا نخرج من المنطقة الآمنة
       للفقاعة.
    */

    const safeMargin =
        strength > 1
            ? 6
            : 10;


    cleaning = [

        Math.max(
            cleaning[0],
            bubbleBox[0] +
            safeMargin
        ),

        Math.max(
            cleaning[1],
            bubbleBox[1] +
            safeMargin
        ),

        Math.min(
            cleaning[2],
            bubbleBox[2] -
            safeMargin
        ),

        Math.min(
            cleaning[3],
            bubbleBox[3] -
            safeMargin
        )

    ];


    if (
        cleaning[2] <=
        cleaning[0] ||
        cleaning[3] <=
        cleaning[1]
    ) {

        cleaning =
            eraseBox;

    }


    const pixelBox =
        normalizedBoxToPixels(
            cleaning
        );


    /*
       المرحلة 1:
       تغطية المنطقة الرئيسية.
    */

    ctx.save();


    ctx.fillStyle =
        background.css;


    roundedRect(

        pixelBox.x,

        pixelBox.y,

        pixelBox.width,

        pixelBox.height,

        Math.min(
            12,
            pixelBox.width *
            0.08,
            pixelBox.height *
            0.08
        )

    );


    ctx.fill();


    ctx.restore();


    /*
       المرحلة 2:
       Ink Cleaner.

       نفحص منطقة أكبر قليلاً
       ونزيل البكسلات الداكنة
       المتبقية حول النص.
    */

    inkCleaner(

        cleaning,

        bubbleBox,

        background,

        strength

    );

}


/* =====================================================
   INK CLEANER
===================================================== */

function inkCleaner(
    cleaningBox,
    bubbleBox,
    background,
    strength
) {

    const extra =
        strength > 1
            ? 25
            : 14;


    const scanBox = [

        Math.max(
            bubbleBox[0] + 8,
            cleaningBox[0] - extra
        ),

        Math.max(
            bubbleBox[1] + 8,
            cleaningBox[1] - extra
        ),

        Math.min(
            bubbleBox[2] - 8,
            cleaningBox[2] + extra
        ),

        Math.min(
            bubbleBox[3] - 8,
            cleaningBox[3] + extra
        )

    ];


    const pixel =
        normalizedBoxToPixels(
            scanBox
        );


    const x =
        Math.max(
            0,
            Math.floor(
                pixel.x
            )
        );


    const y =
        Math.max(
            0,
            Math.floor(
                pixel.y
            )
        );


    const width =
        Math.min(
            sourceCanvas.width - x,
            Math.max(
                1,
                Math.ceil(
                    pixel.width
                )
            )
        );


    const height =
        Math.min(
            sourceCanvas.height - y,
            Math.max(
                1,
                Math.ceil(
                    pixel.height
                )
            )
        );


    if (
        width <= 0 ||
        height <= 0
    ) {

        return;

    }


    try {

        const sourceData =
            sourceCtx.getImageData(
                x,
                y,
                width,
                height
            );


        const output =
            ctx.getImageData(
                x,
                y,
                width,
                height
            );


        /*
           Normal:
           نزيل الأسود والرمادي الداكن.

           Strong:
           نزيل أيضاً الحواف الرمادية
           الناتجة عن Anti-aliasing.
        */

        const darknessThreshold =
            strength > 1
                ? 225
                : 195;


        for (
            let i = 0;
            i < sourceData.data.length;
            i += 4
        ) {

            const r =
                sourceData.data[i];


            const g =
                sourceData.data[i + 1];


            const b =
                sourceData.data[i + 2];


            const brightness =
                (
                    r *
                    0.299
                ) +
                (
                    g *
                    0.587
                ) +
                (
                    b *
                    0.114
                );


            if (
                brightness <
                darknessThreshold
            ) {

                output.data[i] =
                    background.r;


                output.data[i + 1] =
                    background.g;


                output.data[i + 2] =
                    background.b;


                output.data[i + 3] =
                    255;

            }

        }


        ctx.putImageData(
            output,
            x,
            y
        );

    }

    catch (error) {

        console.warn(
            "Ink Cleaner failed",
            error
        );

    }

}


/* =====================================================
   DETECT BUBBLE BACKGROUND
===================================================== */

function detectBubbleBackground(
    box
) {

    try {

        const left =
            Math.max(
                0,
                Math.floor(
                    box.x
                )
            );


        const top =
            Math.max(
                0,
                Math.floor(
                    box.y
                )
            );


        const right =
            Math.min(
                sourceCanvas.width,
                Math.ceil(
                    box.x +
                    box.width
                )
            );


        const bottom =
            Math.min(
                sourceCanvas.height,
                Math.ceil(
                    box.y +
                    box.height
                )
            );


        const step =
            Math.max(
                4,
                Math.floor(
                    Math.max(
                        box.width,
                        box.height
                    ) /
                    40
                )
            );


        let totalR =
            0;


        let totalG =
            0;


        let totalB =
            0;


        let count =
            0;


        for (
            let y = top;
            y < bottom;
            y += step
        ) {

            for (
                let x = left;
                x < right;
                x += step
            ) {

                const pixel =
                    sourceCtx.getImageData(
                        x,
                        y,
                        1,
                        1
                    ).data;


                const brightness =
                    (
                        pixel[0] *
                        0.299
                    ) +
                    (
                        pixel[1] *
                        0.587
                    ) +
                    (
                        pixel[2] *
                        0.114
                    );


                /*
                   نأخذ فقط الخلفية الفاتحة.
                */

                if (
                    brightness >= 205
                ) {

                    totalR +=
                        pixel[0];


                    totalG +=
                        pixel[1];


                    totalB +=
                        pixel[2];


                    count++;

                }

            }

        }


        if (
            count < 4
        ) {

            return {

                r: 255,

                g: 255,

                b: 255,

                css: "#ffffff"

            };

        }


        const r =
            Math.min(
                255,
                Math.round(
                    totalR /
                    count
                ) +
                2
            );


        const g =
            Math.min(
                255,
                Math.round(
                    totalG /
                    count
                ) +
                2
            );


        const b =
            Math.min(
                255,
                Math.round(
                    totalB /
                    count
                ) +
                2
            );


        return {

            r,

            g,

            b,

            css:
                "rgb(" +
                r +
                "," +
                g +
                "," +
                b +
                ")"

        };

    }

    catch {

        return {

            r: 255,

            g: 255,

            b: 255,

            css: "#ffffff"

        };

    }

}


/* =====================================================
   DRAW TRANSLATED TEXT
===================================================== */

function drawTranslatedText(
    block
) {

    if (
        !block.bubbleBox
    ) {

        return;

    }


    const box =
        normalizedBoxToPixels(
            block.bubbleBox
        );


    /*
       هامش داخل الفقاعة.
    */

    const padX =
        Math.max(
            7,
            box.width *
            0.10
        );


    const padY =
        Math.max(
            7,
            box.height *
            0.10
        );


    const x =
        box.x +
        padX;


    const y =
        box.y +
        padY;


    const width =
        box.width -
        padX *
        2;


    const height =
        box.height -
        padY *
        2;


    if (
        width <= 20 ||
        height <= 20
    ) {

        return;

    }


    fitAndDrawText(

        block.displayTranslation,

        x,

        y,

        width,

        height

    );

}


/* =====================================================
   NORMALIZED BOX -> PIXELS
===================================================== */

function normalizedBoxToPixels(
    box
) {

    return {

        x:
            box[1] /
            1000 *
            canvas.width,

        y:
            box[0] /
            1000 *
            canvas.height,

        width:
            (
                box[3] -
                box[1]
            ) /
            1000 *
            canvas.width,

        height:
            (
                box[2] -
                box[0]
            ) /
            1000 *
            canvas.height

    };

}


/* =====================================================
   FIT AND DRAW TEXT
===================================================== */

function fitAndDrawText(
    text,
    x,
    y,
    width,
    height
) {

    text =
        String(
            text ||
            ""
        )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    if (!text) {

        return;

    }


    let fontSize =
        Math.min(

            64,

            height *
            0.34,

            width *
            0.17

        );


    fontSize =
        Math.max(
            13,
            fontSize
        );


    let selectedLines =
        [];


    while (
        fontSize >= 10
    ) {

        setFont(
            fontSize
        );


        const lines =
            balanceLines(

                wrapWords(
                    text,
                    width
                ),

                width

            );


        const lineHeight =
            fontSize *
            1.27;


        const totalHeight =
            lines.length *
            lineHeight;


        if (
            totalHeight <=
            height
        ) {

            selectedLines =
                lines;


            break;

        }


        fontSize -=
            1;

    }


    if (
        !selectedLines.length
    ) {

        fontSize =
            10;


        setFont(
            fontSize
        );


        selectedLines =
            wrapWords(
                text,
                width
            );

    }


    const lineHeight =
        fontSize *
        1.28;


    const totalHeight =
        selectedLines.length *
        lineHeight;


    ctx.save();


    setFont(
        fontSize
    );


    ctx.fillStyle =
        "#111111";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.direction =
        targetLanguage.value ===
        "Arabic"
            ? "rtl"
            : "ltr";


    let currentY =
        y +
        height /
        2 -
        totalHeight /
        2 +
        lineHeight /
        2;


    for (
        const line of selectedLines
    ) {

        ctx.fillText(

            line,

            x +
            width /
            2,

            currentY,

            width

        );


        currentY +=
            lineHeight;

    }


    ctx.restore();

}


/* =====================================================
   FONT
===================================================== */

function setFont(
    size
) {

    ctx.font =
        "700 " +
        size +
        "px Arial, Tahoma, sans-serif";

}


/* =====================================================
   WRAP WORDS
===================================================== */

function wrapWords(
    text,
    maxWidth
) {

    const words =
        String(
            text
        )
            .trim()
            .split(
                /\s+/
            );


    const lines =
        [];


    let current =
        "";


    for (
        const word of words
    ) {

        const candidate =
            current
                ? current +
                  " " +
                  word
                : word;


        if (
            ctx.measureText(
                candidate
            ).width <=
            maxWidth
        ) {

            current =
                candidate;

        }

        else {

            if (
                current
            ) {

                lines.push(
                    current
                );

            }


            if (
                ctx.measureText(
                    word
                ).width <=
                maxWidth
            ) {

                current =
                    word;

            }

            else {

                const pieces =
                    splitLongWord(
                        word,
                        maxWidth
                    );


                if (
                    pieces.length > 1
                ) {

                    lines.push(
                        ...pieces.slice(
                            0,
                            -1
                        )
                    );


                    current =
                        pieces[
                            pieces.length -
                            1
                        ];

                }

                else {

                    current =
                        pieces[0] ||
                        "";

                }

            }

        }

    }


    if (current) {

        lines.push(
            current
        );

    }


    return lines;

}


/* =====================================================
   BALANCE LINES
===================================================== */

function balanceLines(
    lines,
    maxWidth
) {

    const result =
        [
            ...lines
        ];


    if (
        result.length < 2
    ) {

        return result;

    }


    for (
        let pass = 0;
        pass < 5;
        pass++
    ) {

        let changed =
            false;


        for (
            let i = 0;
            i < result.length - 1;
            i++
        ) {

            const firstWords =
                result[i]
                    .split(
                        " "
                    );


            if (
                firstWords.length <= 1
            ) {

                continue;

            }


            const nextWords =
                result[
                    i + 1
                ].split(
                    " "
                );


            const moved =
                firstWords[
                    firstWords.length - 1
                ];


            const newFirst =
                firstWords
                    .slice(
                        0,
                        -1
                    )
                    .join(
                        " "
                    );


            const newSecond =
                [
                    moved,
                    ...nextWords
                ].join(
                    " "
                );


            if (
                ctx.measureText(
                    newSecond
                ).width >
                maxWidth
            ) {

                continue;

            }


            const before =
                Math.abs(

                    ctx.measureText(
                        result[i]
                    ).width -

                    ctx.measureText(
                        result[
                            i + 1
                        ]
                    ).width

                );


            const after =
                Math.abs(

                    ctx.measureText(
                        newFirst
                    ).width -

                    ctx.measureText(
                        newSecond
                    ).width

                );


            if (
                newFirst &&
                after < before
            ) {

                result[i] =
                    newFirst;


                result[
                    i + 1
                ] =
                    newSecond;


                changed =
                    true;

            }

        }


        if (!changed) {

            break;

        }

    }


    return result;

}


/* =====================================================
   LONG WORD
===================================================== */

function splitLongWord(
    word,
    maxWidth
) {

    const pieces =
        [];


    let current =
        "";


    for (
        const char of word
    ) {

        const candidate =
            current +
            char;


        if (
            ctx.measureText(
                candidate
            ).width >
            maxWidth
        ) {

            if (current) {

                pieces.push(
                    current
                );

            }


            current =
                char;

        }

        else {

            current =
                candidate;

        }

    }


    if (current) {

        pieces.push(
            current
        );

    }


    return pieces;

}


/* =====================================================
   ROUNDED RECTANGLE
===================================================== */

function roundedRect(
    x,
    y,
    width,
    height,
    radius
) {

    radius =
        Math.max(
            0,
            Math.min(

                radius,

                width /
                2,

                height /
                2

            )
        );


    ctx.beginPath();


    ctx.moveTo(
        x + radius,
        y
    );


    ctx.lineTo(
        x + width - radius,
        y
    );


    ctx.quadraticCurveTo(

        x + width,

        y,

        x + width,

        y + radius

    );


    ctx.lineTo(
        x + width,
        y + height - radius
    );


    ctx.quadraticCurveTo(

        x + width,

        y + height,

        x + width - radius,

        y + height

    );


    ctx.lineTo(
        x + radius,
        y + height
    );


    ctx.quadraticCurveTo(

        x,

        y + height,

        x,

        y + height - radius

    );


    ctx.lineTo(
        x,
        y + radius
    );


    ctx.quadraticCurveTo(

        x,

        y,

        x + radius,

        y

    );


    ctx.closePath();

}

===================================================== */

strongCleanButton.addEventListener(
    "click",
    () => {

        if (
            !lastBlocks.length
        ) {

            return;

        }


        currentCleanStrength =
            1.55;


        drawTranslation(
            lastBlocks,
            currentCleanStrength
        );


        translatedVisible =
            true;


        compareButton.textContent =
            "↩ عرض الصورة الأصلية";


        setStatus(
            "🧽 تم تطبيق تنظيف أقوى.\nإذا اختفت بقايا اليابانية يمكنك حفظ الصورة.",
            "success"
        );

    }
);


/* =====================================================
   RESULTS
===================================================== */

function showResults(
    blocks
) {

    textResults.innerHTML =
        "";


    blocks.forEach(
        (
            block,
            index
        ) => {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "result";


            const original =
                document.createElement(
                    "div"
                );


            original.className =
                "original";


            original.textContent =
                (
                    index +
                    1
                ) +
                ". الأصل: " +
                block.original;


            const translated =
                document.createElement(
                    "div"
                );


            translated.className =
                "translation";


            translated.textContent =
                block.translation;


            wrapper.appendChild(
                original
            );


            wrapper.appendChild(
                translated
            );


            if (
                block.displayTranslation &&
                block.displayTranslation !==
                block.translation
            ) {

                const display =
                    document.createElement(
                        "div"
                    );


                display.className =
                    "displayTranslation";


                display.textContent =
                    "داخل الفقاعة: " +
                    block.displayTranslation;


                wrapper.appendChild(
                    display
                );

            }


            textResults.appendChild(
                wrapper
            );

        }
    );


    results.style.display =
        "block";

}


/* =====================================================
   COMPARE ORIGINAL / TRANSLATED
===================================================== */

compareButton.addEventListener(
    "click",
    () => {

        if (!preparedImage) {

            return;

        }


        if (
            translatedVisible
        ) {

            drawOriginal();


            translatedVisible =
                false;


            compareButton.textContent =
                "✨ عرض الصورة المترجمة";

        }

        else {

            drawTranslation(
                lastBlocks,
                currentCleanStrength
            );


            translatedVisible =
                true;


            compareButton.textContent =
                "↩ عرض الصورة الأصلية";

        }

    }
);


/* =====================================================
   DOWNLOAD
===================================================== */

downloadButton.addEventListener(
    "click",
    () => {

        if (
            !translatedVisible &&
            lastBlocks.length
        ) {

            drawTranslation(
                lastBlocks,
                currentCleanStrength
            );


            translatedVisible =
                true;


            compareButton.textContent =
                "↩ عرض الصورة الأصلية";

        }


        canvas.toBlob(
            blob => {

                if (!blob) {

                    setStatus(
                        "❌ تعذر إنشاء الصورة.",
                        "error"
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    "manga-translated-v5.png";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    () => {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );

            },

            "image/png"

        );

    }
);
