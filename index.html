<!-- ================================
     Puter AI
================================ -->

<script src="https://js.puter.com/v2/"></script>


<!-- ================================
     Tesseract OCR
================================ -->

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<script>


/* ==========================================
   العناصر
========================================== */

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const settings =
    document.getElementById("settings");

const analyzeButton =
    document.getElementById("analyzeButton");

const translateButton =
    document.getElementById("translateButton");

const sourceLanguage =
    document.getElementById("sourceLanguage");

const targetLanguage =
    document.getElementById("targetLanguage");

const progress =
    document.getElementById("progress");

const progressStatus =
    document.getElementById("progressStatus");

const progressPercent =
    document.getElementById("progressPercent");

const progressFill =
    document.getElementById("progressFill");

const status =
    document.getElementById("status");

const result =
    document.getElementById("result");

const originalText =
    document.getElementById("originalText");

const translationBox =
    document.getElementById("translationBox");

const translatedText =
    document.getElementById("translatedText");


let selectedImage = null;


/* ==========================================
   اختيار الصورة
========================================== */

imageInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];

        if (!file) {
            return;
        }

        if (
            !file.type.startsWith("image/")
        ) {

            alert(
                "الرجاء اختيار صورة فقط."
            );

            return;
        }


        selectedImage = file;


        previewImage.src =
            URL.createObjectURL(file);


        preview.classList.remove(
            "hidden"
        );


        settings.classList.remove(
            "hidden"
        );


        analyzeButton.classList.remove(
            "hidden"
        );


        result.style.display =
            "none";


        translationBox.classList.add(
            "hidden"
        );


        originalText.value = "";

        translatedText.value = "";


        status.classList.add(
            "hidden"
        );

    }
);


/* ==========================================
   تجهيز الصورة للـ OCR
========================================== */

function preprocessImage(file) {

    return new Promise(
        function(resolve, reject) {

            const img =
                new Image();

            const url =
                URL.createObjectURL(file);


            img.onload =
                function() {

                    try {

                        /*
                        تكبير الصورة
                        */

                        const scale = 2;

                        let width =
                            img.naturalWidth *
                            scale;

                        let height =
                            img.naturalHeight *
                            scale;


                        /*
                        منع الصورة من أن تصبح
                        ضخمة جدًا على الهاتف
                        */

                        const maxSize =
                            5000;


                        if (
                            width > maxSize ||
                            height > maxSize
                        ) {

                            const ratio =
                                Math.min(
                                    maxSize / width,
                                    maxSize / height
                                );

                            width =
                                Math.floor(
                                    width * ratio
                                );

                            height =
                                Math.floor(
                                    height * ratio
                                );

                        }


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        const ctx =
                            canvas.getContext(
                                "2d",
                                {
                                    willReadFrequently:
                                        true
                                }
                            );


                        /*
                        خلفية بيضاء
                        */

                        ctx.fillStyle =
                            "#ffffff";

                        ctx.fillRect(
                            0,
                            0,
                            width,
                            height
                        );


                        /*
                        تحسين جودة الرسم
                        */

                        ctx.imageSmoothingEnabled =
                            true;


                        ctx.imageSmoothingQuality =
                            "high";


                        ctx.drawImage(
                            img,
                            0,
                            0,
                            width,
                            height
                        );


                        /*
                        قراءة البيكسلات
                        */

                        const imageData =
                            ctx.getImageData(
                                0,
                                0,
                                width,
                                height
                            );


                        const data =
                            imageData.data;


                        /*
                        تحويل إلى رمادي
                        + زيادة التباين
                        + Threshold
                        */

                        for (
                            let i = 0;
                            i < data.length;
                            i += 4
                        ) {

                            const r =
                                data[i];

                            const g =
                                data[i + 1];

                            const b =
                                data[i + 2];


                            let gray =
                                (
                                    0.299 * r +
                                    0.587 * g +
                                    0.114 * b
                                );


                            /*
                            زيادة التباين
                            */

                            gray =
                                (
                                    gray - 128
                                ) * 1.35 +
                                128;


                            /*
                            أبيض وأسود
                            */

                            const value =
                                gray < 170
                                    ? 0
                                    : 255;


                            data[i] =
                                value;

                            data[i + 1] =
                                value;

                            data[i + 2] =
                                value;

                        }


                        ctx.putImageData(
                            imageData,
                            0,
                            0
                        );


                        URL.revokeObjectURL(
                            url
                        );


                        canvas.toBlob(
                            function(blob) {

                                if (!blob) {

                                    reject(
                                        new Error(
                                            "تعذر تجهيز الصورة."
                                        )
                                    );

                                    return;
                                }


                                resolve(blob);

                            },
                            "image/png",
                            1
                        );

                    }


                    catch(error) {

                        URL.revokeObjectURL(
                            url
                        );

                        reject(error);

                    }

                };


            img.onerror =
                function() {

                    URL.revokeObjectURL(
                        url
                    );

                    reject(
                        new Error(
                            "تعذر قراءة الصورة."
                        )
                    );

                };


            img.src =
                url;

        }
    );

}


/* ==========================================
   تنظيف النص الناتج
========================================== */

function cleanOCRText(text) {

    if (!text) {
        return "";
    }


    let cleaned =
        text
        .replace(/\r/g, "")
        .replace(/[|]{2,}/g, " ")
        .replace(/[_]{2,}/g, " ")
        .replace(/[~`^]+/g, "")
        .replace(/[ \t]+/g, " ")
        .replace(/\n[ \t]+/g, "\n")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();


    /*
    حذف الأسطر التي لا تحتوي
    على أي حروف أو أرقام
    */

    const lines =
        cleaned.split("\n");


    const usefulLines =
        lines.filter(
            function(line) {

                const value =
                    line.trim();

                if (!value) {
                    return false;
                }


                /*
                تجاهل الأسطر التي هي مجرد
                رموز OCR
                */

                if (
                    /^[^A-Za-zÀ-ÿ\u3040-\u30ff\u4e00-\u9fff\u0600-\u06ff0-9]+$/
                    .test(value)
                ) {

                    return false;

                }


                return true;

            }
        );


    return usefulLines.join("\n");
}


/* ==========================================
   استخراج النص
========================================== */

analyzeButton.addEventListener(
    "click",
    async function() {


        if (!selectedImage) {

            alert(
                "اختر صورة أولًا."
            );

            return;
        }


        analyzeButton.disabled =
            true;


        progress.style.display =
            "block";


        status.classList.remove(
            "hidden"
        );


        progressFill.style.width =
            "0%";


        progressPercent.textContent =
            "0%";


        progressStatus.textContent =
            "جاري تحسين الصورة...";


        try {


            /*
            تجهيز الصورة
            */

            const processedImage =
                await preprocessImage(
                    selectedImage
                );


            progressFill.style.width =
                "15%";


            progressPercent.textContent =
                "15%";


            progressStatus.textContent =
                "جاري تحميل OCR...";


            /*
            لغة OCR
            */

            let ocrLanguage;


            if (
                sourceLanguage.value === "ja"
            ) {

                ocrLanguage =
                    "jpn";

            }

            else if (
                sourceLanguage.value === "id"
            ) {

                ocrLanguage =
                    "ind";

            }

            else {

                ocrLanguage =
                    "eng";

            }


            /*
            إنشاء Worker
            */

            const worker =
                await Tesseract.createWorker(
                    ocrLanguage,
                    1,
                    {

                        logger:
                            function(message) {


                                if (
                                    message.status ===
                                    "loading language traineddata"
                                ) {

                                    progressStatus.textContent =
                                        "تحميل نموذج اللغة...";

                                }


                                else if (
                                    message.status ===
                                    "recognizing text"
                                ) {

                                    progressStatus.textContent =
                                        "جاري قراءة النص...";

                                }


                                else {

                                    progressStatus.textContent =
                                        message.status ||
                                        "جاري المعالجة...";

                                }


                                if (
                                    typeof message.progress ===
                                    "number"
                                ) {

                                    const p =
                                        Math.round(
                                            message.progress *
                                            100
                                        );


                                    /*
                                    OCR يبدأ من 15%
                                    */

                                    const percent =
                                        15 +
                                        Math.round(
                                            p * 0.85
                                        );


                                    progressFill.style.width =
                                        percent + "%";


                                    progressPercent.textContent =
                                        percent + "%";

                                }

                            }

                    }
                );


            /*
            وضع OCR للنصوص المتفرقة
            */

            try {

                await worker.setParameters({

                    tessedit_pageseg_mode:
                        "11",

                    preserve_interword_spaces:
                        "1"

                });

            }

            catch(parameterError) {

                console.log(
                    "OCR parameter notice:",
                    parameterError
                );

            }


            /*
            تشغيل OCR
            */

            const output =
                await worker.recognize(
                    processedImage
                );


            const rawText =
                output?.data?.text ||
                "";


            const cleanText =
                cleanOCRText(
                    rawText
                );


            originalText.value =
                cleanText;


            result.style.display =
                "block";


            progressFill.style.width =
                "100%";


            progressPercent.textContent =
                "100%";


            progressStatus.textContent =
                "اكتمل استخراج النص.";


            if (cleanText) {

                status.textContent =
                    "✅ تم استخراج النص. يمكنك تعديله يدويًا قبل الترجمة.";

            }

            else {

                status.textContent =
                    "⚠️ لم يتم العثور على نص واضح في الصورة.";

            }


            await worker.terminate();

        }


        catch(error) {

            console.error(
                "OCR ERROR:",
                error
            );


            status.textContent =
                "❌ حدث خطأ في OCR: " +
                (
                    error?.message ||
                    String(error)
                );

        }


        finally {

            analyzeButton.disabled =
                false;

        }

    }
);


/* ==========================================
   أسماء اللغات
========================================== */

function getLanguageName(code) {

    if (code === "ja") {
        return "اليابانية";
    }

    if (code === "en") {
        return "الإنجليزية";
    }

    if (code === "id") {
        return "الإندونيسية";
    }

    if (code === "ar") {
        return "العربية";
    }

    if (code === "fr") {
        return "الفرنسية";
    }

    return code;
}


/* ==========================================
   تقسيم النص الطويل
========================================== */

function splitText(text, maxLength) {

    const paragraphs =
        text.split(/\n+/);

    const chunks = [];

    let current = "";


    for (
        const paragraph of paragraphs
    ) {

        const part =
            paragraph.trim();


        if (!part) {
            continue;
        }


        if (
            current.length +
            part.length +
            1 <=
            maxLength
        ) {

            current =
                current
                ? current + "\n" + part
                : part;

        }

        else {

            if (current) {
                chunks.push(current);
            }

            current =
                part;

        }

    }


    if (current) {
        chunks.push(current);
    }


    return chunks;

}


/* ==========================================
   الترجمة
========================================== */

translateButton.addEventListener(
    "click",
    async function() {


        const text =
            originalText.value.trim();


        if (!text) {

            alert(
                "استخرج النص من الصورة أولًا."
            );

            return;
        }


        /*
        التأكد من Puter
        */

        if (
            typeof puter === "undefined" ||
            !puter.ai ||
            typeof puter.ai.chat !==
            "function"
        ) {

            status.classList.remove(
                "hidden"
            );


            status.textContent =
                "❌ لم يتم تحميل الذكاء الاصطناعي. تحقق من الإنترنت وأعد تحميل الصفحة.";

            return;

        }


        translateButton.disabled =
            true;


        translationBox.classList.remove(
            "hidden"
        );


        translatedText.value =
            "جاري الترجمة...";


        status.classList.remove(
            "hidden"
        );


        const source =
            getLanguageName(
                sourceLanguage.value
            );


        const target =
            getLanguageName(
                targetLanguage.value
            );


        try {


            const chunks =
                splitText(
                    text,
                    2500
                );


            const results = [];


            for (
                let i = 0;
                i < chunks.length;
                i++
            ) {


                status.textContent =
                    "🌐 جاري ترجمة الجزء " +
                    (i + 1) +
                    " من " +
                    chunks.length +
                    "...";


                const prompt = `

أنت مترجم محترف متخصص في المانغا والكوميكس.

ترجم النص التالي من ${source} إلى ${target}.

قواعد الترجمة:

- أخرج الترجمة فقط.
- لا تشرح.
- لا تضف مقدمة.
- لا تضف خاتمة.
- حافظ على معنى الحوار.
- اجعل الترجمة طبيعية ومناسبة للمانغا.
- حافظ على ترتيب الجمل.
- لا تخترع معلومات.
- حافظ على أسماء الشخصيات.
- حافظ على علامات الاستفهام والتعجب.
- ترجم الأصوات والانفعالات بشكل طبيعي.
- لا تحذف الجمل.
- إذا كان OCR يحتوي على أخطاء واضحة، حاول تصحيحها اعتمادًا على السياق.
- لا تذكر أن النص يحتوي على أخطاء OCR.
- لا تقل إنك لا تستطيع الترجمة.
- حاول ترجمة النص بأفضل شكل ممكن.

النص:

${chunks[i]}

`;


                /*
                مهم:
                لا temperature
                ولا max_tokens
                */

                const response =
                    await puter.ai.chat(
                        prompt,
                        {
                            model:
                                "gpt-5-nano"
                        }
                    );


                let translated = "";


                if (
                    typeof response ===
                    "string"
                ) {

                    translated =
                        response;

                }


                else if (
                    response &&
                    response.message &&
                    typeof response.message.content ===
                    "string"
                ) {

                    translated =
                        response.message.content;

                }


                else if (
                    response &&
                    response.message &&
                    Array.isArray(
                        response.message.content
                    )
                ) {

                    translated =
                        response.message.content
                        .map(
                            item =>
                                item?.text ||
                                ""
                        )
                        .join("");

                }


                else if (
                    response &&
                    typeof response.content ===
                    "string"
                ) {

                    translated =
                        response.content;

                }


                translated =
                    translated.trim();


                if (!translated) {

                    throw new Error(
                        "لم يرجع الذكاء الاصطناعي ترجمة."
                    );

                }


                results.push(
                    translated
                );


                translatedText.value =
                    results.join(
                        "\n\n"
                    );

            }


            status.textContent =
                "✅ تمت الترجمة بنجاح.";

        }


        catch(error) {

            console.error(
                "TRANSLATION ERROR:",
                error
            );


            translatedText.value =
                "";


            status.textContent =
                "❌ حدث خطأ في الترجمة: " +
                (
                    error?.message ||
                    String(error)
                );

        }


        finally {

            translateButton.disabled =
                false;

        }

    }
);

</script>
