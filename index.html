<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MangaTranslate AI</title>

    <!-- Puter.js -->
    <script src="https://js.puter.com/v2/"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #0f1117;
            color: #ffffff;
        }

        .app {
            width: 100%;
            max-width: 850px;
            margin: auto;
            padding: 18px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin-bottom: 5px;
            font-size: 28px;
        }

        .header p {
            margin-top: 0;
            color: #aaa;
        }

        .card {
            background: #191d27;
            border-radius: 15px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid #2c3242;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        button {
            width: 100%;
            min-height: 48px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
        }

        select {
            background: #252b38;
            color: white;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #3a4255;
        }

        .upload {
            display: block;
            background: #252b38;
            border: 2px dashed #4d5870;
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .upload:hover {
            background: #2b3241;
        }

        #imageInput {
            display: none;
        }

        button {
            cursor: pointer;
            background: #6c5ce7;
            color: white;
            font-weight: bold;
            padding: 12px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .download-btn {
            background: #00a86b;
            margin-top: 10px;
            display: none;
        }

        .clear-btn {
            background: #343b4d;
            margin-top: 10px;
        }

        #previewContainer {
            display: none;
            overflow: auto;
            margin-top: 15px;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
            background: white;
        }

        #status {
            margin-top: 14px;
            line-height: 1.7;
            text-align: center;
            color: #ccc;
            white-space: pre-line;
        }

        .loading {
            color: #ffd166 !important;
        }

        .success {
            color: #4ade80 !important;
        }

        .error {
            color: #ff6b6b !important;
        }

        #results {
            display: none;
        }

        .textBlock {
            background: #242a37;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .original {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 7px;
            direction: auto;
        }

        .translated {
            font-size: 17px;
            font-weight: bold;
            direction: auto;
        }

        .small {
            color: #999;
            font-size: 13px;
            line-height: 1.7;
        }

        .badge {
            display: inline-block;
            background: #272e3d;
            padding: 5px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
            color: #b8c0d0;
            font-size: 13px;
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .two {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>📖 MangaTranslate AI</h1>
        <p>ترجمة نص المانغا والقصص المصورة داخل الصورة</p>
    </div>

    <div class="card">

        <span class="badge">
            النسخة التجريبية V1
        </span>

        <label class="upload" for="imageInput">
            📷 اضغط هنا واختر صورة المانغا
            <br>
            <span class="small">
                JPG / PNG / WEBP
            </span>
        </label>

        <input
            id="imageInput"
            type="file"
            accept="image/*"
        >

        <div class="two">

            <div>
                <label>لغة النص الأصلية</label>

                <select id="sourceLanguage">

                    <option value="auto">
                        اكتشاف تلقائي
                    </option>

                    <option value="Japanese">
                        اليابانية
                    </option>

                    <option value="English">
                        الإنجليزية
                    </option>

                    <option value="Korean">
                        الكورية
                    </option>

                    <option value="Chinese">
                        الصينية
                    </option>

                    <option value="French">
                        الفرنسية
                    </option>

                    <option value="Spanish">
                        الإسبانية
                    </option>

                    <option value="Indonesian">
                        الإندونيسية
                    </option>

                </select>
            </div>

            <div>
                <label>الترجمة إلى</label>

                <select id="targetLanguage">

                    <option value="Arabic">
                        العربية
                    </option>

                    <option value="English">
                        الإنجليزية
                    </option>

                    <option value="French">
                        الفرنسية
                    </option>

                    <option value="Japanese">
                        اليابانية
                    </option>

                </select>
            </div>

        </div>

        <button id="translateButton" disabled>
            ✨ ترجمة الصورة
        </button>

        <button id="downloadButton" class="download-btn">
            ⬇ حفظ الصورة المترجمة
        </button>

        <button id="clearButton" class="clear-btn">
            🗑 صورة جديدة
        </button>

        <div id="status">
            اختر صورة للبدء
        </div>

    </div>


    <div id="previewContainer" class="card">

        <canvas id="canvas"></canvas>

    </div>


    <div id="results" class="card">

        <h3>
            📝 النصوص التي تم اكتشافها
        </h3>

        <div id="textResults"></div>

    </div>

</div>


<script>

const imageInput =
    document.getElementById("imageInput");

const translateButton =
    document.getElementById("translateButton");

const downloadButton =
    document.getElementById("downloadButton");

const clearButton =
    document.getElementById("clearButton");

const sourceLanguage =
    document.getElementById("sourceLanguage");

const targetLanguage =
    document.getElementById("targetLanguage");

const statusBox =
    document.getElementById("status");

const previewContainer =
    document.getElementById("previewContainer");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const results =
    document.getElementById("results");

const textResults =
    document.getElementById("textResults");


let workingFile = null;
let workingImage = null;
let detectedBlocks = [];


/* ===============================
   STATUS
================================ */

function setStatus(text, type = "") {

    statusBox.textContent = text;

    statusBox.className = type;

}


/* ===============================
   IMAGE SELECTION
================================ */

imageInput.addEventListener(
    "change",
    async function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        if (!file.type.startsWith("image/")) {

            setStatus(
                "الملف المختار ليس صورة.",
                "error"
            );

            return;
        }

        try {

            setStatus(
                "جاري تجهيز الصورة...",
                "loading"
            );

            workingFile =
                await prepareImage(file);

            await loadPreview(
                workingFile
            );

            translateButton.disabled =
                false;

            downloadButton.style.display =
                "none";

            results.style.display =
                "none";

            detectedBlocks = [];

            setStatus(
                "✅ الصورة جاهزة.\nاضغط ترجمة الصورة.",
                "success"
            );

        } catch (error) {

            console.error(error);

            setStatus(
                "حدث خطأ أثناء تحميل الصورة.",
                "error"
            );

        }

    }
);


/* ===============================
   RESIZE IMAGE
================================ */

async function prepareImage(file) {

    const img =
        await fileToImage(file);

    const maxDimension = 1800;

    let width =
        img.naturalWidth;

    let height =
        img.naturalHeight;

    if (
        width <= maxDimension &&
        height <= maxDimension
    ) {

        return file;

    }

    const ratio =
        Math.min(
            maxDimension / width,
            maxDimension / height
        );

    width =
        Math.round(width * ratio);

    height =
        Math.round(height * ratio);

    const tempCanvas =
        document.createElement("canvas");

    tempCanvas.width =
        width;

    tempCanvas.height =
        height;

    const tempCtx =
        tempCanvas.getContext("2d");

    tempCtx.drawImage(
        img,
        0,
        0,
        width,
        height
    );

    const blob =
        await new Promise(resolve => {

            tempCanvas.toBlob(
                resolve,
                "image/jpeg",
                0.9
            );

        });

    return new File(
        [blob],
        "manga-page.jpg",
        {
            type: "image/jpeg"
        }
    );

}


/* ===============================
   FILE -> IMAGE
================================ */

function fileToImage(file) {

    return new Promise(
        (resolve, reject) => {

            const url =
                URL.createObjectURL(file);

            const img =
                new Image();

            img.onload = () => {

                URL.revokeObjectURL(url);

                resolve(img);

            };

            img.onerror = () => {

                URL.revokeObjectURL(url);

                reject(
                    new Error("Image load error")
                );

            };

            img.src = url;

        }
    );

}


/* ===============================
   PREVIEW
================================ */

async function loadPreview(file) {

    workingImage =
        await fileToImage(file);

    canvas.width =
        workingImage.naturalWidth;

    canvas.height =
        workingImage.naturalHeight;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(
        workingImage,
        0,
        0,
        canvas.width,
        canvas.height
    );

    previewContainer.style.display =
        "block";

}


/* ===============================
   TRANSLATION BUTTON
================================ */

translateButton.addEventListener(
    "click",
    async function () {

        if (!workingFile) {

            setStatus(
                "اختر صورة أولاً.",
                "error"
            );

            return;

        }

        translateButton.disabled =
            true;

        downloadButton.style.display =
            "none";

        results.style.display =
            "none";

        textResults.innerHTML =
            "";

        try {

            /*
             Puter login
            */

            if (
                !puter.auth.isSignedIn()
            ) {

                setStatus(
                    "جاري الاتصال بـ Puter...\nقد تظهر نافذة تسجيل الدخول.",
                    "loading"
                );

                await puter.auth.signIn({
                    attempt_temp_user_creation: true
                });

            }


            setStatus(
                "🔍 الذكاء الاصطناعي يقرأ الصفحة...\nيرجى الانتظار.",
                "loading"
            );


            const prompt =
                buildPrompt();


            /*
             Vision AI
            */

            let response;

            try {

                response =
                    await puter.ai.chat(
                        prompt,
                        workingFile,
                        {
                            model:
                                "gpt-5.6-luna"
                        }
                    );

            } catch (firstError) {

                console.warn(
                    "First model failed:",
                    firstError
                );

                setStatus(
                    "إعادة المحاولة بنموذج آخر...",
                    "loading"
                );

                response =
                    await puter.ai.chat(
                        prompt,
                        workingFile
                    );

            }


            const responseText =
                extractResponseText(
                    response
                );


            console.log(
                "RAW AI RESPONSE:",
                responseText
            );


            const blocks =
                parseAIResponse(
                    responseText
                );


            if (
                !blocks ||
                blocks.length === 0
            ) {

                throw new Error(
                    "لم يتم العثور على نصوص في الصورة."
                );

            }


            detectedBlocks =
                blocks
                    .map(normalizeBlock)
                    .filter(Boolean);


            if (
                detectedBlocks.length === 0
            ) {

                throw new Error(
                    "فشل تحليل أماكن النص."
                );

            }


            drawTranslatedImage(
                detectedBlocks
            );


            showTextResults(
                detectedBlocks
            );


            downloadButton.style.display =
                "block";

            setStatus(
                "✅ تمت الترجمة.\nتم العثور على " +
                detectedBlocks.length +
                " منطقة نصية.",
                "success"
            );


        } catch (error) {

            console.error(error);

            let message =
                error?.message ||
                error?.msg ||
                String(error);


            setStatus(
                "❌ حدث خطأ:\n" +
                message,
                "error"
            );

        } finally {

            translateButton.disabled =
                false;

        }

    }
);


/* ===============================
   AI PROMPT
================================ */

function buildPrompt() {

    const source =
        sourceLanguage.value;

    const target =
        targetLanguage.value;


    return `

You are an expert manga and comic OCR translator.

Analyze the ENTIRE image carefully.

SOURCE LANGUAGE:
${source}

TARGET LANGUAGE:
${target}

TASK:

1. Detect all meaningful text regions:
   - speech bubbles
   - narration boxes
   - captions
   - dialogue
   - important sound effects

2. Treat each complete speech bubble or text region as ONE block.

3. VERY IMPORTANT:
   Do NOT split Japanese characters into individual blocks.
   Do NOT create one block per letter.
   Keep vertical Japanese text together when it belongs to the same bubble.

4. Read the original text exactly.

5. Translate naturally into ${target}.

6. Find the approximate position of every text region.

Coordinates MUST use a 0 to 1000 coordinate system:

x = left edge
y = top edge
width = region width
height = region height

All coordinates refer to the FULL IMAGE.

Return ONLY valid JSON.

NO markdown.
NO explanation.
NO code fences.

Required format:

[
  {
    "x": 120,
    "y": 80,
    "width": 250,
    "height": 160,
    "original": "original text",
    "translation": "translated text",
    "type": "dialogue"
  }
]

Allowed type values:

dialogue
narration
caption
sfx

Rules:

- Never invent text.
- Ignore page numbers and meaningless tiny marks.
- Preserve names when appropriate.
- Make Arabic translation natural and readable.
- Combine text belonging to the same bubble.
- Return [] if there is no readable text.

`;

}


/* ===============================
   RESPONSE TEXT
================================ */

function extractResponseText(response) {

    if (
        typeof response === "string"
    ) {
        return response;
    }


    const content =
        response?.message?.content ??
        response?.content ??
        response?.text;


    if (
        typeof content === "string"
    ) {

        return content;

    }


    if (
        Array.isArray(content)
    ) {

        return content
            .map(item => {

                if (
                    typeof item === "string"
                ) {
                    return item;
                }

                return (
                    item?.text ||
                    item?.content ||
                    ""
                );

            })
            .join("\n");

    }


    return JSON.stringify(
        response
    );

}


/* ===============================
   JSON PARSER
================================ */

function parseAIResponse(text) {

    if (!text) {
        return [];
    }


    let cleaned =
        text
            .trim()
            .replace(
                /```json/gi,
                ""
            )
            .replace(
                /```/g,
                ""
            )
            .trim();


    /*
     Try direct JSON
    */

    try {

        const parsed =
            JSON.parse(cleaned);

        if (
            Array.isArray(parsed)
        ) {

            return parsed;

        }

        if (
            Array.isArray(
                parsed.blocks
            )
        ) {

            return parsed.blocks;

        }

    } catch (e) {

    }


    /*
     Search JSON array inside response
    */

    const first =
        cleaned.indexOf("[");

    const last =
        cleaned.lastIndexOf("]");


    if (
        first !== -1 &&
        last !== -1 &&
        last > first
    ) {

        const json =
            cleaned.substring(
                first,
                last + 1
            );

        try {

            return JSON.parse(
                json
            );

        } catch (e) {

            console.error(
                "JSON parsing failed",
                e
            );

        }

    }


    throw new Error(
        "الذكاء الاصطناعي لم يرجع JSON صالحًا."
    );

}


/* ===============================
   NORMALIZE BLOCKS
================================ */

function normalizeBlock(block) {

    if (!block) {
        return null;
    }


    let x =
        Number(block.x);

    let y =
        Number(block.y);

    let width =
        Number(block.width);

    let height =
        Number(block.height);


    /*
     Optional bounding-box formats
    */

    if (
        Array.isArray(block.bbox) &&
        block.bbox.length >= 4
    ) {

        x =
            Number(block.bbox[0]);

        y =
            Number(block.bbox[1]);

        width =
            Number(block.bbox[2]);

        height =
            Number(block.bbox[3]);

    }


    /*
     Model sometimes returns 0-1 coordinates
    */

    const maxValue =
        Math.max(
            x,
            y,
            width,
            height
        );


    if (
        maxValue <= 1.5
    ) {

        x *= 1000;
        y *= 1000;
        width *= 1000;
        height *= 1000;

    }


    if (
        !Number.isFinite(x) ||
        !Number.isFinite(y) ||
        !Number.isFinite(width) ||
        !Number.isFinite(height)
    ) {

        return null;

    }


    x =
        clamp(x, 0, 1000);

    y =
        clamp(y, 0, 1000);

    width =
        clamp(
            width,
            20,
            1000 - x
        );

    height =
        clamp(
            height,
            20,
            1000 - y
        );


    const translation =
        String(
            block.translation || ""
        ).trim();


    const original =
        String(
            block.original || ""
        ).trim();


    if (
        !translation &&
        !original
    ) {

        return null;

    }


    return {

        x,
        y,
        width,
        height,

        original,

        translation:
            translation || original,

        type:
            block.type || "dialogue"

    };

}


function clamp(
    number,
    min,
    max
) {

    return Math.min(
        Math.max(
            number,
            min
        ),
        max
    );

}


/* ===============================
   DRAW TRANSLATION
================================ */

function drawTranslatedImage(blocks) {

    /*
     Original image
    */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.drawImage(
        workingImage,
        0,
        0,
        canvas.width,
        canvas.height
    );


    blocks.forEach(
        block => {

            const x =
                block.x / 1000 *
                canvas.width;

            const y =
                block.y / 1000 *
                canvas.height;

            const width =
                block.width / 1000 *
                canvas.width;

            const height =
                block.height / 1000 *
                canvas.height;


            drawTranslationBox(
                block.translation,
                x,
                y,
                width,
                height
            );

        }
    );

}


/* ===============================
   TRANSLATION BOX
================================ */

function drawTranslationBox(
    text,
    x,
    y,
    width,
    height
) {

    const padding =
        Math.max(
            4,
            Math.min(
                width,
                height
            ) * 0.06
        );


    /*
     Cover old text
    */

    ctx.save();

    ctx.fillStyle =
        "rgba(255,255,255,0.94)";

    roundedRect(
        ctx,
        x,
        y,
        width,
        height,
        Math.min(
            width,
            height
        ) * 0.12
    );

    ctx.fill();

    ctx.restore();


    /*
     Find font size
    */

    const maxWidth =
        width -
        padding * 2;

    const maxHeight =
        height -
        padding * 2;


    let fontSize =
        Math.max(
            11,
            Math.min(
                height * 0.35,
                width * 0.16,
                52
            )
        );


    let lines = [];


    while (
        fontSize >= 10
    ) {

        ctx.font =
            `bold ${fontSize}px Arial, Tahoma, sans-serif`;


        lines =
            wrapText(
                text,
                maxWidth
            );


        const lineHeight =
            fontSize * 1.25;


        if (
            lines.length *
            lineHeight <=
            maxHeight
        ) {

            break;

        }


        fontSize -= 1;

    }


    const lineHeight =
        fontSize * 1.25;


    ctx.save();

    ctx.fillStyle =
        "#111111";

    ctx.font =
        `bold ${fontSize}px Arial, Tahoma, sans-serif`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    if (
        targetLanguage.value ===
        "Arabic"
    ) {

        ctx.direction =
            "rtl";

    } else {

        ctx.direction =
            "ltr";

    }


    const totalHeight =
        lines.length *
        lineHeight;


    let currentY =
        y +
        height / 2 -
        totalHeight / 2 +
        lineHeight / 2;


    lines.forEach(
        line => {

            ctx.fillText(
                line,
                x + width / 2,
                currentY
            );

            currentY +=
                lineHeight;

        }
    );


    ctx.restore();

}


/* ===============================
   WORD WRAPPING
================================ */

function wrapText(
    text,
    maxWidth
) {

    text =
        String(text)
            .replace(/\s+/g, " ")
            .trim();


    if (!text) {
        return [];
    }


    const words =
        text.split(" ");

    const lines = [];

    let line =
        "";


    for (
        const word of words
    ) {

        const testLine =
            line
                ? line + " " + word
                : word;


        const width =
            ctx.measureText(
                testLine
            ).width;


        if (
            width <= maxWidth
        ) {

            line =
                testLine;

        } else {

            if (line) {

                lines.push(
                    line
                );

            }


            /*
             Very long word
            */

            if (
                ctx.measureText(
                    word
                ).width >
                maxWidth
            ) {

                let charLine =
                    "";

                for (
                    const char of word
                ) {

                    const test =
                        charLine +
                        char;

                    if (
                        ctx.measureText(
                            test
                        ).width >
                        maxWidth
                    ) {

                        if (
                            charLine
                        ) {

                            lines.push(
                                charLine
                            );

                        }

                        charLine =
                            char;

                    } else {

                        charLine =
                            test;

                    }

                }

                line =
                    charLine;

            } else {

                line =
                    word;

            }

        }

    }


    if (line) {

        lines.push(
            line
        );

    }


    return lines;

}


/* ===============================
   ROUNDED RECTANGLE
================================ */

function roundedRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
) {

    radius =
        Math.min(
            radius,
            width / 2,
            height / 2
        );


    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();

}


/* ===============================
   TEXT RESULTS
================================ */

function showTextResults(blocks) {

    textResults.innerHTML =
        "";


    blocks.forEach(
        (block, index) => {

            const container =
                document.createElement(
                    "div"
                );

            container.className =
                "textBlock";


            const original =
                document.createElement(
                    "div"
                );

            original.className =
                "original";

            original.textContent =
                (index + 1) +
                ". الأصل: " +
                block.original;


            const translation =
                document.createElement(
                    "div"
                );

            translation.className =
                "translated";

            translation.textContent =
                block.translation;


            container.appendChild(
                original
            );

            container.appendChild(
                translation
            );

            textResults.appendChild(
                container
            );

        }
    );


    results.style.display =
        "block";

}


/* ===============================
   DOWNLOAD
================================ */

downloadButton.addEventListener(
    "click",
    function () {

        canvas.toBlob(
            blob => {

                if (!blob) {

                    setStatus(
                        "تعذر إنشاء الصورة.",
                        "error"
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );

                a.href =
                    url;

                a.download =
                    "manga-translated.png";


                document.body.appendChild(
                    a
                );

                a.click();

                a.remove();


                setTimeout(
                    () => {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );

            },
            "image/png"
        );

    }
);


/* ===============================
   CLEAR
================================ */

clearButton.addEventListener(
    "click",
    function () {

        imageInput.value =
            "";

        workingFile =
            null;

        workingImage =
            null;

        detectedBlocks =
            [];

        canvas.width =
            1;

        canvas.height =
            1;

        previewContainer.style.display =
            "none";

        results.style.display =
            "none";

        downloadButton.style.display =
            "none";

        translateButton.disabled =
            true;

        textResults.innerHTML =
            "";

        setStatus(
            "اختر صورة للبدء"
        );

    }
);

</script>
