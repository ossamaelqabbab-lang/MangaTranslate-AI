<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MangaTranslate AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d1017;
    color: white;
    font-family: Arial, Tahoma, sans-serif;
}

.app {
    max-width: 850px;
    margin: auto;
    padding: 18px;
}

header {
    text-align: center;
    padding: 18px 0;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    color: #9ca3af;
    margin-top: 8px;
}

.card {
    background: #171c27;
    border: 1px solid #2b3345;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
}

label {
    display: block;
    margin: 10px 0 7px;
    font-weight: bold;
}

input,
select,
button {
    width: 100%;
    min-height: 48px;
    border-radius: 10px;
    font-size: 16px;
}

input,
select {
    border: 1px solid #3a455e;
    background: #222938;
    color: white;
    padding: 10px;
}

#apiKey {
    direction: ltr;
}

.upload {
    border: 2px dashed #4a5875;
    background: #202735;
    text-align: center;
    padding: 25px 12px;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 16px;
}

.upload small {
    color: #aab1c0;
}

#imageInput {
    display: none;
}

.languages {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    border: none;
    color: white;
    padding: 12px;
    margin-top: 12px;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#translateButton {
    background: #6757e8;
}

#downloadButton {
    background: #07885f;
    display: none;
}

#newButton {
    background: #30394e;
}

#status {
    padding: 16px 5px 5px;
    text-align: center;
    white-space: pre-line;
    line-height: 1.7;
    word-break: break-word;
}

.success {
    color: #4ade80;
}

.error {
    color: #ff6b6b;
}

.loading {
    color: #ffd166;
}

#canvasCard {
    display: none;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: white;
    border-radius: 10px;
}

#results {
    display: none;
}

.result {
    background: #232a39;
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 10px;
}

.original {
    color: #a7adbb;
    font-size: 14px;
    margin-bottom: 7px;
    direction: auto;
}

.translation {
    font-weight: bold;
    font-size: 17px;
    direction: auto;
}

.note {
    color: #9ca3af;
    font-size: 13px;
    line-height: 1.7;
}

.model-info {
    font-size: 13px;
    color: #9ca3af;
    text-align: center;
    margin-top: 8px;
}

@media (max-width: 600px) {

    .languages {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 24px;
    }

}

</style>

</head>


<body>

<div class="app">

<header>

<h1>📖 MangaTranslate AI</h1>

<p>
ترجمة المانغا والقصص المصورة داخل الصورة
</p>

</header>


<div class="card">

<label>
🔑 Gemini API Key
</label>

<input
    id="apiKey"
    type="password"
    autocomplete="off"
    placeholder="ألصق مفتاح Gemini هنا"
/>

<p class="note">
المفتاح لا يتم وضعه داخل كود GitHub.
يُستخدم فقط عند تشغيل الصفحة.
</p>


<label
    class="upload"
    for="imageInput"
>

📷 اضغط هنا واختر صورة المانغا

<br>

<small>
JPG / PNG / WEBP
</small>

</label>


<input
    id="imageInput"
    type="file"
    accept="image/*"
/>


<div class="languages">

<div>

<label>
لغة النص الأصلية
</label>

<select id="sourceLanguage">

<option value="Automatic">
اكتشاف تلقائي
</option>

<option value="Japanese">
اليابانية
</option>

<option value="English">
الإنجليزية
</option>

<option value="Korean">
الكورية
</option>

<option value="Chinese">
الصينية
</option>

<option value="French">
الفرنسية
</option>

<option value="Spanish">
الإسبانية
</option>

<option value="Indonesian">
الإندونيسية
</option>

</select>

</div>


<div>

<label>
الترجمة إلى
</label>

<select id="targetLanguage">

<option value="Arabic">
العربية
</option>

<option value="English">
الإنجليزية
</option>

<option value="French">
الفرنسية
</option>

<option value="Spanish">
الإسبانية
</option>

<option value="Japanese">
اليابانية
</option>

</select>

</div>

</div>


<button
    id="translateButton"
    disabled
>
✨ ترجمة الصورة
</button>


<button id="downloadButton">
⬇ حفظ الصورة المترجمة
</button>


<button id="newButton">
🗑 صورة جديدة
</button>


<div id="status">
اختر صورة للبدء
</div>


<div
    id="modelInfo"
    class="model-info"
></div>

</div>


<div
    id="canvasCard"
    class="card"
>

<canvas id="canvas"></canvas>

</div>


<div
    id="results"
    class="card"
>

<h3>
📝 النصوص المكتشفة
</h3>

<div id="textResults"></div>

</div>

</div>


<script>

/* =========================================
   العناصر
========================================= */

const apiKeyInput =
    document.getElementById("apiKey");

const imageInput =
    document.getElementById("imageInput");

const sourceLanguage =
    document.getElementById("sourceLanguage");

const targetLanguage =
    document.getElementById("targetLanguage");

const translateButton =
    document.getElementById("translateButton");

const downloadButton =
    document.getElementById("downloadButton");

const newButton =
    document.getElementById("newButton");

const statusBox =
    document.getElementById("status");

const modelInfo =
    document.getElementById("modelInfo");

const canvasCard =
    document.getElementById("canvasCard");

const results =
    document.getElementById("results");

const textResults =
    document.getElementById("textResults");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let preparedImage = null;
let preparedBase64 = null;


/* =========================================
   الحالة
========================================= */

function setStatus(text, type = "") {

    statusBox.textContent =
        text;

    statusBox.className =
        type;

}


/* =========================================
   اختيار الصورة
========================================= */

imageInput.addEventListener(
    "change",
    async () => {

        const file =
            imageInput.files[0];


        if (!file) {
            return;
        }


        if (
            !file.type.startsWith("image/")
        ) {

            setStatus(
                "❌ الملف المختار ليس صورة.",
                "error"
            );

            return;

        }


        try {

            setStatus(
                "⏳ جاري تجهيز الصورة...",
                "loading"
            );


            const prepared =
                await prepareImage(file);


            preparedImage =
                prepared.image;


            preparedBase64 =
                prepared.base64;


            canvas.width =
                preparedImage.width;


            canvas.height =
                preparedImage.height;


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.drawImage(
                preparedImage,
                0,
                0
            );


            canvasCard.style.display =
                "block";


            results.style.display =
                "none";


            downloadButton.style.display =
                "none";


            translateButton.disabled =
                false;


            setStatus(
                "✅ الصورة جاهزة.\nأدخل مفتاح Gemini ثم اضغط ترجمة الصورة.",
                "success"
            );

        }

        catch (error) {

            console.error(error);


            setStatus(
                "❌ تعذر تجهيز الصورة.",
                "error"
            );

        }

    }
);


/* =========================================
   تجهيز الصورة
========================================= */

async function prepareImage(file) {

    const originalImage =
        await fileToImage(file);


    let width =
        originalImage.naturalWidth;


    let height =
        originalImage.naturalHeight;


    /*
       لتقليل حجم الطلب
       مع إبقاء النص واضحاً
    */

    const maxDimension =
        1800;


    if (
        width > maxDimension ||
        height > maxDimension
    ) {

        const scale =
            Math.min(
                maxDimension / width,
                maxDimension / height
            );


        width =
            Math.round(
                width * scale
            );


        height =
            Math.round(
                height * scale
            );

    }


    const tempCanvas =
        document.createElement(
            "canvas"
        );


    tempCanvas.width =
        width;


    tempCanvas.height =
        height;


    const tempCtx =
        tempCanvas.getContext("2d");


    tempCtx.fillStyle =
        "#ffffff";


    tempCtx.fillRect(
        0,
        0,
        width,
        height
    );


    tempCtx.drawImage(
        originalImage,
        0,
        0,
        width,
        height
    );


    const dataURL =
        tempCanvas.toDataURL(
            "image/jpeg",
            0.92
        );


    const resizedImage =
        new Image();


    await new Promise(
        (resolve, reject) => {

            resizedImage.onload =
                resolve;


            resizedImage.onerror =
                reject;


            resizedImage.src =
                dataURL;

        }
    );


    return {

        image:
            resizedImage,

        base64:
            dataURL.split(",")[1]

    };

}


/* =========================================
   تحويل File إلى Image
========================================= */

function fileToImage(file) {

    return new Promise(
        (resolve, reject) => {

            const url =
                URL.createObjectURL(
                    file
                );


            const image =
                new Image();


            image.onload =
                () => {

                    URL.revokeObjectURL(
                        url
                    );


                    resolve(image);

                };


            image.onerror =
                () => {

                    URL.revokeObjectURL(
                        url
                    );


                    reject(
                        new Error(
                            "فشل فتح الصورة."
                        )
                    );

                };


            image.src =
                url;

        }
    );

}


/* =========================================
   زر الترجمة
========================================= */

translateButton.addEventListener(
    "click",
    async () => {

        const apiKey =
            apiKeyInput.value.trim();


        if (!apiKey) {

            setStatus(
                "❌ ألصق Gemini API Key أولاً.",
                "error"
            );

            return;

        }


        if (!preparedBase64) {

            setStatus(
                "❌ اختر صورة أولاً.",
                "error"
            );

            return;

        }


        translateButton.disabled =
            true;


        downloadButton.style.display =
            "none";


        results.style.display =
            "none";


        modelInfo.textContent =
            "";


        try {

            setStatus(
                "🔎 جاري البحث عن نماذج Gemini المتاحة...",
                "loading"
            );


            /*
             نجلب النماذج المتاحة
             لمفتاح المستخدم فعلياً
            */

            const models =
                await getAvailableModels(
                    apiKey
                );


            if (!models.length) {

                throw new Error(
                    "لم يتم العثور على نموذج Gemini مناسب لهذا المفتاح."
                );

            }


            console.log(
                "Available models:",
                models
            );


            const prompt =
                createPrompt();


            const result =
                await callGeminiWithFallback(
                    apiKey,
                    models,
                    prompt,
                    preparedBase64
                );


            modelInfo.textContent =
                "النموذج المستخدم: " +
                result.model;


            const blocks =
                parseResponse(
                    result.text
                );


            if (!blocks.length) {

                throw new Error(
                    "لم يتم العثور على نص قابل للترجمة في الصورة."
                );

            }


            drawTranslation(
                blocks
            );


            showResults(
                blocks
            );


            downloadButton.style.display =
                "block";


            setStatus(
                "✅ تمت الترجمة بنجاح.\nتم اكتشاف " +
                blocks.length +
                " منطقة نصية.",
                "success"
            );

        }

        catch (error) {

            console.error(error);


            setStatus(
                "❌ حدث خطأ:\n" +
                (
                    error?.message ||
                    String(error)
                ),
                "error"
            );

        }

        finally {

            translateButton.disabled =
                false;

        }

    }
);


/* =========================================
   الحصول على النماذج المتاحة
========================================= */

async function getAvailableModels(apiKey) {

    const url =
        "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100";


    let response;


    try {

        response =
            await fetch(
                url,
                {

                    method:
                        "GET",

                    headers: {

                        "x-goog-api-key":
                            apiKey

                    }

                }
            );

    }

    catch (error) {

        /*
         إذا فشل جلب القائمة
         نستخدم نماذج احتياطية
        */

        console.warn(
            "Model list request failed",
            error
        );


        return fallbackModels();

    }


    let data = {};


    try {

        data =
            await response.json();

    }

    catch {

    }


    if (
        response.status === 401 ||
        response.status === 403
    ) {

        throw new Error(
            "مفتاح Gemini غير صالح أو لا يملك صلاحية استخدام Gemini API."
        );

    }


    if (!response.ok) {

        console.warn(
            "Could not fetch model list",
            data
        );


        return fallbackModels();

    }


    const available =
        Array.isArray(data.models)
            ? data.models
            : [];


    const candidates =
        available
            .filter(
                model => {

                    const name =
                        String(
                            model.name || ""
                        ).toLowerCase();


                    const methods =
                        model.supportedGenerationMethods ||
                        [];


                    if (
                        !name.includes("gemini")
                    ) {
                        return false;
                    }


                    if (
                        !methods.includes(
                            "generateContent"
                        )
                    ) {
                        return false;
                    }


                    /*
                     نستبعد نماذج ليست مناسبة
                     لمهمتنا
                    */

                    const excludedWords = [

                        "embedding",
                        "aqa",
                        "tts",
                        "audio",
                        "live",
                        "imagen",
                        "image-generation"

                    ];


                    for (
                        const word of excludedWords
                    ) {

                        if (
                            name.includes(
                                word
                            )
                        ) {

                            return false;

                        }

                    }


                    return true;

                }
            )
            .map(
                model =>
                    String(
                        model.name || ""
                    )
                    .replace(
                        /^models\//,
                        ""
                    )
            );


    /*
     ترتيب النماذج:
     Flash Lite أولاً
     ثم Flash
     ثم Pro
    */

    candidates.sort(
        (a, b) =>
            scoreModel(b) -
            scoreModel(a)
    );


    const unique =
        [
            ...new Set(
                candidates
            )
        ];


    /*
     لا نريد تجربة عشرات النماذج
    */

    return unique.slice(
        0,
        8
    );

}


/* =========================================
   تقييم النموذج
========================================= */

function scoreModel(modelName) {

    const name =
        modelName.toLowerCase();


    let score =
        0;


    if (
        name.includes(
            "flash-lite"
        )
    ) {

        score +=
            100;

    }

    else if (
        name.includes(
            "flash"
        )
    ) {

        score +=
            90;

    }

    else if (
        name.includes(
            "pro"
        )
    ) {

        score +=
            60;

    }


    /*
     النماذج المستقرة أفضل
     من Preview للاختبار الحالي
    */

    if (
        name.includes(
            "preview"
        )
    ) {

        score -=
            15;

    }


    if (
        name.includes(
            "exp"
        )
    ) {

        score -=
            20;

    }


    if (
        name.includes(
            "latest"
        )
    ) {

        score +=
            3;

    }


    return score;

}


/* =========================================
   قائمة احتياطية
========================================= */

function fallbackModels() {

    return [

        "gemini-2.5-flash-lite",

        "gemini-2.5-flash",

        "gemini-2.0-flash-lite",

        "gemini-2.0-flash"

    ];

}


/* =========================================
   Gemini + إعادة المحاولة
========================================= */

async function callGeminiWithFallback(
    apiKey,
    models,
    prompt,
    base64
) {

    const sleep =
        milliseconds =>
            new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        milliseconds
                    )
            );


    let lastError =
        "فشل الاتصال بـ Gemini.";


    /*
     نجرب كل نموذج
    */

    for (
        let modelIndex = 0;
        modelIndex < models.length;
        modelIndex++
    ) {

        const model =
            models[
                modelIndex
            ];


        /*
         ثلاث محاولات للنموذج
        */

        for (
            let attempt = 1;
            attempt <= 3;
            attempt++
        ) {

            setStatus(
                "🤖 النموذج: " +
                model +
                "\nالمحاولة " +
                attempt +
                " من 3" +
                "\nالنموذج " +
                (modelIndex + 1) +
                " من " +
                models.length,
                "loading"
            );


            try {

                const url =
                    "https://generativelanguage.googleapis.com/v1beta/models/" +
                    encodeURIComponent(
                        model
                    ) +
                    ":generateContent";


                const response =
                    await fetch(
                        url,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "x-goog-api-key":
                                    apiKey

                            },

                            body:
                                JSON.stringify({

                                    contents: [

                                        {

                                            role:
                                                "user",

                                            parts: [

                                                {

                                                    text:
                                                        prompt

                                                },

                                                {

                                                    inline_data: {

                                                        mime_type:
                                                            "image/jpeg",

                                                        data:
                                                            base64

                                                    }

                                                }

                                            ]

                                        }

                                    ]

                                })

                        }
                    );


                let data = {};


                try {

                    data =
                        await response.json();

                }

                catch {

                }


                /*
                 نجح الاتصال
                */

                if (response.ok) {

                    const text =
                        extractGeminiText(
                            data
                        );


                    if (text) {

                        return {

                            model,
                            text

                        };

                    }


                    lastError =
                        "النموذج أعاد استجابة فارغة.";


                    break;

                }


                const message =
                    data?.error?.message ||
                    (
                        "HTTP " +
                        response.status
                    );


                lastError =
                    message;


                console.warn(
                    "Gemini error:",
                    model,
                    response.status,
                    message
                );


                /*
                 خطأ في المفتاح
                */

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    throw new Error(
                        "مشكلة في Gemini API Key:\n" +
                        message
                    );

                }


                /*
                 النموذج غير موجود
                 أو الطلب غير مدعوم
                 -> النموذج التالي
                */

                if (
                    response.status === 400 ||
                    response.status === 404
                ) {

                    break;

                }


                /*
                 ازدحام / ضغط / Rate Limit
                */

                if (
                    response.status === 429 ||
                    response.status === 500 ||
                    response.status === 502 ||
                    response.status === 503 ||
                    response.status === 504
                ) {

                    if (
                        attempt < 3
                    ) {

                        const delay =
                            attempt === 1
                                ? 2500
                                : 6000;


                        setStatus(
                            "⏳ النموذج مزدحم أو الخدمة مشغولة.\nإعادة المحاولة بعد " +
                            Math.round(
                                delay / 1000
                            ) +
                            " ثوانٍ...",
                            "loading"
                        );


                        await sleep(
                            delay
                        );


                        continue;

                    }


                    /*
                     بعد المحاولة الثالثة
                     ننتقل للنموذج التالي
                    */

                    break;

                }


                break;

            }

            catch (error) {

                console.error(
                    error
                );


                if (
                    String(
                        error?.message || ""
                    ).includes(
                        "Gemini API Key"
                    )
                ) {

                    throw error;

                }


                lastError =
                    error?.message ||
                    String(error);


                if (
                    attempt < 3
                ) {

                    const delay =
                        2000 *
                        attempt;


                    await sleep(
                        delay
                    );


                    continue;

                }

            }

        }

    }


    throw new Error(
        "تعذر استخدام نماذج Gemini المتاحة حالياً.\n\nآخر رسالة:\n" +
        lastError
    );

}


/* =========================================
   استخراج النص من رد Gemini
========================================= */

function extractGeminiText(data) {

    const candidates =
        data?.candidates;


    if (
        !Array.isArray(
            candidates
        ) ||
        !candidates.length
    ) {

        return "";

    }


    const parts =
        candidates[0]
            ?.content
            ?.parts;


    if (
        !Array.isArray(
            parts
        )
    ) {

        return "";

    }


    return parts
        .map(
            part =>
                part?.text ||
                ""
        )
        .join("")
        .trim();

}


/* =========================================
   Prompt
========================================= */

function createPrompt() {

    const source =
        sourceLanguage.value;


    const target =
        targetLanguage.value;


    return `

You are a professional manga and comic OCR, layout detection, and translation system.

Analyze the ENTIRE manga/comic image carefully.

SOURCE LANGUAGE:
${source}

TARGET LANGUAGE:
${target}

TASK:

1. Detect every meaningful text region in the image:
- speech bubbles
- dialogue
- narration boxes
- captions
- important sound effects

2. Read the original text accurately.

3. Translate every detected region naturally into ${target}.

4. Detect the bounding box of the COMPLETE text region.

VERY IMPORTANT:

- Treat one complete speech bubble as one text block whenever possible.
- Do NOT create one block for every Japanese character.
- Do NOT split vertical Japanese text character-by-character.
- Keep text from the same bubble together.
- Do NOT invent unreadable text.
- Ignore page numbers and meaningless marks.
- Preserve character names correctly.
- The translation must sound natural, not word-for-word.

BOUNDING BOX:

Coordinates must be normalized from 0 to 1000.

Use exactly:

[ymin, xmin, ymax, xmax]

Example:

[
  {
    "box_2d": [100, 620, 300, 900],
    "original": "てめーの仕事だ！",
    "translation": "إنها مهمتك!",
    "type": "dialogue"
  }
]

Allowed type values:

dialogue
narration
caption
sfx

Return ONLY valid JSON.

Do not use Markdown.
Do not use code fences.
Do not explain anything.

If no readable text exists, return:

[]

`;

}


/* =========================================
   تحليل JSON
========================================= */

function parseResponse(text) {

    let cleaned =
        String(text || "")
            .trim()
            .replace(
                /```json/gi,
                ""
            )
            .replace(
                /```/g,
                ""
            )
            .trim();


    let parsed;


    try {

        parsed =
            JSON.parse(
                cleaned
            );

    }

    catch {

        const start =
            cleaned.indexOf(
                "["
            );


        const end =
            cleaned.lastIndexOf(
                "]"
            );


        if (
            start === -1 ||
            end === -1 ||
            end <= start
        ) {

            throw new Error(
                "Gemini قرأ الصورة لكن لم يرجع JSON صالحاً."
            );

        }


        const jsonPart =
            cleaned.slice(
                start,
                end + 1
            );


        try {

            parsed =
                JSON.parse(
                    jsonPart
                );

        }

        catch {

            throw new Error(
                "تعذر قراءة نتيجة Gemini."
            );

        }

    }


    if (
        !Array.isArray(
            parsed
        )
    ) {

        if (
            Array.isArray(
                parsed?.blocks
            )
        ) {

            parsed =
                parsed.blocks;

        }

        else {

            throw new Error(
                "صيغة النتيجة غير صحيحة."
            );

        }

    }


    return parsed
        .map(
            normalizeBlock
        )
        .filter(
            Boolean
        );

}


/* =========================================
   تنظيف المربعات
========================================= */

function normalizeBlock(block) {

    if (!block) {

        return null;

    }


    let box =
        block.box_2d ||
        block.box ||
        block.bbox;


    if (
        !Array.isArray(
            box
        ) ||
        box.length < 4
    ) {

        return null;

    }


    let [
        ymin,
        xmin,
        ymax,
        xmax
    ] =
        box.map(
            Number
        );


    /*
     بعض النماذج قد ترجع 0-1
    */

    const largest =
        Math.max(
            Math.abs(ymin),
            Math.abs(xmin),
            Math.abs(ymax),
            Math.abs(xmax)
        );


    if (
        largest <= 1.5
    ) {

        ymin *=
            1000;

        xmin *=
            1000;

        ymax *=
            1000;

        xmax *=
            1000;

    }


    ymin =
        clamp1000(
            ymin
        );


    xmin =
        clamp1000(
            xmin
        );


    ymax =
        clamp1000(
            ymax
        );


    xmax =
        clamp1000(
            xmax
        );


    if (
        ymax <= ymin ||
        xmax <= xmin
    ) {

        return null;

    }


    const original =
        String(
            block.original ||
            block.text ||
            ""
        ).trim();


    const translation =
        String(
            block.translation ||
            block.translated ||
            ""
        ).trim();


    if (
        !original &&
        !translation
    ) {

        return null;

    }


    return {

        box_2d: [

            ymin,
            xmin,
            ymax,
            xmax

        ],

        original,

        translation:
            translation ||
            original,

        type:
            block.type ||
            "dialogue"

    };

}


function clamp1000(value) {

    return Math.max(
        0,
        Math.min(
            1000,
            Number(value)
        )
    );

}


/* =========================================
   رسم النتيجة
========================================= */

function drawTranslation(blocks) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.drawImage(
        preparedImage,
        0,
        0
    );


    for (
        const block of blocks
    ) {

        const [

            ymin,
            xmin,
            ymax,
            xmax

        ] =
            block.box_2d;


        const x =
            xmin /
            1000 *
            canvas.width;


        const y =
            ymin /
            1000 *
            canvas.height;


        const width =
            (
                xmax -
                xmin
            ) /
            1000 *
            canvas.width;


        const height =
            (
                ymax -
                ymin
            ) /
            1000 *
            canvas.height;


        drawTranslationBox(
            block.translation,
            x,
            y,
            width,
            height
        );

    }

}


/* =========================================
   رسم صندوق الترجمة
========================================= */

function drawTranslationBox(
    text,
    x,
    y,
    width,
    height
) {

    if (
        width <= 2 ||
        height <= 2
    ) {

        return;

    }


    const padding =
        Math.max(
            4,
            Math.min(
                width,
                height
            ) *
            0.06
        );


    /*
     إخفاء النص الياباني
    */

    ctx.save();


    ctx.fillStyle =
        "rgba(255,255,255,0.96)";


    drawRoundedRectangle(
        x,
        y,
        width,
        height,
        Math.min(
            18,
            width * 0.12,
            height * 0.12
        )
    );


    ctx.fill();


    ctx.restore();


    const maxWidth =
        Math.max(
            10,
            width -
            padding * 2
        );


    const maxHeight =
        Math.max(
            10,
            height -
            padding * 2
        );


    let fontSize =
        Math.min(
            52,
            height * 0.33,
            width * 0.17
        );


    fontSize =
        Math.max(
            10,
            fontSize
        );


    let lines =
        [];


    while (
        fontSize >= 9
    ) {

        ctx.font =
            "bold " +
            fontSize +
            "px Arial, Tahoma, sans-serif";


        lines =
            wrapText(
                text,
                maxWidth
            );


        const lineHeight =
            fontSize *
            1.22;


        if (
            lines.length *
            lineHeight <=
            maxHeight
        ) {

            break;

        }


        fontSize -=
            1;

    }


    if (
        !lines.length
    ) {

        return;

    }


    const lineHeight =
        fontSize *
        1.22;


    ctx.save();


    ctx.font =
        "bold " +
        fontSize +
        "px Arial, Tahoma, sans-serif";


    ctx.fillStyle =
        "#111111";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    if (
        targetLanguage.value ===
        "Arabic"
    ) {

        ctx.direction =
            "rtl";

    }

    else {

        ctx.direction =
            "ltr";

    }


    const totalHeight =
        lines.length *
        lineHeight;


    let currentY =
        y +
        height / 2 -
        totalHeight / 2 +
        lineHeight / 2;


    for (
        const line of lines
    ) {

        ctx.fillText(
            line,
            x + width / 2,
            currentY,
            maxWidth
        );


        currentY +=
            lineHeight;

    }


    ctx.restore();

}


/* =========================================
   تقسيم النص إلى أسطر
========================================= */

function wrapText(
    text,
    maxWidth
) {

    const cleanText =
        String(text || "")
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    if (!cleanText) {

        return [];

    }


    const words =
        cleanText.split(
            " "
        );


    const lines =
        [];


    let currentLine =
        "";


    for (
        const word of words
    ) {

        const testLine =
            currentLine
                ? currentLine +
                  " " +
                  word
                : word;


        if (
            ctx.measureText(
                testLine
            ).width <=
            maxWidth
        ) {

            currentLine =
                testLine;


            continue;

        }


        if (
            currentLine
        ) {

            lines.push(
                currentLine
            );


            currentLine =
                "";

        }


        /*
         إذا كانت الكلمة نفسها طويلة جداً
        */

        if (
            ctx.measureText(
                word
            ).width >
            maxWidth
        ) {

            let piece =
                "";


            for (
                const character of word
            ) {

                const testPiece =
                    piece +
                    character;


                if (
                    ctx.measureText(
                        testPiece
                    ).width >
                    maxWidth
                ) {

                    if (
                        piece
                    ) {

                        lines.push(
                            piece
                        );

                    }


                    piece =
                        character;

                }

                else {

                    piece =
                        testPiece;

                }

            }


            currentLine =
                piece;

        }

        else {

            currentLine =
                word;

        }

    }


    if (
        currentLine
    ) {

        lines.push(
            currentLine
        );

    }


    return lines;

}


/* =========================================
   مستطيل بحواف مستديرة
========================================= */

function drawRoundedRectangle(
    x,
    y,
    width,
    height,
    radius
) {

    radius =
        Math.max(
            0,
            Math.min(
                radius,
                width / 2,
                height / 2
            )
        );


    ctx.beginPath();


    ctx.moveTo(
        x + radius,
        y
    );


    ctx.lineTo(
        x + width - radius,
        y
    );


    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );


    ctx.lineTo(
        x + width,
        y + height - radius
    );


    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );


    ctx.lineTo(
        x + radius,
        y + height
    );


    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );


    ctx.lineTo(
        x,
        y + radius
    );


    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );


    ctx.closePath();

}


/* =========================================
   عرض النصوص أسفل الصورة
========================================= */

function showResults(blocks) {

    textResults.innerHTML =
        "";


    blocks.forEach(
        (block, index) => {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "result";


            const original =
                document.createElement(
                    "div"
                );


            original.className =
                "original";


            original.textContent =
                (
                    index +
                    1
                ) +
                ". الأصل: " +
                block.original;


            const translated =
                document.createElement(
                    "div"
                );


            translated.className =
                "translation";


            translated.textContent =
                block.translation;


            wrapper.appendChild(
                original
            );


            wrapper.appendChild(
                translated
            );


            textResults.appendChild(
                wrapper
            );

        }
    );


    results.style.display =
        "block";

}


/* =========================================
   تنزيل الصورة
========================================= */

downloadButton.addEventListener(
    "click",
    () => {

        canvas.toBlob(
            blob => {

                if (!blob) {

                    setStatus(
                        "❌ تعذر إنشاء الصورة.",
                        "error"
                    );


                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    "manga-translated.png";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    () =>
                        URL.revokeObjectURL(
                            url
                        ),
                    1000
                );

            },
            "image/png"
        );

    }
);

        );

);
