<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MangaTranslate AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d0d14;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    width: 94%;
    max-width: 850px;
    margin: auto;
    padding: 25px 0 50px;
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
}

.logo span {
    color: #8b5cf6;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
}

.card {
    background: #15151d;
    border: 1px solid #30303d;
    border-radius: 20px;
    padding: 18px;
}

.upload {
    display: block;
    text-align: center;
    padding: 40px 15px;
    border: 2px dashed #444;
    border-radius: 18px;
    cursor: pointer;
}

.upload:hover {
    border-color: #8b5cf6;
}

.upload-icon {
    font-size: 50px;
}

.upload h2 {
    margin: 10px 0;
}

.upload p {
    color: #888;
}

input[type="file"] {
    display: none;
}

.upload-button {
    display: inline-block;
    background: #7955e8;
    padding: 14px 24px;
    border-radius: 12px;
    margin-top: 10px;
    font-weight: bold;
}

.preview {
    margin-top: 25px;
}

.image-box {
    width: 100%;
    background: #000;
    border-radius: 15px;
    overflow: hidden;
}

#previewImage {
    display: block;
    width: 100%;
    height: auto;
}

.settings {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.setting {
    background: #101017;
    padding: 14px;
    border-radius: 13px;
}

.setting label {
    display: block;
    color: #aaa;
    margin-bottom: 8px;
}

select {
    width: 100%;
    padding: 14px;
    background: #191921;
    border: 1px solid #393944;
    border-radius: 11px;
    color: #fff;
    font-size: 16px;
}

.main-button {
    width: 100%;
    border: 0;
    margin-top: 18px;
    padding: 15px;
    border-radius: 13px;
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #7955e8;
}

.main-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.translate-button {
    background: #169967;
}

.progress {
    display: none;
    margin-top: 20px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 8px;
}

.progress-bar {
    height: 8px;
    background: #292934;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #8b5cf6;
    transition: width .3s;
}

.status {
    margin-top: 15px;
    padding: 14px;
    border-radius: 11px;
    background: #101017;
    color: #aaa;
    line-height: 1.8;
    word-break: break-word;
}

.result {
    display: none;
    margin-top: 25px;
}

textarea {
    width: 100%;
    min-height: 200px;
    padding: 15px;
    background: #0b0b11;
    color: #fff;
    border: 1px solid #393944;
    border-radius: 14px;
    font-size: 17px;
    line-height: 1.9;
    resize: vertical;
    direction: auto;
}

.translation-box {
    margin-top: 22px;
}

.translation-box textarea {
    border-color: #169967;
}

.info {
    margin-top: 15px;
    padding: 13px;
    background: #101017;
    border-radius: 11px;
    color: #777;
    font-size: 13px;
    line-height: 1.8;
}

.hidden {
    display: none !important;
}

@media(max-width:600px) {

    .settings {
        grid-template-columns: 1fr;
    }

    .logo {
        font-size: 26px;
    }

}

</style>

</head>


<body>

<div class="container">

    <div class="logo">
        MangaTranslate <span>AI</span>
    </div>

    <div class="subtitle">
        ترجمة المانغا والكوميكس بالذكاء الاصطناعي
    </div>


    <div class="card">


        <!-- اختيار الصورة -->

        <label
            class="upload"
            for="imageInput"
        >

            <div class="upload-icon">
                📖
            </div>

            <h2>
                اختر صورة مانغا أو كوميكس
            </h2>

            <p>
                JPG / PNG / WEBP
            </p>

            <div class="upload-button">
                📤 اختيار الصورة
            </div>

        </label>


        <input
            id="imageInput"
            type="file"
            accept="image/*"
        >


        <!-- معاينة الصورة -->

        <div
            id="preview"
            class="preview hidden"
        >

            <h3>
                🖼️ الصورة
            </h3>

            <div class="image-box">

                <img
                    id="previewImage"
                    alt="Manga"
                >

            </div>

        </div>


        <!-- اختيار اللغات -->

        <div
            id="settings"
            class="settings hidden"
        >

            <div class="setting">

                <label>
                    لغة النص الأصلي
                </label>

                <select id="sourceLanguage">

                    <option value="ja">
                        🇯🇵 اليابانية
                    </option>

                    <option value="en">
                        🇬🇧 الإنجليزية
                    </option>

                    <option value="id">
                        🇮🇩 الإندونيسية
                    </option>

                </select>

            </div>


            <div class="setting">

                <label>
                    الترجمة إلى
                </label>

                <select id="targetLanguage">

                    <option value="ar">
                        🇸🇦 العربية
                    </option>

                    <option value="en">
                        🇬🇧 الإنجليزية
                    </option>

                    <option value="fr">
                        🇫🇷 الفرنسية
                    </option>

                </select>

            </div>

        </div>


        <!-- زر تحليل الصورة -->

        <button
            id="analyzeButton"
            class="main-button hidden"
        >
            🔍 قراءة النص من الصورة
        </button>


        <!-- التقدم -->

        <div
            id="progress"
            class="progress"
        >

            <div class="progress-top">

                <span id="progressStatus">
                    جاري التحضير...
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

        </div>


        <!-- الحالة -->

        <div
            id="status"
            class="status hidden"
        ></div>


        <!-- النص -->

        <div
            id="result"
            class="result"
        >

            <h2>
                📝 النص المكتشف
            </h2>

            <textarea
                id="originalText"
                placeholder="سيظهر النص الموجود في فقاعات الكلام هنا..."
            ></textarea>


            <button
                id="translateButton"
                class="main-button translate-button"
            >
                🌐 ترجمة النص
            </button>


            <div
                id="translationBox"
                class="translation-box hidden"
            >

                <h2>
                    ✨ الترجمة
                </h2>

                <textarea
                    id="translatedText"
                    placeholder="ستظهر الترجمة هنا..."
                ></textarea>

            </div>


            <div class="info">

                💡 هذه النسخة لا تستخدم Tesseract.
                يتم إرسال الصورة مباشرة إلى نموذج ذكاء اصطناعي قادر على فهم الصور وقراءة النص داخل فقاعات المانغا.

            </div>

        </div>


    </div>

</div>


<!-- Puter AI -->

<script src="https://js.puter.com/v2/"></script>


<script>


/* =========================================
   العناصر
========================================= */

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const settings =
    document.getElementById("settings");

const analyzeButton =
    document.getElementById("analyzeButton");

const translateButton =
    document.getElementById("translateButton");

const sourceLanguage =
    document.getElementById("sourceLanguage");

const targetLanguage =
    document.getElementById("targetLanguage");

const progress =
    document.getElementById("progress");

const progressStatus =
    document.getElementById("progressStatus");

const progressPercent =
    document.getElementById("progressPercent");

const progressFill =
    document.getElementById("progressFill");

const status =
    document.getElementById("status");

const result =
    document.getElementById("result");

const originalText =
    document.getElementById("originalText");

const translationBox =
    document.getElementById("translationBox");

const translatedText =
    document.getElementById("translatedText");


let selectedImage = null;


/* =========================================
   اختيار الصورة
========================================= */

imageInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];

        if (!file) {
            return;
        }


        if (
            !file.type.startsWith("image/")
        ) {

            alert(
                "الرجاء اختيار صورة فقط."
            );

            return;
        }


        selectedImage = file;


        previewImage.src =
            URL.createObjectURL(file);


        preview.classList.remove(
            "hidden"
        );


        settings.classList.remove(
            "hidden"
        );


        analyzeButton.classList.remove(
            "hidden"
        );


        result.style.display =
            "none";


        translationBox.classList.add(
            "hidden"
        );


        originalText.value =
            "";

        translatedText.value =
            "";


        status.classList.add(
            "hidden"
        );

    }
);


/* =========================================
   تحديث التقدم
========================================= */

function setProgress(
    percent,
    text
) {

    progressFill.style.width =
        percent + "%";

    progressPercent.textContent =
        percent + "%";

    progressStatus.textContent =
        text;

}


/* =========================================
   اسم اللغة
========================================= */

function languageName(code) {

    if (code === "ja") {
        return "اليابانية";
    }

    if (code === "en") {
        return "الإنجليزية";
    }

    if (code === "id") {
        return "الإندونيسية";
    }

    if (code === "ar") {
        return "العربية";
    }

    if (code === "fr") {
        return "الفرنسية";
    }

    return code;
}


/* =========================================
   استخراج النص من الصورة باستخدام Vision AI
========================================= */

analyzeButton.addEventListener(
    "click",
    async function() {


        if (!selectedImage) {

            alert(
                "اختر صورة أولًا."
            );

            return;
        }


        analyzeButton.disabled =
            true;


        progress.style.display =
            "block";


        status.classList.remove(
            "hidden"
        );


        result.style.display =
            "none";


        setProgress(
            5,
            "جاري تجهيز الصورة..."
        );


        try {


            const source =
                languageName(
                    sourceLanguage.value
                );


            setProgress(
                15,
                "جاري إرسال الصورة إلى الذكاء الاصطناعي..."
            );


            /*
             * نرسل File نفسه إلى Puter.
             *
             * لا نستخدم Tesseract.
             * لا نستخدم Worker.
             * لا نحتاج API Key.
             */

            const prompt = `

أنت متخصص في قراءة وترجمة صفحات المانغا والكوميكس.

انظر إلى الصورة المرفقة بعناية شديدة.

المطلوب هو استخراج النص الموجود داخل:
- فقاعات الكلام
- فقاعات التفكير
- مربعات الحوار
- النصوص المكتوبة داخل المشاهد إذا كانت جزءًا من الحوار

لغة النص الأصلية هي: ${source}

مهم جدًا:

1. اقرأ الكلام داخل كل فقاعة بشكل مستقل.
2. لا تجمع الحروف الموجودة في فقاعات مختلفة.
3. لا تقرأ الصفحة ككتلة نص واحدة.
4. حافظ على الكلمات كما تظهر في الصورة.
5. صحح أخطاء القراءة الواضحة الناتجة عن جودة الصورة.
6. لا تكتب وصفًا للصورة.
7. لا تكتب أسماء الأشياء التي لا تحتوي على نص.
8. لا تخمن نصًا غير موجود.
9. إذا كانت هناك عدة فقاعات، افصل بينها بأسطر.
10. حافظ على ترتيب القراءة الطبيعي.
11. إذا كان النص قصيرًا جدًا فلا تضف أي كلام من عندك.

أريد الناتج بهذا الشكل فقط:

[النص الموجود في الفقاعة الأولى]

[النص الموجود في الفقاعة الثانية]

[النص الموجود في الفقاعة الثالثة]

ولا تكتب:
- شرحًا
- تحليلًا
- مقدمة
- خاتمة
- كلمة "OCR"
- كلمة "لا أستطيع"

اقرأ الصورة مباشرة.

`;


            /*
             * النموذج الحالي.
             *
             * لا نضع temperature
             * حتى لا نعود إلى خطأ 400
             * الذي ظهر عندك سابقًا.
             */

            const response =
                await puter.ai.chat(
                    prompt,
                    selectedImage,
                    false,
                    {
                        model:
                            "gpt-5.6-luna"
                    }
                );


            setProgress(
                85,
                "جاري ترتيب النص..."
            );


            let text = "";


            /*
             * محاولة استخراج النص
             * من مختلف أشكال استجابة Puter.
             */

            if (
                typeof response ===
                "string"
            ) {

                text =
                    response;

            }

            else if (
                response &&
                response.message &&
                typeof response.message.content ===
                "string"
            ) {

                text =
                    response.message.content;

            }

            else if (
                response &&
                response.message &&
                Array.isArray(
                    response.message.content
                )
            ) {

                text =
                    response.message.content
                    .map(
                        item =>
                            item?.text ||
                            ""
                    )
                    .join("");

            }

            else if (
                response &&
                typeof response.content ===
                "string"
            ) {

                text =
                    response.content;

            }


            text =
                text
                .replace(/\r/g, "")
                .trim();


            /*
             * إزالة Markdown إذا ظهر
             */

            text =
                text
                .replace(/^```[a-zA-Z]*\n?/g, "")
                .replace(/\n?```$/g, "")
                .trim();


            if (!text) {

                throw new Error(
                    "لم يتم العثور على نص في الصورة."
                );

            }


            originalText.value =
                text;


            result.style.display =
                "block";


            setProgress(
                100,
                "اكتمل استخراج النص."
            );


            status.textContent =
                "✅ تم استخراج النص بنجاح بواسطة تحليل الصورة مباشرة.";


        }

        catch(error) {

            console.error(
                "IMAGE AI ERROR:",
                error
            );


            setProgress(
                100,
                "حدث خطأ."
            );


            status.textContent =
                "❌ حدث خطأ أثناء قراءة الصورة: " +
                (
                    error?.message ||
                    String(error)
                );

        }


        finally {

            analyzeButton.disabled =
                false;

        }

    }
);


/* =========================================
   ترجمة النص
========================================= */

translateButton.addEventListener(
    "click",
    async function() {


        const text =
            originalText.value.trim();


        if (!text) {

            alert(
                "استخرج النص أولًا."
            );

            return;
        }


        translateButton.disabled =
            true;


        translationBox.classList.remove(
            "hidden"
        );


        translatedText.value =
            "جاري الترجمة...";


        status.classList.remove(
            "hidden"
        );


        const source =
            languageName(
                sourceLanguage.value
            );


        const target =
            languageName(
                targetLanguage.value
            );


        try {


            const prompt = `

أنت مترجم محترف متخصص في المانغا والكوميكس.

ترجم النص التالي من ${source} إلى ${target}.

القواعد:

- أخرج الترجمة فقط.
- لا تشرح.
- لا تضف مقدمة.
- لا تضف خاتمة.
- لا تذكر أخطاء OCR.
- حافظ على ترتيب الفقرات.
- حافظ على أسماء الشخصيات.
- حافظ على معنى الحوار.
- اجعل اللغة طبيعية ومناسبة للمانغا.
- حافظ على المشاعر والانفعالات.
- لا تحذف أي جملة.
- لا تضف أحداثًا غير موجودة.
- إذا كانت هناك علامات استفهام أو تعجب، حافظ عليها.
- إذا كان النص غير واضح قليلًا، استخدم السياق لتصحيح الخطأ بأفضل شكل ممكن.

النص:

${text}

`;


            status.textContent =
                "🌐 جاري ترجمة الحوار...";


            /*
             * لا temperature هنا.
             */

            const response =
                await puter.ai.chat(
                    prompt,
                    {
                        model:
                            "gpt-5.6-luna"
                    }
                );


            let translated =
                "";


            if (
                typeof response ===
                "string"
            ) {

                translated =
                    response;

            }

            else if (
                response &&
                response.message &&
                typeof response.message.content ===
                "string"
            ) {

                translated =
                    response.message.content;

            }

            else if (
                response &&
                response.message &&
                Array.isArray(
                    response.message.content
                )
            ) {

                translated =
                    response.message.content
                    .map(
                        item =>
                            item?.text ||
                            ""
                    )
                    .join("");

            }

            else if (
                response &&
                typeof response.content ===
                "string"
            ) {

                translated =
                    response.content;

            }


            translated =
                translated.trim();


            if (!translated) {

                throw new Error(
                    "لم يرجع الذكاء الاصطناعي ترجمة."
                );

            }


            translatedText.value =
                translated;


            status.textContent =
                "✅ تمت الترجمة بنجاح.";


        }

        catch(error) {

            console.error(
                "TRANSLATION ERROR:",
                error
            );


            translatedText.value =
                "";


            status.textContent =
                "❌ حدث خطأ في الترجمة: " +
                (
                    error?.message ||
                    String(error)
                );

        }


        finally {

            translateButton.disabled =
                false;

        }

    }
);

</script>


</body>

</html>
