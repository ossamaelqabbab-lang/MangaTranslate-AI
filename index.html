<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MangaTranslate AI V3</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d1017;
    color: white;
    font-family: Arial, Tahoma, sans-serif;
}

.app {
    max-width: 850px;
    margin: auto;
    padding: 18px;
}

header {
    text-align: center;
    padding: 18px 0;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    color: #9ca3af;
    margin-top: 8px;
}

.version {
    display: inline-block;
    padding: 5px 11px;
    margin-top: 4px;
    border-radius: 20px;
    background: #252c3c;
    color: #b4bdce;
    font-size: 12px;
}

.card {
    background: #171c27;
    border: 1px solid #2b3345;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
}

label {
    display: block;
    margin: 10px 0 7px;
    font-weight: bold;
}

input,
select,
button {
    width: 100%;
    min-height: 48px;
    border-radius: 10px;
    font-size: 16px;
}

input,
select {
    padding: 10px;
    color: white;
    background: #222938;
    border: 1px solid #3a455e;
}

#apiKey {
    direction: ltr;
}

.upload {
    display: block;
    margin-top: 16px;
    padding: 25px 12px;
    text-align: center;
    cursor: pointer;
    border-radius: 14px;
    background: #202735;
    border: 2px dashed #4a5875;
}

.upload small {
    color: #aab1c0;
}

#imageInput {
    display: none;
}

.languages {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    border: none;
    padding: 12px;
    margin-top: 12px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#translateButton {
    background: #6757e8;
}

#downloadButton {
    display: none;
    background: #07885f;
}

#restoreButton {
    display: none;
    background: #3b465e;
}

#newButton {
    background: #30394e;
}

#status {
    padding: 16px 5px 5px;
    text-align: center;
    white-space: pre-line;
    line-height: 1.7;
    word-break: break-word;
}

.success {
    color: #4ade80;
}

.error {
    color: #ff6b6b;
}

.loading {
    color: #ffd166;
}

#canvasCard {
    display: none;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: white;
    border-radius: 10px;
}

#results {
    display: none;
}

.result {
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    background: #232a39;
}

.original {
    color: #a7adbb;
    font-size: 14px;
    margin-bottom: 7px;
    direction: auto;
}

.translation {
    font-size: 17px;
    font-weight: bold;
    direction: auto;
}

.note {
    color: #9ca3af;
    font-size: 13px;
    line-height: 1.7;
}

.model-info {
    margin-top: 8px;
    text-align: center;
    color: #9ca3af;
    font-size: 13px;
}

@media (max-width: 600px) {

    .languages {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 24px;
    }

}

</style>

</head>


<body>

<div class="app">

<header>

<h1>📖 MangaTranslate AI</h1>

<p>
ترجمة المانغا والقصص المصورة داخل الصورة
</p>

<div class="version">
V3 — Bubble Shape Engine
</div>

</header>


<div class="card">

<label>
🔑 Gemini API Key
</label>

<input
    id="apiKey"
    type="password"
    autocomplete="off"
    placeholder="ألصق مفتاح Gemini هنا"
/>

<p class="note">
المفتاح لا يتم حفظه في كود GitHub.
تضعه فقط عند تشغيل الموقع.
</p>


<label
    class="upload"
    for="imageInput"
>

📷 اضغط هنا واختر صورة المانغا

<br>

<small>
JPG / PNG / WEBP
</small>

</label>


<input
    id="imageInput"
    type="file"
    accept="image/*"
/>


<div class="languages">

<div>

<label>
لغة النص الأصلية
</label>

<select id="sourceLanguage">

<option value="Automatic">
اكتشاف تلقائي
</option>

<option value="Japanese">
اليابانية
</option>

<option value="English">
الإنجليزية
</option>

<option value="Korean">
الكورية
</option>

<option value="Chinese">
الصينية
</option>

<option value="French">
الفرنسية
</option>

<option value="Spanish">
الإسبانية
</option>

<option value="Indonesian">
الإندونيسية
</option>

</select>

</div>


<div>

<label>
الترجمة إلى
</label>

<select id="targetLanguage">

<option value="Arabic">
العربية
</option>

<option value="English">
الإنجليزية
</option>

<option value="French">
الفرنسية
</option>

<option value="Spanish">
الإسبانية
</option>

<option value="Japanese">
اليابانية
</option>

</select>

</div>

</div>


<button
    id="translateButton"
    disabled
>
✨ ترجمة الصورة
</button>


<button id="downloadButton">
⬇ حفظ الصورة المترجمة
</button>


<button id="restoreButton">
↩ عرض الصورة الأصلية
</button>


<button id="newButton">
🗑 صورة جديدة
</button>


<div id="status">
اختر صورة للبدء
</div>


<div
    id="modelInfo"
    class="model-info"
></div>

</div>


<div
    id="canvasCard"
    class="card"
>

<canvas id="canvas"></canvas>

</div>


<div
    id="results"
    class="card"
>

<h3>
📝 النصوص المكتشفة
</h3>

<div id="textResults"></div>

</div>

</div>


<script>

/* =====================================================
   عناصر الصفحة
===================================================== */

const apiKeyInput =
    document.getElementById("apiKey");

const imageInput =
    document.getElementById("imageInput");

const sourceLanguage =
    document.getElementById("sourceLanguage");

const targetLanguage =
    document.getElementById("targetLanguage");

const translateButton =
    document.getElementById("translateButton");

const downloadButton =
    document.getElementById("downloadButton");

const restoreButton =
    document.getElementById("restoreButton");

const newButton =
    document.getElementById("newButton");

const statusBox =
    document.getElementById("status");

const modelInfo =
    document.getElementById("modelInfo");

const canvasCard =
    document.getElementById("canvasCard");

const results =
    document.getElementById("results");

const textResults =
    document.getElementById("textResults");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/*
   Canvas مخفي يحتوي دائماً
   على الصورة الأصلية.
*/

const sourceCanvas =
    document.createElement("canvas");

const sourceCtx =
    sourceCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


let preparedImage = null;
let preparedBase64 = null;

let lastBlocks = [];

let translatedVisible =
    false;


/* =====================================================
   الحالة
===================================================== */

function setStatus(
    text,
    type = ""
) {

    statusBox.textContent =
        text;

    statusBox.className =
        type;

}


/* =====================================================
   اختيار الصورة
===================================================== */

imageInput.addEventListener(
    "change",
    async () => {

        const file =
            imageInput.files[0];


        if (!file) {
            return;
        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            setStatus(
                "❌ الملف المختار ليس صورة.",
                "error"
            );

            return;

        }


        try {

            setStatus(
                "⏳ جاري تجهيز الصورة...",
                "loading"
            );


            const prepared =
                await prepareImage(
                    file
                );


            preparedImage =
                prepared.image;


            preparedBase64 =
                prepared.base64;


            canvas.width =
                preparedImage.width;


            canvas.height =
                preparedImage.height;


            sourceCanvas.width =
                preparedImage.width;


            sourceCanvas.height =
                preparedImage.height;


            sourceCtx.clearRect(
                0,
                0,
                sourceCanvas.width,
                sourceCanvas.height
            );


            sourceCtx.drawImage(
                preparedImage,
                0,
                0
            );


            drawOriginalImage();


            canvasCard.style.display =
                "block";


            results.style.display =
                "none";


            downloadButton.style.display =
                "none";


            restoreButton.style.display =
                "none";


            translateButton.disabled =
                false;


            lastBlocks =
                [];


            translatedVisible =
                false;


            modelInfo.textContent =
                "";


            setStatus(
                "✅ الصورة جاهزة.\nاضغط ترجمة الصورة.",
                "success"
            );

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "❌ تعذر تجهيز الصورة.",
                "error"
            );

        }

    }
);


/* =====================================================
   تجهيز الصورة
===================================================== */

async function prepareImage(file) {

    const original =
        await fileToImage(
            file
        );


    let width =
        original.naturalWidth;


    let height =
        original.naturalHeight;


    /*
       نترك دقة جيدة لأن قراءة
       اليابانية تحتاج تفاصيل.
    */

    const maxDimension =
        2000;


    if (
        width > maxDimension ||
        height > maxDimension
    ) {

        const ratio =
            Math.min(

                maxDimension /
                width,

                maxDimension /
                height

            );


        width =
            Math.round(
                width *
                ratio
            );


        height =
            Math.round(
                height *
                ratio
            );

    }


    const temp =
        document.createElement(
            "canvas"
        );


    temp.width =
        width;


    temp.height =
        height;


    const tempCtx =
        temp.getContext(
            "2d"
        );


    tempCtx.fillStyle =
        "#ffffff";


    tempCtx.fillRect(
        0,
        0,
        width,
        height
    );


    tempCtx.drawImage(
        original,
        0,
        0,
        width,
        height
    );


    const dataURL =
        temp.toDataURL(
            "image/jpeg",
            0.94
        );


    const resized =
        new Image();


    await new Promise(
        (
            resolve,
            reject
        ) => {

            resized.onload =
                resolve;


            resized.onerror =
                reject;


            resized.src =
                dataURL;

        }
    );


    return {

        image:
            resized,

        base64:
            dataURL.split(
                ","
            )[1]

    };

}


/* =====================================================
   File -> Image
===================================================== */

function fileToImage(file) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const url =
                URL.createObjectURL(
                    file
                );


            const image =
                new Image();


            image.onload =
                () => {

                    URL.revokeObjectURL(
                        url
                    );


                    resolve(
                        image
                    );

                };


            image.onerror =
                () => {

                    URL.revokeObjectURL(
                        url
                    );


                    reject(
                        new Error(
                            "فشل فتح الصورة."
                        )
                    );

                };


            image.src =
                url;

        }
    );

}


/* =====================================================
   الصورة الأصلية
===================================================== */

function drawOriginalImage() {

    if (
        !preparedImage
    ) {

        return;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.drawImage(
        preparedImage,
        0,
        0
    );

}


/* =====================================================
   زر الترجمة
===================================================== */

translateButton.addEventListener(
    "click",
    async () => {

        const apiKey =
            apiKeyInput
                .value
                .trim();


        if (!apiKey) {

            setStatus(
                "❌ ضع Gemini API Key أولاً.",
                "error"
            );

            return;

        }


        if (
            !preparedBase64
        ) {

            setStatus(
                "❌ اختر صورة أولاً.",
                "error"
            );

            return;

        }


        translateButton.disabled =
            true;


        downloadButton.style.display =
            "none";


        restoreButton.style.display =
            "none";


        results.style.display =
            "none";


        modelInfo.textContent =
            "";


        try {

            setStatus(
                "🔎 جاري البحث عن نموذج Gemini مناسب...",
                "loading"
            );


            const models =
                await getAvailableModels(
                    apiKey
                );


            if (
                !models.length
            ) {

                throw new Error(
                    "لم يتم العثور على نموذج Gemini مناسب."
                );

            }


            const prompt =
                createPrompt();


            const result =
                await callGeminiWithFallback(

                    apiKey,

                    models,

                    prompt,

                    preparedBase64

                );


            modelInfo.textContent =
                "النموذج المستخدم: " +
                result.model;


            const blocks =
                parseResponse(
                    result.text
                );


            if (
                !blocks.length
            ) {

                throw new Error(
                    "لم يتم العثور على نص قابل للترجمة."
                );

            }


            lastBlocks =
                blocks;


            drawTranslation(
                blocks
            );


            showResults(
                blocks
            );


            translatedVisible =
                true;


            downloadButton.style.display =
                "block";


            restoreButton.style.display =
                "block";


            restoreButton.textContent =
                "↩ عرض الصورة الأصلية";


            setStatus(
                "✅ تمت الترجمة بنجاح.\nتم اكتشاف " +
                blocks.length +
                " منطقة نصية.",
                "success"
            );

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "❌ حدث خطأ:\n" +
                (
                    error?.message ||
                    String(error)
                ),
                "error"
            );

        }

        finally {

            translateButton.disabled =
                false;

        }

    }
);


/* =====================================================
   النماذج المتاحة
===================================================== */

async function getAvailableModels(
    apiKey
) {

    const url =
        "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100";


    try {

        const response =
            await fetch(
                url,
                {

                    headers: {

                        "x-goog-api-key":
                            apiKey

                    }

                }
            );


        const data =
            await response.json();


        if (
            response.status === 401 ||
            response.status === 403
        ) {

            throw new Error(
                "مفتاح Gemini غير صالح أو لا يملك صلاحية استخدام Gemini."
            );

        }


        if (
            !response.ok
        ) {

            return fallbackModels();

        }


        const models =
            Array.isArray(
                data.models
            )
                ? data.models
                : [];


        const usable =
            models
                .filter(
                    model => {

                        const name =
                            String(
                                model.name ||
                                ""
                            ).toLowerCase();


                        const methods =
                            model.supportedGenerationMethods ||
                            [];


                        if (
                            !name.includes(
                                "gemini"
                            )
                        ) {

                            return false;

                        }


                        if (
                            !methods.includes(
                                "generateContent"
                            )
                        ) {

                            return false;

                        }


                        const forbidden = [

                            "embedding",
                            "imagen",
                            "tts",
                            "audio",
                            "live",
                            "aqa",
                            "image-generation"

                        ];


                        return !forbidden.some(
                            item =>
                                name.includes(
                                    item
                                )
                        );

                    }
                )
                .map(
                    model =>

                        String(
                            model.name
                        ).replace(
                            /^models\//,
                            ""
                        )

                );


        usable.sort(
            (
                a,
                b
            ) =>

                scoreModel(b) -
                scoreModel(a)

        );


        return [

            ...new Set(
                usable
            )

        ].slice(
            0,
            8
        );

    }

    catch (error) {

        if (
            String(
                error?.message ||
                ""
            ).includes(
                "مفتاح Gemini"
            )
        ) {

            throw error;

        }


        return fallbackModels();

    }

}


/* =====================================================
   ترتيب النماذج
===================================================== */

function scoreModel(name) {

    const model =
        String(
            name
        ).toLowerCase();


    let score =
        0;


    if (
        model.includes(
            "flash-lite"
        )
    ) {

        score +=
            120;

    }

    else if (
        model.includes(
            "flash"
        )
    ) {

        score +=
            100;

    }

    else if (
        model.includes(
            "pro"
        )
    ) {

        score +=
            60;

    }


    if (
        model.includes(
            "latest"
        )
    ) {

        score +=
            20;

    }


    if (
        model.includes(
            "preview"
        )
    ) {

        score -=
            10;

    }


    if (
        model.includes(
            "exp"
        )
    ) {

        score -=
            20;

    }


    return score;

}


/* =====================================================
   نماذج احتياطية
===================================================== */

function fallbackModels() {

    return [

        "gemini-flash-lite-latest",

        "gemini-flash-latest",

        "gemini-2.5-flash-lite",

        "gemini-2.5-flash"

    ];

}


/* =====================================================
   إرسال الصورة إلى Gemini
===================================================== */

async function callGeminiWithFallback(
    apiKey,
    models,
    prompt,
    base64
) {

    const sleep =
        ms =>
            new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        ms
                    )
            );


    let lastError =
        "فشل الاتصال بـ Gemini.";


    for (
        let modelIndex = 0;
        modelIndex < models.length;
        modelIndex++
    ) {

        const model =
            models[
                modelIndex
            ];


        for (
            let attempt = 1;
            attempt <= 3;
            attempt++
        ) {

            setStatus(
                "🤖 النموذج: " +
                model +
                "\nالمحاولة " +
                attempt +
                " من 3",
                "loading"
            );


            try {

                const url =
                    "https://generativelanguage.googleapis.com/v1beta/models/" +
                    encodeURIComponent(
                        model
                    ) +
                    ":generateContent";


                const response =
                    await fetch(
                        url,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "x-goog-api-key":
                                    apiKey

                            },

                            body:
                                JSON.stringify({

                                    contents: [

                                        {

                                            role:
                                                "user",

                                            parts: [

                                                {

                                                    text:
                                                        prompt

                                                },

                                                {

                                                    inline_data: {

                                                        mime_type:
                                                            "image/jpeg",

                                                        data:
                                                            base64

                                                    }

                                                }

                                            ]

                                        }

                                    ]

                                })

                        }
                    );


                let data =
                    {};


                try {

                    data =
                        await response.json();

                }

                catch {}


                if (
                    response.ok
                ) {

                    const text =
                        extractGeminiText(
                            data
                        );


                    if (text) {

                        return {

                            model,
                            text

                        };

                    }


                    lastError =
                        "النموذج أعاد استجابة فارغة.";


                    break;

                }


                const message =
                    data?.error?.message ||
                    (
                        "HTTP " +
                        response.status
                    );


                lastError =
                    message;


                console.warn(
                    model,
                    response.status,
                    message
                );


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    throw new Error(
                        "مشكلة في Gemini API Key:\n" +
                        message
                    );

                }


                /*
                   إذا كان النموذج غير مناسب
                   ننتقل للذي بعده.
                */

                if (
                    response.status === 400 ||
                    response.status === 404
                ) {

                    break;

                }


                /*
                   ازدحام أو Rate Limit.
                */

                if (
                    response.status === 429 ||
                    response.status === 500 ||
                    response.status === 502 ||
                    response.status === 503 ||
                    response.status === 504
                ) {

                    if (
                        attempt < 3
                    ) {

                        const delay =
                            attempt === 1
                                ? 2500
                                : 6000;


                        setStatus(
                            "⏳ النموذج مشغول.\nإعادة المحاولة بعد قليل...",
                            "loading"
                        );


                        await sleep(
                            delay
                        );


                        continue;

                    }


                    break;

                }


                break;

            }

            catch (error) {

                if (
                    String(
                        error?.message ||
                        ""
                    ).includes(
                        "Gemini API Key"
                    )
                ) {

                    throw error;

                }


                lastError =
                    error?.message ||
                    String(error);


                if (
                    attempt < 3
                ) {

                    await sleep(
                        2000 *
                        attempt
                    );


                    continue;

                }

            }

        }

    }


    throw new Error(
        "تعذر استخدام نماذج Gemini حالياً.\n\nآخر رسالة:\n" +
        lastError
    );

}


/* =====================================================
   استخراج نص Gemini
===================================================== */

function extractGeminiText(
    data
) {

    const candidates =
        data?.candidates;


    if (
        !Array.isArray(
            candidates
        ) ||
        !candidates.length
    ) {

        return "";

    }


    const parts =
        candidates[0]
            ?.content
            ?.parts;


    if (
        !Array.isArray(
            parts
        )
    ) {

        return "";

    }


    return parts
        .map(
            part =>
                part?.text ||
                ""
        )
        .join("")
        .trim();

}


/* =====================================================
   Prompt V3
===================================================== */

function createPrompt() {

    const source =
        sourceLanguage.value;


    const target =
        targetLanguage.value;


    return `

You are an expert professional manga localization system.

You must perform:

- manga OCR
- text region detection
- speech bubble detection
- speech bubble shape detection
- translation
- layout analysis

Analyze the ENTIRE image.

SOURCE LANGUAGE:
${source}

TARGET LANGUAGE:
${target}


FOR EACH meaningful text region return:

1. original
   Exact original text.

2. translation
   Natural concise translation into ${target}.

3. text_box_2d
   Bounding box around the original printed text.

4. bubble_inner_polygon_2d
   Polygon following the INNER WHITE AREA of the speech bubble.

5. text_safe_box_2d
   A rectangular area completely inside that polygon where the translated text can safely be drawn.


VERY IMPORTANT ABOUT THE POLYGON:

bubble_inner_polygon_2d must follow the real shape of the white/empty interior of the speech bubble.

DO NOT return a large rectangle around the bubble.

DO NOT include surrounding artwork.

DO NOT include faces.

DO NOT include character bodies.

DO NOT include black bubble outlines.

Keep polygon points slightly INSIDE the black outline.

The polygon should describe only the clean interior area that can safely be painted white.

Use approximately 6 to 20 points when possible.

If the speech bubble is oval, follow the oval.

If the speech bubble is irregular, follow its irregular shape.

Do not include the bubble tail unless it contains original text or is necessary for the text area.


TEXT SAFE BOX:

text_safe_box_2d must:

- be completely inside bubble_inner_polygon_2d
- avoid edges
- leave comfortable margins
- be large enough for translated text
- preferably be centered in the main body of the speech bubble


TEXT GROUPING:

One speech bubble = normally one block.

Do NOT split Japanese characters one by one.

Do NOT split vertical Japanese text into separate character blocks.

Group all text belonging to the same speech bubble.


TRANSLATION:

Translate naturally.

Do NOT translate word-for-word if that sounds unnatural.

For Arabic:
use fluent natural Arabic.

Keep the translation concise enough to fit inside the original bubble.

Preserve character names.

Do not invent unreadable text.

Ignore page numbers and meaningless marks.


COORDINATES:

All coordinates are normalized from 0 to 1000.

Boxes use:

[ymin, xmin, ymax, xmax]

Polygon points use:

[y, x]


RETURN ONLY VALID JSON.

/* =====================================================
   تحليل JSON
===================================================== */

function parseResponse(text) {

    let cleaned =
        String(
            text ||
            ""
        )
            .trim()
            .replace(
                /```json/gi,
                ""
            )
            .replace(
                /```/g,
                ""
            )
            .trim();


    let parsed;


    try {

        parsed =
            JSON.parse(
                cleaned
            );

    }

    catch {

        const start =
            cleaned.indexOf(
                "["
            );


        const end =
            cleaned.lastIndexOf(
                "]"
            );


        if (
            start === -1 ||
            end === -1 ||
            end <= start
        ) {

            throw new Error(
                "Gemini لم يرجع JSON صالحاً."
            );

        }


        try {

            parsed =
                JSON.parse(
                    cleaned.slice(
                        start,
                        end + 1
                    )
                );

        }

        catch {

            throw new Error(
                "تعذر قراءة نتيجة Gemini."
            );

        }

    }


    if (
        !Array.isArray(
            parsed
        )
    ) {

        if (
            Array.isArray(
                parsed?.blocks
            )
        ) {

            parsed =
                parsed.blocks;

        }

        else {

            throw new Error(
                "صيغة النتيجة غير صحيحة."
            );

        }

    }


    return parsed
        .map(
            normalizeBlock
        )
        .filter(
            Boolean
        );

}


/* =====================================================
   تنظيف block
===================================================== */

function normalizeBlock(
    block
) {

    if (!block) {

        return null;

    }


    let textBox =
        block.text_box_2d ||
        block.box_2d ||
        block.bbox ||
        block.box;


    if (
        !Array.isArray(
            textBox
        )
    ) {

        return null;

    }


    textBox =
        normalizeBox(
            textBox
        );


    if (
        !textBox
    ) {

        return null;

    }


    let polygon =
        normalizePolygon(
            block.bubble_inner_polygon_2d ||
            block.bubble_polygon ||
            block.polygon
        );


    let safeBox =
        normalizeBox(
            block.text_safe_box_2d ||
            block.safe_box_2d
        );


    /*
       إذا Gemini لم يرجع Polygon
       نستعمل fallback.
    */

    if (
        !polygon
    ) {

        if (
            !safeBox
        ) {

            safeBox =
                expandBox(
                    textBox,
                    55,
                    65
                );

        }


        polygon =
            boxToPolygon(
                safeBox
            );

    }


    const polygonBox =
        polygonBoundingBox(
            polygon
        );


    /*
       إذا لم يعد safe box
       نصنع واحداً داخل Polygon.
    */

    if (
        !safeBox
    ) {

        safeBox =
            insetBox(
                polygonBox,
                60
            );

    }


    /*
       نبقي safe box داخل
       Bounding Box للـ Polygon.
    */

    safeBox =
        intersectBoxes(
            safeBox,
            polygonBox
        );


    if (
        !safeBox
    ) {

        safeBox =
            insetBox(
                polygonBox,
                40
            );

    }


    const original =
        String(
            block.original ||
            block.text ||
            ""
        ).trim();


    const translation =
        String(
            block.translation ||
            block.translated ||
            ""
        ).trim();


    if (
        !original &&
        !translation
    ) {

        return null;

    }


    return {

        text_box_2d:
            textBox,

        polygon,

        safe_box_2d:
            safeBox,

        original,

        translation:
            translation ||
            original,

        type:
            block.type ||
            "dialogue"

    };

}


/* =====================================================
   Normalize Box
===================================================== */

function normalizeBox(box) {

    if (
        !Array.isArray(
            box
        ) ||
        box.length < 4
    ) {

        return null;

    }


    let values =
        box
            .slice(
                0,
                4
            )
            .map(
                Number
            );


    if (
        values.some(
            value =>
                !Number.isFinite(
                    value
                )
        )
    ) {

        return null;

    }


    let [
        ymin,
        xmin,
        ymax,
        xmax
    ] =
        values;


    const largest =
        Math.max(
            Math.abs(ymin),
            Math.abs(xmin),
            Math.abs(ymax),
            Math.abs(xmax)
        );


    if (
        largest <= 1.5
    ) {

        ymin *= 1000;
        xmin *= 1000;
        ymax *= 1000;
        xmax *= 1000;

    }


    ymin =
        clamp1000(
            ymin
        );


    xmin =
        clamp1000(
            xmin
        );


    ymax =
        clamp1000(
            ymax
        );


    xmax =
        clamp1000(
            xmax
        );


    if (
        ymax <= ymin ||
        xmax <= xmin
    ) {

        return null;

    }


    return [

        ymin,
        xmin,
        ymax,
        xmax

    ];

}


/* =====================================================
   Normalize Polygon
===================================================== */

function normalizePolygon(
    polygon
) {

    if (
        !Array.isArray(
            polygon
        )
    ) {

        return null;

    }


    const rawPoints =
        polygon
            .filter(
                point =>
                    Array.isArray(
                        point
                    ) &&
                    point.length >= 2
            )
            .map(
                point => [

                    Number(
                        point[0]
                    ),

                    Number(
                        point[1]
                    )

                ]
            )
            .filter(
                point =>

                    Number.isFinite(
                        point[0]
                    ) &&

                    Number.isFinite(
                        point[1]
                    )

            );


    if (
        rawPoints.length < 3
    ) {

        return null;

    }


    let largest =
        0;


    rawPoints.forEach(
        point => {

            largest =
                Math.max(

                    largest,

                    Math.abs(
                        point[0]
                    ),

                    Math.abs(
                        point[1]
                    )

                );

        }
    );


    const normalized =
        rawPoints.map(
            point => {

                let y =
                    point[0];


                let x =
                    point[1];


                if (
                    largest <= 1.5
                ) {

                    y *=
                        1000;

                    x *=
                        1000;

                }


                return [

                    clamp1000(
                        y
                    ),

                    clamp1000(
                        x
                    )

                ];

            }
        );


    return normalized;

}


/* =====================================================
   Clamp
===================================================== */

function clamp1000(
    value
) {

    return Math.max(
        0,
        Math.min(
            1000,
            Number(value)
        )
    );

}


/* =====================================================
   Expand Box
===================================================== */

function expandBox(
    box,
    vertical,
    horizontal
) {

    const [
        ymin,
        xmin,
        ymax,
        xmax
    ] =
        box;


    return [

        clamp1000(
            ymin -
            vertical
        ),

        clamp1000(
            xmin -
            horizontal
        ),

        clamp1000(
            ymax +
            vertical
        ),

        clamp1000(
            xmax +
            horizontal
        )

    ];

}


/* =====================================================
   Box -> Polygon
===================================================== */

function boxToPolygon(
    box
) {

    const [
        ymin,
        xmin,
        ymax,
        xmax
    ] =
        box;


    return [

        [
            ymin,
            xmin
        ],

        [
            ymin,
            xmax
        ],

        [
            ymax,
            xmax
        ],

        [
            ymax,
            xmin
        ]

    ];

}


/* =====================================================
   Polygon Bounding Box
===================================================== */

function polygonBoundingBox(
    polygon
) {

    const ys =
        polygon.map(
            point =>
                point[0]
        );


    const xs =
        polygon.map(
            point =>
                point[1]
        );


    return [

        Math.min(
            ...ys
        ),

        Math.min(
            ...xs
        ),

        Math.max(
            ...ys
        ),

        Math.max(
            ...xs
        )

    ];

}


/* =====================================================
   Inset Box
===================================================== */

function insetBox(
    box,
    amount
) {

    const [
        ymin,
        xmin,
        ymax,
        xmax
    ] =
        box;


    const height =
        ymax -
        ymin;


    const width =
        xmax -
        xmin;


    const insetY =
        Math.min(
            amount,
            height *
            0.15
        );


    const insetX =
        Math.min(
            amount,
            width *
            0.15
        );


    const result = [

        ymin +
        insetY,

        xmin +
        insetX,

        ymax -
        insetY,

        xmax -
        insetX

    ];


    if (
        result[2] <=
        result[0] ||
        result[3] <=
        result[1]
    ) {

        return box;

    }


    return result;

}


/* =====================================================
   تقاطع صندوقين
===================================================== */

function intersectBoxes(
    a,
    b
) {

    const ymin =
        Math.max(
            a[0],
            b[0]
        );


    const xmin =
        Math.max(
            a[1],
            b[1]
        );


    const ymax =
        Math.min(
            a[2],
            b[2]
        );


    const xmax =
        Math.min(
            a[3],
            b[3]
        );


    if (
        ymax <= ymin ||
        xmax <= xmin
    ) {

        return null;

    }


    return [

        ymin,
        xmin,
        ymax,
        xmax

    ];

}


/* =====================================================
   الرسم النهائي
===================================================== */

function drawTranslation(
    blocks
) {

    drawOriginalImage();


    for (
        const block of blocks
    ) {

        drawBlock(
            block
        );

    }

}


/* =====================================================
   رسم Block
===================================================== */

function drawBlock(
    block
) {

    /*
       إذا SFX بدون فقاعة حقيقية
       لا نمسح الرسم.
    */

    if (
        !block.polygon ||
        block.polygon.length < 3
    ) {

        return;

    }


    let points =
        block.polygon.map(
            point => {

                const y =
                    point[0] /
                    1000 *
                    canvas.height;


                const x =
                    point[1] /
                    1000 *
                    canvas.width;


                return {

                    x,
                    y

                };

            }
        );


    /*
       نقلل الشكل نحو الداخل قليلاً
       حتى لا نلمس الخط الأسود.
    */

    points =
        shrinkPolygon(
            points,
            0.975
        );


    /*
       نحاول معرفة لون خلفية
       الفقاعة من الصورة الأصلية.
    */

    const backgroundColor =
        detectBubbleColor(
            points
        );


    /*
       نمسح النص القديم
       داخل شكل الفقاعة فقط.
    */

    ctx.save();


    buildSmoothPolygonPath(
        ctx,
        points
    );


    ctx.fillStyle =
        backgroundColor;


    ctx.fill();


    ctx.restore();


    /*
       Safe Box للكتابة.
    */

    const box =
        block.safe_box_2d;


    const [
        ymin,
        xmin,
        ymax,
        xmax
    ] =
        box;


    const x =
        xmin /
        1000 *
        canvas.width;


    const y =
        ymin /
        1000 *
        canvas.height;


    const width =
        (
            xmax -
            xmin
        ) /
        1000 *
        canvas.width;


    const height =
        (
            ymax -
            ymin
        ) /
        1000 *
        canvas.height;


    /*
       Clip:
       حتى لو اقترب النص من الطرف
       لن يخرج خارج الفقاعة.
    */

    ctx.save();


    buildSmoothPolygonPath(
        ctx,
        points
    );


    ctx.clip();


    drawFittedText(
        block.translation,
        x,
        y,
        width,
        height
    );


    ctx.restore();

}


/* =====================================================
   Shrink Polygon
===================================================== */

function shrinkPolygon(
    points,
    factor
) {

    if (
        !points.length
    ) {

        return points;

    }


    const center =
        points.reduce(
            (
                result,
                point
            ) => {

                result.x +=
                    point.x;


                result.y +=
                    point.y;


                return result;

            },
            {
                x: 0,
                y: 0
            }
        );


    center.x /=
        points.length;


    center.y /=
        points.length;


    return points.map(
        point => ({

            x:
                center.x +
                (
                    point.x -
                    center.x
                ) *
                factor,

            y:
                center.y +
                (
                    point.y -
                    center.y
                ) *
                factor

        })
    );

}


/* =====================================================
   Smooth Polygon Path
===================================================== */

function buildSmoothPolygonPath(
    targetCtx,
    points
) {

    if (
        points.length < 3
    ) {

        return;

    }


    const last =
        points[
            points.length -
            1
        ];


    const first =
        points[0];


    const startX =
        (
            last.x +
            first.x
        ) /
        2;


    const startY =
        (
            last.y +
            first.y
        ) /
        2;


    targetCtx.beginPath();


    targetCtx.moveTo(
        startX,
        startY
    );


    for (
        let i = 0;
        i < points.length;
        i++
    ) {

        const current =
            points[i];


        const next =
            points[
                (
                    i +
                    1
                ) %
                points.length
            ];


        const midX =
            (
                current.x +
                next.x
            ) /
            2;


        const midY =
            (
                current.y +
                next.y
            ) /
            2;


        targetCtx.quadraticCurveTo(

            current.x,

            current.y,

            midX,

            midY

        );

    }


    targetCtx.closePath();

}


/* =====================================================
   تحديد لون خلفية الفقاعة
===================================================== */

function detectBubbleColor(
    points
) {

    try {

        const xs =
            points.map(
                p =>
                    p.x
            );


        const ys =
            points.map(
                p =>
                    p.y
            );


        const minX =
            Math.max(
                0,
                Math.floor(
                    Math.min(
                        ...xs
                    )
                )
            );


        const maxX =
            Math.min(
                sourceCanvas.width -
                1,
                Math.ceil(
                    Math.max(
                        ...xs
                    )
                )
            );


        const minY =
            Math.max(
                0,
                Math.floor(
                    Math.min(
                        ...ys
                    )
                )
            );


        const maxY =
            Math.min(
                sourceCanvas.height -
                1,
                Math.ceil(
                    Math.max(
                        ...ys
                    )
                )
            );


        const width =
            maxX -
            minX;


        const height =
            maxY -
            minY;


        if (
            width <= 0 ||
            height <= 0
        ) {

            return "#ffffff";

        }


        /*
           لا نأخذ كل Pixel حتى
           يبقى الهاتف سريعاً.
        */

        const step =
            Math.max(
                5,
                Math.floor(
                    Math.sqrt(
                        width *
                        height
                    ) /
                    60
                )
            );


        let r =
            0;


        let g =
            0;


        let b =
            0;


        let count =
            0;


        for (
            let y = minY;
            y <= maxY;
            y += step
        ) {

            for (
                let x = minX;
                x <= maxX;
                x += step
            ) {

                if (
                    !pointInPolygon(
                        x,
                        y,
                        points
                    )
                ) {

                    continue;

                }


                const pixel =
                    sourceCtx.getImageData(
                        x,
                        y,
                        1,
                        1
                    ).data;


                const luminance =
                    (
                        pixel[0] *
                        0.299
                    ) +
                    (
                        pixel[1] *
                        0.587
                    ) +
                    (
                        pixel[2] *
                        0.114
                    );


                /*
                   نتجاهل الحروف السوداء.
                   نأخذ الخلفية الفاتحة.
                */

                if (
                    luminance >= 180
                ) {

                    r +=
                        pixel[0];


                    g +=
                        pixel[1];


                    b +=
                        pixel[2];


                    count++;

                }

            }

        }


        if (
            count < 5
        ) {

            return "#ffffff";

        }


        r =
            Math.round(
                r /
                count
            );


        g =
            Math.round(
                g /
                count
            );


        b =
            Math.round(
                b /
                count
            );


        /*
           نرفع اللون قليلاً
           حتى تبقى الفقاعة نظيفة.
        */

        r =
            Math.min(
                255,
                r + 5
            );


        g =
            Math.min(
                255,
                g + 5
            );


        b =
            Math.min(
                255,
                b + 5
            );


        return (
            "rgb(" +
            r +
            "," +
            g +
            "," +
            b +
            ")"
        );

    }

    catch (error) {

        console.warn(
            "Bubble color detection failed",
            error
        );


        return "#ffffff";

    }

}


/* =====================================================
   Point in Polygon
===================================================== */

function pointInPolygon(
    x,
    y,
    points
) {

    let inside =
        false;


    for (
        let i = 0,
            j =
                points.length -
                1;

        i <
        points.length;

        j = i++
    ) {

        const xi =
            points[i].x;


        const yi =
            points[i].y;


        const xj =
            points[j].x;


        const yj =
            points[j].y;


        const intersect =
            (
                (
                    yi >
                    y
                ) !==
                (
                    yj >
                    y
                )
            ) &&
            (
                x <
                (
                    (
                        xj -
                        xi
                    ) *
                    (
                        y -
                        yi
                    )
                ) /
                (
                    (
                        yj -
                        yi
                    ) ||
                    0.00001
                ) +
                xi
            );


        if (
            intersect
        ) {

            inside =
                !inside;

        }

    }


    return inside;

}


/* =====================================================
   كتابة النص
===================================================== */

function drawFittedText(
    text,
    x,
    y,
    width,
    height
) {

    text =
        String(
            text ||
            ""
        )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    if (
        !text ||
        width < 15 ||
        height < 15
    ) {

        return;

    }


    /*
       هامش أكبر من V2.
    */

    const paddingX =
        Math.max(
            7,
            width *
            0.11
        );


    const paddingY =
        Math.max(
            7,
            height *
            0.11
        );


    const maxWidth =
        Math.max(
            10,
            width -
            paddingX *
            2
        );


    const maxHeight =
        Math.max(
            10,
            height -
            paddingY *
            2
        );


    /*
       نبدأ بحجم أكثر اعتدالاً
       من V2.
    */

    let fontSize =
        Math.min(

            54,

            height *
            0.27,

            width *
            0.14

        );


    fontSize =
        Math.max(
            11,
            fontSize
        );


    let bestLines =
        [];


    while (
        fontSize >= 9
    ) {

        setCanvasFont(
            fontSize
        );


        let lines =
            smartWrapText(
                text,
                maxWidth
            );


        lines =
            balanceLines(
                lines,
                maxWidth
            );


        const lineHeight =
            fontSize *
            1.28;


        const totalHeight =
            lines.length *
            lineHeight;


        if (
            totalHeight <=
            maxHeight
        ) {

            bestLines =
                lines;


            break;

        }


        fontSize -=
            1;

    }


    if (
        !bestLines.length
    ) {

        fontSize =
            9;


        setCanvasFont(
            fontSize
        );


        bestLines =
            smartWrapText(
                text,
                maxWidth
            );

    }


    const lineHeight =
        fontSize *
        1.30;


    const totalHeight =
        bestLines.length *
        lineHeight;


    ctx.save();


    setCanvasFont(
        fontSize
    );


    ctx.fillStyle =
        "#111111";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.direction =
        targetLanguage.value ===
        "Arabic"
            ? "rtl"
            : "ltr";


    let currentY =
        y +
        height /
        2 -
        totalHeight /
        2 +
        lineHeight /
        2;


    for (
        const line of bestLines
    ) {

        ctx.fillText(

            line,

            x +
            width /
            2,

            currentY,

            maxWidth

        );


        currentY +=
            lineHeight;

    }


    ctx.restore();

}


/* =====================================================
   Font
===================================================== */

function setCanvasFont(
    size
) {

    ctx.font =
        "700 " +
        size +
        "px Arial, Tahoma, sans-serif";

}


/* =====================================================
   Wrap
===================================================== */

function smartWrapText(
    text,
    maxWidth
) {

    const words =
        String(
            text
        )
            .trim()
            .split(
                /\s+/
            );


    if (
        !words.length
    ) {

        return [];

    }


    const lines =
        [];


    let current =
        "";


    for (
        const word of words
    ) {

        const candidate =
            current
                ? current +
                  " " +
                  word
                : word;


        if (
            ctx.measureText(
                candidate
            ).width <=
            maxWidth
        ) {

            current =
                candidate;

        }

        else {

            if (
                current
            ) {

                lines.push(
                    current
                );

            }


            if (
                ctx.measureText(
                    word
                ).width <=
                maxWidth
            ) {

                current =
                    word;

            }

            else {

                const pieces =
                    splitLongWord(
                        word,
                        maxWidth
                    );


                if (
                    pieces.length >
                    1
                ) {

                    lines.push(
                        ...pieces.slice(
                            0,
                            -1
                        )
                    );


                    current =
                        pieces[
                            pieces.length -
                            1
                        ];

                }

                else {

                    current =
                        pieces[0] ||
                        "";

                }

            }

        }

    }


    if (
        current
    ) {

        lines.push(
            current
        );

    }


    return lines;

}


/* =====================================================
   موازنة الأسطر
===================================================== */

function balanceLines(
    lines,
    maxWidth
) {

    if (
        lines.length < 2
    ) {

        return lines;

    }


    const result =
        [...lines];


    /*
       نحاول نقل كلمة من السطر
       الطويل إلى السطر القصير.
    */

    for (
        let pass = 0;
        pass < 4;
        pass++
    ) {

        let changed =
            false;


        for (
            let i = 0;
            i <
            result.length -
            1;
            i++
        ) {

            const firstWords =
                result[i]
                    .split(
                        " "
                    );


            if (
                firstWords.length <= 1
            ) {

                continue;

            }


            const secondWords =
                result[
                    i + 1
                ].split(
                    " "
                );


            const movedWord =
                firstWords[
                    firstWords.length -
                    1
                ];


            const newFirst =
                firstWords
                    .slice(
                        0,
                        -1
                    )
                    .join(
                        " "
                    );


            const newSecond =
                [
                    movedWord,
                    ...secondWords
                ].join(
                    " "
                );


            const firstWidth =
                ctx.measureText(
                    result[i]
                ).width;


            const secondWidth =
                ctx.measureText(
                    result[
                        i + 1
                    ]
                ).width;


            const newFirstWidth =
                ctx.measureText(
                    newFirst
                ).width;


            const newSecondWidth =
                ctx.measureText(
                    newSecond
                ).width;


            if (
                newSecondWidth <=
                maxWidth
            ) {

                const before =
                    Math.abs(
                        firstWidth -
                        secondWidth
                    );


                const after =
                    Math.abs(
                        newFirstWidth -
                        newSecondWidth
                    );


                if (
                    after <
                    before
                ) {

                    result[i] =
                        newFirst;


                    result[
                        i + 1
                    ] =
                        newSecond;


                    changed =
                        true;

                }

            }

        }


        if (
            !changed
        ) {

            break;

        }

    }


    return result;

}


/* =====================================================
   الكلمات الطويلة
===================================================== */

function splitLongWord(
    word,
    maxWidth
) {

    const parts =
        [];


    let current =
        "";


    for (
        const char of word
    ) {

        const test =
            current +
            char;


        if (
            ctx.measureText(
                test
            ).width >
            maxWidth
        ) {

            if (
                current
            ) {

                parts.push(
                    current
                );

            }


            current =
                char;

        }

        else {

            current =
                test;

        }

    }


    if (
        current
    ) {

        parts.push(
            current
        );

    }


    return parts;

}


/* =====================================================
   إظهار النتائج
===================================================== */

function showResults(
    blocks
) {

    textResults.innerHTML =
        "";


    blocks.forEach(
        (
            block,
            index
        ) => {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "result";


            const original =
                document.createElement(
                    "div"
                );


            original.className =
                "original";


            original.textContent =
                (
                    index +
                    1
                ) +
                ". الأصل: " +
                block.original;


            const translated =
                document.createElement(
                    "div"
                );


            translated.className =
                "translation";


            translated.textContent =
                block.translation;


            wrapper.appendChild(
                original
            );


            wrapper.appendChild(
                translated
            );


            textResults.appendChild(
                wrapper
            );

        }
    );


    results.style.display =
        "block";

}


/* =====================================================
   الأصل / الترجمة
===================================================== */

restoreButton.addEventListener(
    "click",
    () => {

        if (
            !preparedImage
        ) {

            return;

        }


        if (
            translatedVisible
        ) {

            drawOriginalImage();


            translatedVisible =
                false;


            restoreButton.textContent =
                "✨ عرض الصورة المترجمة";

        }

        else {

            drawTranslation(
                lastBlocks
            );


            translatedVisible =
                true;


            restoreButton.textContent =
                "↩ عرض الصورة الأصلية";

        }

    }
);


/* =====================================================
   حفظ الصورة
===================================================== */

downloadButton.addEventListener(
    "click",
    () => {

        if (
            !translatedVisible &&
            lastBlocks.length
        ) {

            drawTranslation(
                lastBlocks
            );


            translatedVisible =
                true;


            restoreButton.textContent =
                "↩ عرض الصورة الأصلية";

        }


        canvas.toBlob(
            blob => {

                if (
                    !blob
                ) {

                    setStatus(
                        "❌ تعذر إنشاء الصورة.",
                        "error"
                    );


                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    "manga-translated-v3.png";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    () => {

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );

            },

            "image/png"

        );

    }
);


/* =====================================================
   صورة جديدة
===================================================== */

newButton.addEventListener(
    "click",
    () => {

        imageInput.value =
            "";


        preparedImage =
            null;


        preparedBase64 =
            null;


        lastBlocks =
            [];


        translatedVisible =
            false;


        canvas.width =
            1;


        canvas.height =
            1;


        sourceCanvas.width =
            1;


        sourceCanvas.height =
            1;


        canvasCard.style.display =
            "none";


        results.style.display =
            "none";


        downloadButton.style.display =
            "none";


        restoreButton.style.display =
            "none";


        translateButton.disabled =
            true;


        textResults.innerHTML =
            "";


        modelInfo.textContent =
            "";


        setStatus(
            "اختر صورة للبدء"
        );

    }
);
