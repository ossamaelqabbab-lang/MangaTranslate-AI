<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MangaTranslate AI V4</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d1017;
    color: white;
    font-family: Arial, Tahoma, sans-serif;
}

.app {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 18px;
}

header {
    text-align: center;
    padding: 18px 0;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 8px 0;
    color: #9ca3af;
}

.version {
    display: inline-block;
    background: #252c3c;
    color: #b8c0d0;
    border-radius: 20px;
    padding: 6px 11px;
    font-size: 12px;
}

.card {
    background: #171c27;
    border: 1px solid #2b3345;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
}

label {
    display: block;
    margin: 10px 0 7px;
    font-weight: bold;
}

input,
select,
button {
    width: 100%;
    min-height: 48px;
    border-radius: 10px;
    font-size: 16px;
}

input,
select {
    background: #222938;
    color: white;
    border: 1px solid #3a455e;
    padding: 10px;
}

#apiKey {
    direction: ltr;
}

.upload {
    display: block;
    border: 2px dashed #4a5875;
    background: #202735;
    text-align: center;
    padding: 25px 12px;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 16px;
}

.upload small {
    color: #aab1c0;
}

#imageInput {
    display: none;
}

.languages {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    border: none;
    color: white;
    padding: 12px;
    margin-top: 12px;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#translateButton {
    background: #6757e8;
}

#downloadButton {
    background: #07885f;
    display: none;
}

#compareButton {
    background: #3b465e;
    display: none;
}

#newButton {
    background: #30394e;
}

#status {
    padding: 16px 5px 5px;
    text-align: center;
    white-space: pre-line;
    line-height: 1.7;
    word-break: break-word;
}

.success {
    color: #4ade80;
}

.error {
    color: #ff6b6b;
}

.loading {
    color: #ffd166;
}

#canvasCard {
    display: none;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: white;
    border-radius: 10px;
}

#results {
    display: none;
}

.result {
    background: #232a39;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
}

.original {
    color: #a7adbb;
    font-size: 14px;
    margin-bottom: 7px;
    direction: auto;
}

.translation {
    font-size: 17px;
    font-weight: bold;
    direction: auto;
}

.displayTranslation {
    color: #b7c1d6;
    font-size: 13px;
    margin-top: 5px;
}

.note {
    color: #9ca3af;
    font-size: 13px;
    line-height: 1.6;
}

.model-info {
    margin-top: 8px;
    color: #9ca3af;
    text-align: center;
    font-size: 13px;
}

@media (max-width: 600px) {

    .languages {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 24px;
    }

}

</style>
</head>


<body>

<div class="app">

<header>

<h1>📖 MangaTranslate AI</h1>

<p>
ترجمة المانغا والقصص المصورة داخل الصورة
</p>

<div class="version">
V4 — Hybrid Bubble Engine
</div>

</header>


<div class="card">

<label>
🔑 Gemini API Key
</label>

<input
    id="apiKey"
    type="password"
    autocomplete="off"
    placeholder="ألصق مفتاح Gemini هنا"
/>

<p class="note">
المفتاح لا يُحفظ داخل GitHub. لا ترسل المفتاح لأي شخص.
</p>


<label
    class="upload"
    for="imageInput"
>
📷 اضغط هنا واختر صورة المانغا
<br>
<small>JPG / PNG / WEBP</small>
</label>


<input
    id="imageInput"
    type="file"
    accept="image/*"
/>


<div class="languages">

<div>

<label>
لغة النص الأصلية
</label>

<select id="sourceLanguage">

<option value="Automatic">
اكتشاف تلقائي
</option>

<option value="Japanese">
اليابانية
</option>

<option value="English">
الإنجليزية
</option>

<option value="Korean">
الكورية
</option>

<option value="Chinese">
الصينية
</option>

<option value="French">
الفرنسية
</option>

<option value="Spanish">
الإسبانية
</option>

<option value="Indonesian">
الإندونيسية
</option>

</select>

</div>


<div>

<label>
الترجمة إلى
</label>

<select id="targetLanguage">

<option value="Arabic">
العربية
</option>

<option value="English">
الإنجليزية
</option>

<option value="French">
الفرنسية
</option>

<option value="Spanish">
الإسبانية
</option>

<option value="Japanese">
اليابانية
</option>

</select>

</div>

</div>


<button
    id="translateButton"
    disabled
>
✨ ترجمة الصورة
</button>


<button id="downloadButton">
⬇ حفظ الصورة المترجمة
</button>


<button id="compareButton">
↩ عرض الصورة الأصلية
</button>


<button id="newButton">
🗑 صورة جديدة
</button>


<div id="status">
اختر صورة للبدء
</div>


<div
    id="modelInfo"
    class="model-info"
></div>

</div>


<div
    id="canvasCard"
    class="card"
>

<canvas id="canvas"></canvas>

</div>


<div
    id="results"
    class="card"
>

<h3>
📝 النصوص المكتشفة
</h3>

<div id="textResults"></div>

</div>

</div>


<script>

/* =====================================================
   العناصر
===================================================== */

const apiKeyInput =
    document.getElementById("apiKey");

const imageInput =
    document.getElementById("imageInput");

const sourceLanguage =
    document.getElementById("sourceLanguage");

const targetLanguage =
    document.getElementById("targetLanguage");

const translateButton =
    document.getElementById("translateButton");

const downloadButton =
    document.getElementById("downloadButton");

const compareButton =
    document.getElementById("compareButton");

const newButton =
    document.getElementById("newButton");

const statusBox =
    document.getElementById("status");

const modelInfo =
    document.getElementById("modelInfo");

const canvasCard =
    document.getElementById("canvasCard");

const results =
    document.getElementById("results");

const textResults =
    document.getElementById("textResults");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


const sourceCanvas =
    document.createElement("canvas");

const sourceCtx =
    sourceCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );


let preparedImage = null;

let preparedBase64 = null;

let lastBlocks = [];

let translatedVisible = false;


/* =====================================================
   Status
===================================================== */

function setStatus(
    text,
    type = ""
) {

    statusBox.textContent =
        text;

    statusBox.className =
        type;

}


/* =====================================================
   اختيار الصورة
===================================================== */

imageInput.addEventListener(
    "change",
    async () => {

        const file =
            imageInput.files[0];


        if (!file) {

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            setStatus(
                "❌ الملف المختار ليس صورة.",
                "error"
            );

            return;

        }


        try {

            setStatus(
                "⏳ جاري تجهيز الصورة...",
                "loading"
            );


            const prepared =
                await prepareImage(
                    file
                );


            preparedImage =
                prepared.image;


            preparedBase64 =
                prepared.base64;


            canvas.width =
                preparedImage.width;


            canvas.height =
                preparedImage.height;


            sourceCanvas.width =
                preparedImage.width;


            sourceCanvas.height =
                preparedImage.height;


            sourceCtx.clearRect(
                0,
                0,
                sourceCanvas.width,
                sourceCanvas.height
            );


            sourceCtx.drawImage(
                preparedImage,
                0,
                0
            );


            drawOriginal();


            canvasCard.style.display =
                "block";


            results.style.display =
                "none";


            downloadButton.style.display =
                "none";


            compareButton.style.display =
                "none";


            translateButton.disabled =
                false;


            lastBlocks =
                [];


            translatedVisible =
                false;


            modelInfo.textContent =
                "";


            setStatus(
                "✅ الصورة جاهزة.\nاضغط ترجمة الصورة.",
                "success"
            );

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "❌ تعذر تجهيز الصورة.",
                "error"
            );

        }

    }
);


/* =====================================================
   تجهيز الصورة
===================================================== */

async function prepareImage(
    file
) {

    const original =
        await fileToImage(
            file
        );


    let width =
        original.naturalWidth;


    let height =
        original.naturalHeight;


    const maxDimension =
        2000;


    if (
        width > maxDimension ||
        height > maxDimension
    ) {

        const ratio =
            Math.min(

                maxDimension /
                width,

                maxDimension /
                height

            );


        width =
            Math.round(
                width *
                ratio
            );


        height =
            Math.round(
                height *
                ratio
            );

    }


    const temp =
        document.createElement(
            "canvas"
        );


    temp.width =
        width;


    temp.height =
        height;


    const tempCtx =
        temp.getContext("2d");


    tempCtx.fillStyle =
        "#ffffff";


    tempCtx.fillRect(
        0,
        0,
        width,
        height
    );


    tempCtx.drawImage(
        original,
        0,
        0,
        width,
        height
    );


    const dataURL =
        temp.toDataURL(
            "image/jpeg",
            0.95
        );


    const image =
        new Image();


    await new Promise(
        (
            resolve,
            reject
        ) => {

            image.onload =
                resolve;


            image.onerror =
                reject;


            image.src =
                dataURL;

        }
    );


    return {

        image,

        base64:
            dataURL.split(
                ","
            )[1]

    };

}


/* =====================================================
   File -> Image
===================================================== */

function fileToImage(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const url =
                URL.createObjectURL(
                    file
                );


            const image =
                new Image();


            image.onload =
                () => {

                    URL.revokeObjectURL(
                        url
                    );


                    resolve(
                        image
                    );

                };


            image.onerror =
                () => {

                    URL.revokeObjectURL(
                        url
                    );


                    reject(
                        new Error(
                            "فشل تحميل الصورة."
                        )
                    );

                };


            image.src =
                url;

        }
    );

}


/* =====================================================
   الأصل
===================================================== */

function drawOriginal() {

    if (!preparedImage) {

        return;

    }


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.drawImage(
        preparedImage,
        0,
        0
    );

}


/* =====================================================
   زر الترجمة
===================================================== */

translateButton.addEventListener(
    "click",
    async () => {

        const apiKey =
            apiKeyInput
                .value
                .trim();


        if (!apiKey) {

            setStatus(
                "❌ ضع Gemini API Key أولاً.",
                "error"
            );

            return;

        }


        if (!preparedBase64) {

            setStatus(
                "❌ اختر صورة أولاً.",
                "error"
            );

            return;

        }


        translateButton.disabled =
            true;


        results.style.display =
            "none";


        downloadButton.style.display =
            "none";


        compareButton.style.display =
            "none";


        modelInfo.textContent =
            "";


        try {

            setStatus(
                "🔎 البحث عن نموذج Gemini مناسب...",
                "loading"
            );


            const models =
                await getAvailableModels(
                    apiKey
                );


            if (!models.length) {

                throw new Error(
                    "لم يتم العثور على نموذج مناسب."
                );

            }


            const result =
                await callGemini(

                    apiKey,

                    models,

                    createPrompt(),

                    preparedBase64

                );


            modelInfo.textContent =
                "النموذج المستخدم: " +
                result.model;


            const blocks =
                parseResponse(
                    result.text
                );


            if (!blocks.length) {

                throw new Error(
                    "لم يتم العثور على نص قابل للترجمة."
                );

            }


            lastBlocks =
                blocks;


            drawTranslation(
                blocks
            );


            showResults(
                blocks
            );


            translatedVisible =
                true;


            downloadButton.style.display =
                "block";


            compareButton.style.display =
                "block";


            compareButton.textContent =
                "↩ عرض الصورة الأصلية";


            setStatus(
                "✅ تمت الترجمة بنجاح.\nتم اكتشاف " +
                blocks.length +
                " منطقة نصية.",
                "success"
            );

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "❌ حدث خطأ:\n" +
                (
                    error?.message ||
                    String(error)
                ),
                "error"
            );

        }

        finally {

            translateButton.disabled =
                false;

        }

    }
);


/* =====================================================
   Gemini models
===================================================== */

async function getAvailableModels(
    apiKey
) {

    try {

        const response =
            await fetch(
                "https://generativelanguage.googleapis.com/v1beta/models?pageSize=100",
                {

                    headers: {

                        "x-goog-api-key":
                            apiKey

                    }

                }
            );


        const data =
            await response.json();


        if (
            response.status === 401 ||
            response.status === 403
        ) {

            throw new Error(
                "مفتاح Gemini غير صالح أو لا يملك صلاحية."
            );

        }


        if (!response.ok) {

            return fallbackModels();

        }


        const models =
            Array.isArray(
                data.models
            )
                ? data.models
                : [];


        const usable =
            models
                .filter(
                    model => {

                        const name =
                            String(
                                model.name ||
                                ""
                            ).toLowerCase();


                        const methods =
                            model.supportedGenerationMethods ||
                            [];


                        if (
                            !name.includes(
                                "gemini"
                            )
                        ) {

                            return false;

                        }


                        if (
                            !methods.includes(
                                "generateContent"
                            )
                        ) {

                            return false;

                        }


                        const excluded = [

                            "embedding",
                            "imagen",
                            "tts",
                            "audio",
                            "live",
                            "aqa",
                            "image-generation"

                        ];


                        return !excluded.some(
                            value =>
                                name.includes(
                                    value
                                )
                        );

                    }
                )
                .map(
                    model =>

                        String(
                            model.name
                        ).replace(
                            /^models\//,
                            ""
                        )

                );


        usable.sort(
            (
                a,
                b
            ) =>

                modelScore(b) -
                modelScore(a)

        );


        return [
            ...new Set(
                usable
            )
        ].slice(
            0,
            8
        );

    }

    catch (error) {

        if (
            String(
                error?.message ||
                ""
            ).includes(
                "مفتاح Gemini"
            )
        ) {

            throw error;

        }


        return fallbackModels();

    }

}


/* =====================================================
   Model score
===================================================== */

function modelScore(
    name
) {

    const model =
        String(
            name
        ).toLowerCase();


    let score =
        0;


    if (
        model.includes(
            "flash-lite"
        )
    ) {

        score +=
            120;

    }

    else if (
        model.includes(
            "flash"
        )
    ) {

        score +=
            100;

    }

    else if (
        model.includes(
            "pro"
        )
    ) {

        score +=
            60;

    }


    if (
        model.includes(
            "latest"
        )
    ) {

        score +=
            20;

    }


    if (
        model.includes(
            "preview"
        )
    ) {

        score -=
            10;

    }


    return score;

}


/* =====================================================
   Fallback models
===================================================== */

function fallbackModels() {

    return [

        "gemini-flash-lite-latest",

        "gemini-flash-latest",

        "gemini-2.5-flash-lite",

        "gemini-2.5-flash"

    ];

}


/* =====================================================
   Call Gemini
===================================================== */

async function callGemini(
    apiKey,
    models,
    prompt,
    base64
) {

    const sleep =
        ms =>
            new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        ms
                    )
            );


    let lastError =
        "فشل الاتصال بـ Gemini.";


    for (
        let modelIndex = 0;
        modelIndex < models.length;
        modelIndex++
    ) {

        const model =
            models[
                modelIndex
            ];


        for (
            let attempt = 1;
            attempt <= 3;
            attempt++
        ) {

            setStatus(
                "🤖 " +
                model +
                "\nالمحاولة " +
                attempt +
                " من 3",
                "loading"
            );


            try {

                const url =
                    "https://generativelanguage.googleapis.com/v1beta/models/" +
                    encodeURIComponent(
                        model
                    ) +
                    ":generateContent";


                const response =
                    await fetch(
                        url,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "x-goog-api-key":
                                    apiKey

                            },

                            body:
                                JSON.stringify({

                                    contents: [

                                        {

                                            role:
                                                "user",

                                            parts: [

                                                {

                                                    text:
                                                        prompt

                                                },

                                                {

                                                    inline_data: {

                                                        mime_type:
                                                            "image/jpeg",

                                                        data:
                                                            base64

                                                    }

                                                }

                                            ]

                                        }

                                    ]

                                })

                        }
                    );


                let data =
                    {};


                try {

                    data =
                        await response.json();

                }

                catch {}


                if (
                    response.ok
                ) {

                    const text =
                        extractGeminiText(
                            data
                        );


                    if (text) {

                        return {

                            model,
                            text

                        };

                    }


                    lastError =
                        "Gemini أعاد استجابة فارغة.";


                    break;

                }


                const message =
                    data?.error?.message ||
                    (
                        "HTTP " +
                        response.status
                    );


                lastError =
                    message;


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    throw new Error(
                        "مشكلة في Gemini API Key:\n" +
                        message
                    );

                }


                if (
                    response.status === 400 ||
                    response.status === 404
                ) {

                    break;

                }


                if (
                    [
                        429,
                        500,
                        502,
                        503,
                        504
                    ].includes(
                        response.status
                    )
                ) {

                    if (
                        attempt < 3
                    ) {

                        const delay =
                            attempt === 1
                                ? 2500
                                : 6000;


                        setStatus(
                            "⏳ النموذج مشغول.\nسيتم إعادة المحاولة...",
                            "loading"
                        );


                        await sleep(
                            delay
                        );


                        continue;

                    }


                    break;

                }


                break;

            }

            catch (error) {

                if (
                    String(
                        error?.message ||
                        ""
                    ).includes(
                        "Gemini API Key"
                    )
                ) {

                    throw error;

                }


                lastError =
                    error?.message ||
                    String(error);


                if (
                    attempt < 3
                ) {

                    await sleep(
                        2000 *
                        attempt
                    );

                    continue;

                }

            }

        }

    }


    throw new Error(
        "تعذر استخدام Gemini حالياً.\n\nآخر رسالة:\n" +
        lastError
    );

}


/* =====================================================
   Extract Gemini text
===================================================== */

function extractGeminiText(
    data
) {

    const parts =
        data
            ?.candidates
            ?.[0]
            ?.content
            ?.parts;


    if (
        !Array.isArray(
            parts
        )
    ) {

        return "";

    }


    return parts
        .map(
            part =>
                part?.text ||
                ""
        )
        .join("")
        .trim();

}


/* =====================================================
   Prompt V4
===================================================== */

function createPrompt() {

    const source =
        sourceLanguage.value;


    const target =
        targetLanguage.value;


    return `

You are a professional manga localization engine.

Analyze the complete manga/comic image.

SOURCE LANGUAGE:
${source}

TARGET LANGUAGE:
${target}


For every meaningful speech bubble, narration box or caption return:

1. original
The exact original text.

2. translation
A natural accurate translation into ${target}.

3. display_translation
A concise version of the same translation optimized to fit naturally inside the original speech bubble.

Do NOT change the meaning.

For Arabic, use fluent natural Arabic and avoid unnecessary long wording.


4. text_box_2d

This box MUST contain ALL original printed characters belonging to that speech bubble.

Include punctuation.

For vertical Japanese, include the full vertical text.

Do not make this box too tight.


5. bubble_box_2d

This is extremely important.

Return a rectangular box representing the LARGE SAFE INNER AREA of the speech bubble where translated text can be placed.

bubble_box_2d should:

- stay inside the black bubble border
- include most of the usable white interior
- be considerably larger than text_box_2d when possible
- avoid the bubble outline
- avoid faces and artwork
- avoid the speech-bubble tail when possible
- be centered in the main body of the bubble

DO NOT return only the area occupied by the original Japanese text.

The translated Arabic needs enough room.


TEXT GROUPING:

One speech bubble normally equals ONE result.

Never split Japanese character-by-character.

Never split vertical Japanese into separate letters.

Group all text belonging to the same bubble.


COORDINATES:

Coordinates use normalized values 0 to 1000.

Format:

[ymin, xmin, ymax, xmax]


EXAMPLE:

[
  {
    "text_box_2d": [
      180,
      690,
      320,
      820
    ],

    "bubble_box_2d": [
      100,
      610,
      370,
      890
    ],

    "original":
      "てめーの仕事だ！",

    "translation":
      "إنها مهمتك!",

    "display_translation":
      "إنها مهمتك!",

    "type":
      "dialogue"
  }
]


Allowed types:

dialogue
narration
caption
sfx


For an SFX written directly over artwork and NOT inside a bubble:

bubble_box_2d may be null.

Do not invent text.

Ignore page numbers and meaningless marks.

Return ONLY JSON.

No Markdown.
No explanation.
No code fences.

If there is no readable text:

[]

`;

}


/* =====================================================
   Parse response
===================================================== */

function parseResponse(
    text
) {

    let cleaned =
        String(
            text ||
            ""
        )
            .trim()
            .replace(
                /```json/gi,
                ""
            )
            .replace(
                /```/g,
                ""
            )
            .trim();


    let parsed;


    try {

        parsed =
            JSON.parse(
                cleaned
            );

    }

    catch {

        const start =
            cleaned.indexOf(
                "["
            );


        const end =
            cleaned.lastIndexOf(
                "]"
            );


        if (
            start === -1 ||
            end === -1 ||
            end <= start
        ) {

            throw new Error(
                "Gemini لم يرجع JSON صالحاً."
            );

        }


        parsed =
            JSON.parse(
                cleaned.slice(
                    start,
                    end + 1
                )
            );

    }


    if (
        !Array.isArray(
            parsed
        )
    ) {

        if (
            Array.isArray(
                parsed?.blocks
            )
        ) {

            parsed =
                parsed.blocks;

        }

        else {

            throw new Error(
                "صيغة النتيجة غير صحيحة."
            );

        }

    }


    return parsed
        .map(
            normalizeBlock
        )
        .filter(
            Boolean
        );

}


/* =====================================================
   Normalize block
===================================================== */

function normalizeBlock(
    block
) {

    if (!block) {

        return null;

    }


    const textBox =
        normalizeBox(

            block.text_box_2d ||
            block.box_2d ||
            block.bbox ||
            block.box

        );


    if (!textBox) {

        return null;

    }


    let bubbleBox =
        normalizeBox(
            block.bubble_box_2d ||
            block.safe_box_2d
        );


    if (!bubbleBox) {

        bubbleBox =
            expandBox(
                textBox,
                85,
                100
            );

    }


    /*
       bubble box يجب أن يحتوي text box.
    */

    bubbleBox = [

        Math.min(
            bubbleBox[0],
            textBox[0]
        ),

        Math.min(
            bubbleBox[1],
            textBox[1]
        ),

        Math.max(
            bubbleBox[2],
            textBox[2]
        ),

        Math.max(
            bubbleBox[3],
            textBox[3]
        )

    ].map(
        clamp1000
    );


    const original =
        String(
            block.original ||
            block.text ||
            ""
        ).trim();


    const translation =
        String(
            block.translation ||
            block.translated ||
            ""
        ).trim();


    const displayTranslation =
        String(
            block.display_translation ||
            block.short_translation ||
            translation
        ).trim();


    if (
        !original &&
        !translation
    ) {

        return null;

    }


    return {

        textBox,

        bubbleBox,

        original,

        translation:
            translation ||
            original,

        displayTranslation:
            displayTranslation ||
            translation ||
            original,

        type:
            block.type ||
            "dialogue"

    };

}


/* =====================================================
   Normalize box
===================================================== */

function normalizeBox(
    box
) {

    if (
        !Array.isArray(
            box
        ) ||
        box.length < 4
    ) {

        return null;

    }


    let values =
        box
            .slice(
                0,
                4
            )
            .map(
                Number
            );


    if (
        values.some(
            value =>
                !Number.isFinite(
                    value
                )
        )
    ) {

        return null;

    }


    let [
        ymin,
        xmin,
        ymax,
        xmax
    ] =
        values;


    const maxValue =
        Math.max(
            Math.abs(ymin),
            Math.abs(xmin),
            Math.abs(ymax),
            Math.abs(xmax)
        );


    if (
        maxValue <= 1.5
    ) {

        ymin *= 1000;

        xmin *= 1000;

        ymax *= 1000;

        xmax *= 1000;

    }


    ymin =
        clamp1000(
            ymin
        );


    xmin =
        clamp1000(
            xmin
        );


    ymax =
        clamp1000(
            ymax
        );


    xmax =
        clamp1000(
            xmax
        );


    if (
        ymax <= ymin ||
        xmax <= xmin
    ) {

        return null;

    }


    return [

        ymin,
        xmin,
        ymax,
        xmax

    ];

}


/* =====================================================
   Clamp
===================================================== */

function clamp1000(
    value
) {

    return Math.max(
        0,
        Math.min(
            1000,
            Number(value)
        )
    );

}


/* =====================================================
   Expand box
===================================================== */

function expandBox(
    box,
    vertical,
    horizontal
) {

    return [

        clamp1000(
            box[0] -
            vertical
        ),

        clamp1000(
            box[1] -
            horizontal
        ),

        clamp1000(
            box[2] +
            vertical
        ),

        clamp1000(
            box[3] +
            horizontal
        )

    ];

}


/* =====================================================
   Draw translation
===================================================== */

function drawTranslation(
    blocks
) {

    drawOriginal();


    for (
        const block of blocks
    ) {

        cleanOriginalText(
            block
        );

    }


    for (
        const block of blocks
    ) {

        drawTranslatedText(
            block
        );

    }

}


/* =====================================================
   Clean original Japanese
===================================================== */

function cleanOriginalText(
    block
) {

    const box =
        block.textBox;


    const boxHeight =
        box[2] -
        box[0];


    const boxWidth =
        box[3] -
        box[1];


    /*
       نوسّع منطقة النص نفسه
       وليس الفقاعة كلها.
    */

    const extraY =
        Math.max(
            18,
            boxHeight *
            0.28
        );


    const extraX =
        Math.max(
            18,
            boxWidth *
            0.28
        );


    let cleaningBox = [

        box[0] -
        extraY,

        box[1] -
        extraX,

        box[2] +
        extraY,

        box[3] +
        extraX

    ];


    /*
       لا نسمح لمنطقة التنظيف
       بالخروج بعيداً عن الفقاعة.
    */

    cleaningBox = [

        Math.max(
            cleaningBox[0],
            block.bubbleBox[0] +
            5
        ),

        Math.max(
            cleaningBox[1],
            block.bubbleBox[1] +
            5
        ),

        Math.min(
            cleaningBox[2],
            block.bubbleBox[2] -
            5
        ),

        Math.min(
            cleaningBox[3],
            block.bubbleBox[3] -
            5
        )

    ];


    if (
        cleaningBox[2] <=
        cleaningBox[0] ||
        cleaningBox[3] <=
        cleaningBox[1]
    ) {

        cleaningBox =
            box;

    }


    const pixelBox =
        normalizedBoxToPixels(
            cleaningBox
        );


    const bubblePixelBox =
        normalizedBoxToPixels(
            block.bubbleBox
        );


    /*
       لون الخلفية مأخوذ من الفقاعة نفسها.
    */

    const background =
        detectLightBackground(
            bubblePixelBox
        );


    ctx.save();


    ctx.fillStyle =
        background;


    roundedRect(

        pixelBox.x,

        pixelBox.y,

        pixelBox.width,

        pixelBox.height,

        Math.min(
            13,
            pixelBox.width *
            0.10,
            pixelBox.height *
            0.10
        )

    );


    ctx.fill();


    ctx.restore();

}


/* =====================================================
   Bubble background
===================================================== */

function detectLightBackground(
    box
) {

    try {

        const left =
            Math.max(
                0,
                Math.floor(
                    box.x
                )
            );


        const top =
            Math.max(
                0,
                Math.floor(
                    box.y
                )
            );


        const right =
            Math.min(
                sourceCanvas.width,
                Math.ceil(
                    box.x +
                    box.width
                )
            );


        const bottom =
            Math.min(
                sourceCanvas.height,
                Math.ceil(
                    box.y +
                    box.height
                )
            );


        const step =
            Math.max(
                4,
                Math.floor(
                    Math.max(
                        box.width,
                        box.height
                    ) /
                    35
                )
            );


        let r =
            0;

        let g =
            0;

        let b =
            0;

        let count =
            0;


        for (
            let y = top;
            y < bottom;
            y += step
        ) {

            for (
                let x = left;
                x < right;
                x += step
            ) {

                const pixel =
                    sourceCtx.getImageData(
                        x,
                        y,
                        1,
                        1
                    ).data;


                const brightness =
                    (
                        pixel[0] *
                        0.299
                    ) +
                    (
                        pixel[1] *
                        0.587
                    ) +
                    (
                        pixel[2] *
                        0.114
                    );


                /*
                   نتجاهل اليابانية السوداء.
                */

                if (
                    brightness > 205
                ) {

                    r +=
                        pixel[0];

                    g +=
                        pixel[1];

                    b +=
                        pixel[2];

                    count++;

                }

            }

        }


        if (
            count < 5
        ) {

            return "#ffffff";

        }


        r =
            Math.min(
                255,
                Math.round(
                    r /
                    count
                ) +
                3
            );


        g =
            Math.min(
                255,
                Math.round(
                    g /
                    count
                ) +
                3
            );


        b =
            Math.min(
                255,
                Math.round(
                    b /
                    count
                ) +
                3
            );


        return (
            "rgb(" +
            r +
            "," +
            g +
            "," +
            b +
            ")"
        );

    }

    catch {

        return "#ffffff";

    }

}


/* =====================================================
   كتابة الترجمة
===================================================== */

function drawTranslatedText(
    block
) {

    /*
       SFX فوق الرسم بدون Bubble
       يمكن تجاوزه في النسخة الحالية.
    */

    if (
        block.type === "sfx" &&
        !block.bubbleBox
    ) {

        return;

    }


    const box =
        normalizedBoxToPixels(
            block.bubbleBox
        );


    /*
       هامش داخلي كبير قليلاً.
    */

    const padX =
        Math.max(
            8,
            box.width *
            0.12
        );


    const padY =
        Math.max(
            8,
            box.height *
            0.12
        );


    const x =
        box.x +
        padX;


    const y =
        box.y +
        padY;


    const width =
        box.width -
        padX *
        2;


    const height =
        box.height -
        padY *
        2;


    if (
        width <= 20 ||
        height <= 20
    ) {

        return;

    }


    fitAndDrawText(

        block.displayTranslation,

        x,

        y,

        width,

        height

    );

}


/* =====================================================
   Box normalized -> pixels
===================================================== */

function normalizedBoxToPixels(
    box
) {

    const [
        ymin,
        xmin,
        ymax,
        xmax
    ] =
        box;


    return {

        x:
            xmin /
            1000 *
            canvas.width,

        y:
            ymin /
            1000 *
            canvas.height,

        width:
            (
                xmax -
                xmin
            ) /
            1000 *
            canvas.width,

        height:
            (
                ymax -
                ymin
            ) /
            1000 *
            canvas.height

    };

}


/* =====================================================
   Fit text
===================================================== */

function fitAndDrawText(
    text,
    x,
    y,
    width,
    height
) {

    text =
        String(
            text ||
            ""
        )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    if (!text) {

        return;

    }


    /*
       حجم بداية أكبر من V3
       لأن BubbleBox الآن أكبر.
    */

    let fontSize =
        Math.min(

            62,

            height *
            0.34,

            width *
            0.17

        );


    fontSize =
        Math.max(
            13,
            fontSize
        );


    let selectedLines =
        [];


    while (
        fontSize >= 10
    ) {

        setFont(
            fontSize
        );


        let lines =
            wrapTextBalanced(
                text,
                width
            );


        const lineHeight =
            fontSize *
            1.28;


        const totalHeight =
            lines.length *
            lineHeight;


        if (
            totalHeight <=
            height
        ) {

            selectedLines =
                lines;

            break;

        }


        fontSize -=
            1;

    }


    if (
        !selectedLines.length
    ) {

        fontSize =
            10;


        setFont(
            fontSize
        );


        selectedLines =
            wrapTextBalanced(
                text,
                width
            );

    }


    const lineHeight =
        fontSize *
        1.28;


    const totalHeight =
        selectedLines.length *
        lineHeight;


    ctx.save();


    setFont(
        fontSize
    );


    ctx.fillStyle =
        "#111111";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.direction =
        targetLanguage.value ===
        "Arabic"
            ? "rtl"
            : "ltr";


    let currentY =
        y +
        height /
        2 -
        totalHeight /
        2 +
        lineHeight /
        2;


    for (
        const line of selectedLines
    ) {

        ctx.fillText(

            line,

            x +
            width /
            2,

            currentY,

            width

        );


        currentY +=
            lineHeight;

    }


    ctx.restore();

}


/* =====================================================
   Font
===================================================== */

function setFont(
    size
) {

    ctx.font =
        "700 " +
        size +
        "px Arial, Tahoma, sans-serif";

}


/* =====================================================
   Wrap text
===================================================== */

function wrapTextBalanced(
    text,
    maxWidth
) {

    const words =
        String(
            text
        )
            .trim()
            .split(
                /\s+/
            );


    if (!words.length) {

        return [];

    }


    /*
       الطريقة الأولى:
       تقسيم عادي.
    */

    const normal =
        wrapWords(
            words,
            maxWidth
        );


    /*
       نحاول تحسين توازن الأسطر.
    */

    return balanceLines(
        normal,
        maxWidth
    );

}


/* =====================================================
   Wrap words
===================================================== */

function wrapWords(
    words,
    maxWidth
) {

    const lines =
        [];


    let current =
        "";


    for (
        const word of words
    ) {

        const candidate =
            current
                ? current +
                  " " +
                  word
                : word;


        if (
            ctx.measureText(
                candidate
            ).width <=
            maxWidth
        ) {

            current =
                candidate;

        }

        else {

            if (current) {

                lines.push(
                    current
                );

            }


            if (
                ctx.measureText(
                    word
                ).width <=
                maxWidth
            ) {

                current =
                    word;

            }

            else {

                const pieces =
                    splitLongWord(
                        word,
                        maxWidth
                    );


                if (
                    pieces.length >
                    1
                ) {

                    lines.push(
                        ...pieces.slice(
                            0,
                            -1
                        )
                    );


                    current =
                        pieces[
                            pieces.length -
                            1
                        ];

                }

                else {

                    current =
                        pieces[0] ||
                        "";

                }

            }

        }

    }


    if (current) {

        lines.push(
            current
        );

    }


    return lines;

}


/* =====================================================
   Balance lines
===================================================== */

function balanceLines(
    lines,
    maxWidth
) {

    const result =
        [...lines];


    if (
        result.length < 2
    ) {

        return result;

    }


    for (
        let pass = 0;
        pass < 5;
        pass++
    ) {

        let changed =
            false;


        for (
            let i = 0;
            i <
            result.length -
            1;
            i++
        ) {

            const first =
                result[i]
                    .split(
                        " "
                    );


            if (
                first.length <= 1
            ) {

                continue;

            }


            const second =
                result[
                    i + 1
                ].split(
                    " "
                );


            const moved =
                first[
                    first.length -
                    1
                ];


            const newFirst =
                first
                    .slice(
                        0,
                        -1
                    )
                    .join(
                        " "
                    );


            const newSecond =
                [
                    moved,
                    ...second
                ].join(
                    " "
                );


            if (
                ctx.measureText(
                    newSecond
                ).width >
                maxWidth
            ) {

                continue;

            }


            const before =
                Math.abs(

                    ctx.measureText(
                        result[i]
                    ).width -

                    ctx.measureText(
                        result[
                            i + 1
                        ]
                    ).width

                );


            const after =
                Math.abs(

                    ctx.measureText(
                        newFirst
                    ).width -

                    ctx.measureText(
                        newSecond
                    ).width

                );


            if (
                newFirst &&
                after <
                before
            ) {

                result[i] =
                    newFirst;


                result[
                    i + 1
                ] =
                    newSecond;


                changed =
                    true;

            }

        }


        if (!changed) {

            break;

        }

    }


    return result;

}


/* =====================================================
   Long word
===================================================== */

function splitLongWord(
    word,
    maxWidth
) {

    const parts =
        [];


    let current =
        "";


    for (
        const char of word
    ) {

        const candidate =
            current +
            char;


        if (
            ctx.measureText(
                candidate
            ).width >
            maxWidth
        ) {

            if (current) {

                parts.push(
                    current
                );

            }


            current =
                char;

        }

        else {

            current =
                candidate;

        }

    }


    if (current) {

        parts.push(
            current
        );

    }


    return parts;

}


/* =====================================================
   Rounded rect
===================================================== */

function roundedRect(
    x,
    y,
    width,
    height,
    radius
) {

    radius =
        Math.max(
            0,
            Math.min(

                radius,

                width /
                2,

                height /
                2

            )
        );


    ctx.beginPath();


    ctx.moveTo(
        x +
        radius,
        y
    );


    ctx.lineTo(
        x +
        width -
        radius,
        y
    );


    ctx.quadraticCurveTo(

        x +
        width,

        y,

        x +
        width,

        y +
        radius

    );


    ctx.lineTo(
        x +
        width,
        y +
        height -
        radius
    );


    ctx.quadraticCurveTo(

        x +
        width,

        y +
        height,

        x +
        width -
        radius,

        y +
        height

    );


    ctx.lineTo(
        x +
        radius,
        y +
        height
    );


    ctx.quadraticCurveTo(

        x,

        y +
        height,

        x,

        y +
        height -
        radius

    );


    ctx.lineTo(
        x,
        y +
        radius
    );


    ctx.quadraticCurveTo(

        x,

        y,

        x +
        radius,

        y

    );


    ctx.closePath();

}


/* =====================================================
   Results
===================================================== */

function showResults(
    blocks
) {

    textResults.innerHTML =
        "";


    blocks.forEach(
        (
            block,
            index
        ) => {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "result";


            const original =
                document.createElement(
                    "div"
                );


            original.className =
                "original";


            original.textContent =
                (
                    index +
                    1
                ) +
                ". الأصل: " +
                block.original;


            const translated =
                document.createElement(
                    "div"
                );


            translated.className =
                "translation";


            translated.textContent =
                block.translation;


            wrapper.appendChild(
                original
            );


            wrapper.appendChild(
                translated
            );


            /*
               إذا كانت النسخة المختصرة
               مختلفة عن الترجمة الكاملة.
            */

            if (
                block.displayTranslation &&
                block.displayTranslation !==
                block.translation
            ) {

                const display =
                    document.createElement(
                        "div"
                    );


                display.className =
                    "displayTranslation";


                display.textContent =
                    "داخل الفقاعة: " +
                    block.displayTranslation;


                wrapper.appendChild(
                    display
                );

            }


            textResults.appendChild(
                wrapper
            );

        }
    );


    results.style.display =
        "block";

}

compareButton.addEventListener(
    "click",
    () => {

        if (!preparedImage) {

            return;

        }


        if (
            translatedVisible
        ) {

            drawOriginal();


            translatedVisible =
                false;


            compareButton.textContent =
                "✨ عرض الصورة المترجمة";

        }

        else {

            drawTranslation(
                lastBlocks
            );


            translatedVisible =
                true;


            compareButton.textContent =
                "↩ عرض الصورة الأصلية";

        }

    }
);


/* =====================================================
   Download
===================================================== */

downloadButton.addEventListener(
    "click",
    () => {

        if (
            !translatedVisible &&
            lastBlocks.length
        ) {

            drawTranslation(
                lastBlocks
            );


            translatedVisible =
                true;


            compareButton.textContent =
                "↩ عرض الصورة الأصلية";

        }


        canvas.toBlob(
            blob => {

                if (!blob) {

                    setStatus(
                        "❌ تعذر إنشاء الصورة.",
                        "error"
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    "manga-translated-v4.png";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                setTimeout(
                    () =>
                        URL.revokeObjectURL(
                            url
                        ),
                    1000
                );

            },

            "image/png"

        );

    }
);
